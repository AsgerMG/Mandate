# Owner grades the judge is calibrated against. Insert-only: a grade is never
# edited here, a later grade of the same run is a new entry. `grade` is the
# owner's number (1-5) when given; when the owner graded in words, `words`
# holds them verbatim and `grade_range` the honest reading of them, and the
# entry counts for must/must_not checks but NOT for the +-1 agreement figure.
#
# Read by mandate/eval/bench_judge.py --calibration and by the report.
anchors:
  - run: mandate/eval/runs/bench/2026-11-10_fintech_guarantees.md
    case: fintech_guarantees
    graded_by: owner
    graded_on: 2026-11-10
    grade: null
    words: 'Right now, we have none of that.'
    grade_range: [1, 2]
    owner_must_failed: [must_3, must_4]      # Germany wrong, Italy wrong (EU right)
    owner_must_not_hit: [must_not_1, must_not_2]
    source: the run's grading block, written from the owner's round-3 interview
  # Not an owner grade, kept out of the agreement figure: the main session's
  # reading on 12 Nov that round 3 "matches the owner's answer in all four
  # markets" and that the robotics run "misses no must". Listed so the next
  # session does not mistake it for calibration data.
  - run: mandate/eval/runs/bench/2026-11-10_fintech_guarantees_round3.md
    case: fintech_guarantees
    graded_by: main-session (not the owner)
    graded_on: 2026-11-12
    grade: null
    words: matches the owner's answer in all four markets
    grade_range: null
  - run: mandate/eval/runs/bench/2026-11-11_robotics_deployment_it.md
    case: robotics_deployment_it
    graded_by: main-session (not the owner)
    graded_on: 2026-11-12
    grade: null
    words: misses no must
    grade_range: null
  # Added 13 Nov 2026 (trustworthy-eval), insert-only. The round-1 fintech verdict above
  # ("none of that", 1-2 band) is the only owner verdict on a RUN that exists in writing;
  # it is not repeated here. Below: the owner's own model answers, each a 5-anchor (what a
  # grade of 5 reads like). They are answers, not runs: `label` names the judgement record
  # a judging of the model answer would carry. They count for the anchor set, NOT for the
  # +-1 agreement figure, which needs owner grades of brain runs.
  - run: mandate/eval/scenarios/fintech_guarantees.yaml
    label: model_answer_fintech_guarantees
    kind: owner_model_answer
    case: fintech_guarantees
    graded_by: owner
    graded_on: 2026-11-10
    grade: 5
    words: the owner's model answer, round 3 interview (scenario field model_answer)
    grade_range: null
    agreement: false
    source: mandate/eval/scenarios/fintech_guarantees.yaml model_answer (owner, round 3, 10 Nov 2026)
  - run: mandate/eval/scenarios/forklift_spatial_dk_de.yaml
    label: model_answer_forklift_spatial_dk_de
    kind: owner_model_answer
    case: forklift_spatial_dk_de
    graded_by: owner
    graded_on: 2026-11-13
    grade: 5
    words: the owner's model answer, round 6 (scenario field model_answer)
    grade_range: null
    agreement: false
    source: mandate/eval/scenarios/forklift_spatial_dk_de.yaml model_answer (owner, round 6, 13 Nov 2026)

  # Owner grades given in the bench (Needs you, 17 Nov 2026), copied here before the
  # pre-arc runs were archived out of the bench. Numeric: they count for agreement.
  - run: mandate/eval/runs/loop/iter3/fintech_guarantees.md
    case: fintech_guarantees
    graded_by: owner
    graded_on: 2026-11-17
    grade: 4
    judge_grade_then: 4
    words: "this is pretty strong, prios, sequencing... here the biggest problem is still just receiving such a long text."
    source: bench review grade on the iter3 run
  - run: mandate/eval/runs/loop/iter3/forklift_spatial_dk_de.md
    case: forklift_spatial_dk_de
    graded_by: owner
    graded_on: 2026-11-17
    grade: 2
    judge_grade_then: 4
    words: "If they have a german hausbank, they might be able to get a loan that is guranantted by the state.... like having a physical subsidiary and employees may be a big time opener"
    source: bench review grade on the iter3 run
  - run: mandate/eval/runs/loop/heldout2/heldout_deeptech_fr_series_a.md
    case: heldout_deeptech_fr_series_a
    graded_by: owner
    graded_on: 2026-11-17
    grade: 2
    judge_grade_then: 2
    words: "Means to be way more focused on discovery, scoping, explore the first 3 critical questions that narrows who and what would be the right fit"
    source: bench review grade on the heldout2 run
  - run: mandate/eval/runs/loop/heldout2/heldout_hardware_nl_rd_relief.md
    case: heldout_hardware_nl_rd_relief
    graded_by: owner
    graded_on: 2026-11-17
    grade: 2
    judge_grade_then: 3
    words: "good ideas in here, but honestly... does not do the job - way too long text and non absorbable for start-ups. We need to have a way more conversational interface, visualisations"
    source: bench review grade on the heldout2 run
  - run: mandate/eval/runs/loop/heldout2/heldout_uk_scaleup_eu_plant.md
    case: heldout_uk_scaleup_eu_plant
    graded_by: owner
    graded_on: 2026-11-17
    grade: 2
    judge_grade_then: 2
    words: "Means to be way more focused on discovery, scoping, explore the first 3 critical questions that narrows who would be the right fit"
    source: bench review grade on the heldout2 run
