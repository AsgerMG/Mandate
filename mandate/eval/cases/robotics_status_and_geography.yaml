# Owner habit from the round 3b interview; the robotics run itself is not owner-graded
# (see _archive/robotics_three_levels.yaml), so only the owner's wording is carried here.
id: robotics_status_and_geography
brains: [wincent]
status: owner_habit
checks: [status_unlocks, open_door, who_decides]
tags: [deployment, equipment, status, startup_regime, intermediary, national, regional, local, smart_specialisation, economic_geography, political_read]
title: Below the national level. Match the status to its products, then narrow the regions by where the activity actually happens.
situation: >
  A company deploying equipment enters a country that is really three levels (national,
  regional, local) and holds, or could obtain, statuses that open different products at
  each level.
junior_move: >
  Treats the country as one level, lists every region, and guesses which products a
  status opens.
senior_move: >
  Lists what each status opens, per level, and leads with those. Narrows the regions by
  the economic geography of the activity and grounds each in the region's own strategy
  (Smart Specialisation, ERDF programme priorities), cited. Keeps the political read of
  the regions and ministries the plan relies on on the watchlist. In the case: Italy;
  statuses such as Art. 106 TUB, startup innovativa, an establishment in a region (and,
  as further examples of the same move, JEI in France, an establishment in a German
  Land); robot deployment points to the industrial north (Lombardia, Veneto, Piemonte,
  Emilia-Romagna, Toscana) and to Lazio (defence, the capital).
owner_verdict: >
  Playbook wording before generalisation (funding-routes.md §4e, owner round 3b):
  "'National' is three levels: national/federal, regional, local. A senior works all
  three, and narrows them twice: 1. By status. Once the company holds a status (Art. 106
  TUB, startup innovativa, JEI, an establishment in a Land), list the products that
  status opens, at each level, and lead with those. Status is matched, not guessed. 2. By
  economic geography. The activity decides which regions matter, and their priorities
  make the case. Example: robot deployment in Italy points to the industrial north
  (Lombardia, Veneto, Piemonte, Emilia-Romagna, Toscana) and to Lazio (defence, the
  capital). 3. Keep the political read current. Regional councils and giunte, ministry
  decrees, budget laws and reforms change what is open." §4d.2: "A licence, registration
  or authorisation that opens the door (Art. 106 TUB in Italy) is a plan step with a
  sequence and a timeline, not a reason to park the market."
source: mandate/eval/scenarios/robotics_deployment_it.yaml (owner interview round 3b, 11 Nov 2026); funding-routes.md §4d and §4e before generalise-method
