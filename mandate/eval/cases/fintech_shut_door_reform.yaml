id: fintech_shut_door_reform
brains: [wincent, regina]
status: owner_confirmed
checks: [reform_or_lobby, who_decides, what_not_yet]
tags: [guarantee, lender, no_licence, house_bank, shut_door, reform, parliament, ministry, head_of_department, political, workaround, partner_bank, lobby]
title: The formal door is shut for this applicant type, and the rules are moving. The route is the reform.
situation: >
  In one market public guarantees reach SMEs only through licensed banks; a non-bank lender
  has no route to them today. A reform touching that rule is moving in parliament.
junior_move: >
  Dresses up a workaround as the answer ("your route is a partner bank") and plans a
  partner-bank conversation, without saying there is no route and without finding the reform.
senior_move: >
  Says plainly: no route today for this applicant. Then makes the reform the route: finds
  it and its current state (researched and cited, never from memory), names the ministry
  that hosts it and the heads of department who can lift it to the political level, and
  gets the company in that room to help it accelerate. If nothing were moving, the change
  would become the company's lobby aim: the exact clause, the unit that owns it, the next
  moment it can change, on the watchlist. The workaround, if mentioned at all, is labelled
  as what it is and is not the recommendation.
owner_verdict: >
  "Germany: no way without a banking licence. Reforms are moving in parliament, so a good
  public-affairs advisor says: get in the room with the ministry hosting these
  conversations, with the right heads of department who can lift it to the political level
  and accelerate the reform." Round 1's partner-bank answer was graded wrong. Habit
  (funding-routes.md §4d.3): when the formal door is shut, the route is changing the rule.
source: mandate/eval/scenarios/fintech_guarantees.yaml (owner model answer); mandate/eval/runs/bench/2026-11-10_fintech_guarantees.md (owner grade block)
