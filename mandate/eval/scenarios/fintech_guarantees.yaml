# Eval case 1 (owner's example 1, plan Context). Funding & finance routes:
# a lender without a banking licence wants its loan portfolio guaranteed.
# Same format as edtech_ai_kids.yaml (the owner's): must / must_not.
id: fintech_guarantees
job: funding-routes
founder_says: >
  We are a fintech lender. We have raised EUR 40M. We want our SME loan
  portfolio guaranteed by public guarantee schemes in Germany, France and Italy,
  and at EU level. We do not have a banking licence. What are our routes?
profile_hint:
  name: Example Lending (eval case 1)
  description: >
    Fintech platform originating SME loans, funded by equity (EUR 40M raised)
    and institutional credit lines. No banking licence. Wants public guarantee
    cover on its loan portfolio in Germany, France, Italy and at EU level.
  sector: software_data_ai
  subsectors: [fintech]
  customerType: b2b
  markets: [EU, DE, FR, IT]
  developmentStage: scaling_revenue
# Used by the runner ONLY if Mandate asks the founder first (ask_founder).
# These are the eval's assumed answers, NOT the owner's; replace them with the
# owner's when the model answer is written.
founder_followup: >
  We are a German GmbH with no branches yet in France or Italy. We hold no
  banking, payment or investment-firm licence. We originate SME loans through
  our platform and fund them from a EUR 150M warehouse facility; the book is
  EUR 120M today and we want to reach EUR 500M in three years. We are not
  raising equity right now.
must:
  - Establishes structure before instruments - legal form, establishment per country, licences held - and asks only what the profile lacks.
  - Treats the missing banking licence as the deal-breaker it is and works it per jurisdiction (applicant type is formal; goodwill does not move it).
  - "Germany: explains the Hausbank principle, cited, and says plainly that WITHOUT a banking licence there is no guarantee route today; recommends the political route instead: engage the BMWE heads of department hosting the reform now moving in parliament, to accelerate it (reform state researched and cited)."
  - "Italy: open to portfolio guarantees; RECOMMENDS obtaining authorised financial-intermediary status under Art. 106 TUB (sequenced), as the unlock for the Fondo di Garanzia per le PMI, cited; does not park Italy for want of it."
  - "France: researches and cites the Bpifrance guarantee mechanics (guarantees to banks / credit institutions; Code monetaire et financier), never asserts them from instinct."
  - "EU: LEADS with InvestEU / EIF guarantees as the quickest route for a lender across member states, open to alternative lenders as financial intermediaries, cited; matches the product (digitalisation or SME competitiveness window; robot deployment fits digitalisation); flags the move of InvestEU under the European Competitiveness Fund as something to watch."
  - States where the company stands on each front, and the flags to fix (licence, establishment, sequencing).
  - Uses precedents - the same fund or institution backing a comparable lender or deal - or says explicitly there is none.
  - Maps the institutions (regional, national, EU) and names P1/P2 stakeholders per route (head of guarantees / alternative lending), political and public-capital sides.
  - Prioritises a few routes to run in parallel, with sequencing; parks rather than drops the rest; every recommended or parked route goes on the watchlist.
  - Saves prioritised next steps and at least one short, formal, strategic outreach draft (the paper-stack test, no AI voice).
must_not:
  - Offers a partner-bank workaround as Germany's answer instead of saying there is no route without a licence and pointing to the reform.
  - Parks Italy for want of 106 TUB status instead of recommending the status.
  - Spends the answer on German regional or federal programmes when the EU route is the open door.
  - Lists instruments before establishing the structure.
  - Asserts France guarantee mechanics, or any country-specific programme fact, without a citation.
  - Recommends applying for a banking licence as the default first step without weighing a partnership or intermediary route.
  - Generalises one country's rule to another.
  - Walks away from a route without an explicit hard no.

# The owner's model answer (round 3, 10 Nov 2026), verbatim in substance:
model_answer: >
  The quickest way to guarantees without a banking licence, for a lender
  operating across Italy, Germany and France, is to almost forget the German
  regional and federal agencies: it goes through the EU, with InvestEU
  guarantees, probably the digitalisation or SME competitiveness products
  (robot deployment fits digitalisation). Italy is more open and would
  guarantee portfolios, but the key is Art. 106 TUB status (authorised
  financial intermediary); once you have it, it is straightforward. A RAIF
  set-up alone does not give streamlined access to the Italian products.
  Germany: no way without a banking licence. Reforms are moving in
  parliament, so a good public-affairs advisor says: get in the room with the
  BMWE, the ministry hosting these conversations, with the right heads of
  department who can lift it to the political level and accelerate the reform.

# ── The simulated client (loop.py converse) ─────────────────────────────────
# The founder's side of a full conversation. `script` is the anticipated
# conversation, sent turn by turn (the same script before and after a playbook
# change is a real measurement). `move` names what each message tests; the
# judge checks the brain's reply against the move (mandate/eval/conversation.py
# MOVES; `expect` adds the case-specific part). `if_asked` answers a question
# the brain asks after that message (keywords, case-insensitive); a question
# nothing answers goes to the client agent (.claude/agents/client.md), which
# answers from `hidden_facts` in one short reply, then the script resumes.
client:
  persona:
    role: Co-founder and CEO, former credit investment banker
    tone: brisk, impatient with theory, wants a straight answer
    sophistication: high on credit and capital markets, low on public funding and state aid
  hidden_facts:
    - German GmbH, headquartered in Berlin. No branch, subsidiary or establishment in France or Italy; French and Italian loans are made cross-border from Germany, small volumes so far.
    - No banking, payment-institution or investment-firm licence of any kind. Lawyers said lending from our own balance sheet without deposits needs no German licence as structured; not sure that holds in Italy.
    - Loans are funded from a EUR 150M warehouse facility from two credit funds. The book is about EUR 120M today; target EUR 500M in three years.
    - Book split roughly 70% Germany, 20% Italy, 10% France.
    - Average SME loan about EUR 250k, 2 to 5 years, for working capital and equipment; borrowers have 10 to 200 staff.
    - Not raising equity now; maybe next year.
    - Nobody on the team has spoken to KfW, Bpifrance, the Italian Fondo di Garanzia or the EIF yet.
  max_turns: 10
  script:
    - move: opener
      says: "Hi. SME lending platform, no banking licence. Investors ask why we don't use public guarantees in Germany, France, Italy. Where do we start?"
      if_asked:
        - keywords: [legal form, incorporat, entity, gmbh, where are you based, headquarter, establish, branch, subsidiar]
          answer: German GmbH, Berlin. Nothing in France or Italy, no branches; we lend there cross-border from Germany, small volumes so far.
        - keywords: [licen, authoris, authoriz, regulated, bafin, permission]
          answer: No licence at all, no banking, payment or anything. Our lawyers said lending off our own balance sheet without deposits is fine in Germany. Not sure about Italy, honestly.
        - keywords: [fund the loans, funding, warehouse, credit line, book, portfolio size, volume, how big]
          answer: We fund from a 150 million warehouse facility, two credit funds. The book is about 120 million now, we want 500 in three years. Roughly 70 percent Germany, 20 Italy, 10 France.
        - keywords: [raising, round, equity]
          answer: Not raising right now. Maybe next year.
        - keywords: [loan size, ticket, tenor, maturity, what kind of loans, borrowers, purpose]
          answer: Average 250k, two to five years, working capital and equipment. Borrowers are SMEs with 10 to 200 people.
    - move: pushback
      says: >
        Hm. Germany is 70 percent of our book. KfW must have something for lenders
        like us. Why wouldn't we start there?
      expect: Holds that there is no German guarantee route without a banking licence (the Hausbank principle, cited) unless it finds a cited reason to update; turns Germany into the reform route instead of dropping it.
    - move: fact_change
      says: "News: we may buy a small Italian lender that already holds a 106 authorisation, closing Q2. Does that change Italy?"
      if_asked:
        - keywords: [size, how big, book, staff, what does it lend, consumer, sme]
          answer: Small, about 30 people, a consumer-loan book around 80 million, based in Milan. It does not lend to SMEs today.
        - keywords: [regulator, change of control, banca d'italia, approval]
          answer: Our lawyers mentioned the Bank of Italy has to approve the deal. That's all I know.
      expect: Re-runs Italy on the new fact (an acquired Art. 106 intermediary versus applying; change-of-control approval; whether its authorisation covers SME lending and Fund access), says what changes and what does not, and keeps the other fronts as they were.
    - move: pushback
      says: >
        My co-founder says we should just apply for a German banking licence and be
        done with it. Thoughts?
      expect: Weighs the licence against the intermediary and reform routes (cost, time, capital) and does not make it the default first step.
    - move: who_to_call
      says: >
        Fine. For the EU route, who exactly do I call, and can you draft the first
        email? I'll send it under my name.
      expect: P1 and P2 by function on the public-capital and political side for the EU route (e.g. the EIF's guarantee team, the national implementing partner), names only when verified, and a short formal draft that passes the paper-stack test.
    - move: this_week
      says: >
        What do I actually do this week? I have two days before I fly to Milan.
    - move: full_plan
      says: >
        Right. Give me the full plan as a board I can show my board on Thursday:
        routes per country, who, the sequence, what we park.
      expect: The board carries every front (EU, Germany, France, Italy) with open, shut and parked doors, a roadmap with the Italian status or acquisition step and the German reform track, a process map of at least one decision chain (the EIF guarantee application or the Italian authorisation), stakeholders P1/P2 per route, and a watch track.
    - move: decide
      says: >
        We'll go with your sequence. Write it up properly so I can circulate it.
