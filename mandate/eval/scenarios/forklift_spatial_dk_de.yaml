# Eval case from the owner (12 Nov 2026). must/must_not written by the main session from
# its critique (rounds 5) and corrected by the owner (round 6, 13 Nov); model_answer below.
id: forklift_spatial_dk_de
job: funding-routes
founder_says: >
  We build spatial-awareness hardware fitted to forklifts and other intralogistics
  vehicles, with monitoring software. HQ in Denmark (ApS) with a German subsidiary
  (GmbH). We deploy like a system integrator: we carry all upfront costs (hardware,
  installation, integration) and the customer pays only once everything runs. That
  working-capital burden holds back our scaling. What can we do at state level to get
  cheaper capital for this model? And we are about to raise an equity round: can we
  get public equity into the round?
founder_followup: >
  The Danish ApS signs most contracts, including German ones; hardware is assembled in
  Denmark from EU components. Hardware stays on our balance sheet until go-live, then
  passes to the customer. Revenue about EUR 6M, 45 staff. Raising EUR 12M Series A,
  lead in talks, close in about four months. The GmbH sits in Bavaria.
must:
  - Diagnoses the gap as a mispriced market (private lenders cannot price integrator project risk, so the rate is high) that public de-risking exists to fix, and ties the company's activity to a public mission (industrial renewal / automation deployment).
  - Leads with public de-risking of the company's OWN project and working-capital financing (guarantees on its lines, co-lending, revolving/project facilities), at the level with the open door (the Danish agency via the parent; EU guarantees via its banks/lessors; the German subsidiary's Hausbank route as second front), cited.
  - Frames the benefit as capital velocity: faster recycling of capital from project to project, a larger pipeline deployed faster.
  - Routes through intermediaries where public money flows that way (the client's own banks and lessors with EU backing; the funds public fund-of-funds back), and checks the channel's rules fit the client.
  - Gives the public-equity options for the round with their conditions and sequencing (co-investment in the term sheet before closing; pari passu, co-financing, positive equity), cited.
  - Explains the money logic in plain words (why equity is the dearest money for pre-financing deployments; what a guarantee does to the price).
  - Flags the regulatory question (machinery/product safety) in one line and pulls Regina in, without doing the regulatory analysis itself.
  - Asks only the decisive open questions.
must_not:
  - Recommends moving the upfront cost to the customer (buyer financing / leasing) as the lead route.
  - Says the EU level matters for equity only.
  - Leads with equity as the answer to the working-capital burden.
  - Reports "none found" for a fund-of-funds without pointing to the funds it backs.
  - Lists an instrument the client is excluded from (revenue, size, stage or location caps) as an option.
  - Does Regina's regulatory risk assessment itself instead of flagging it to Regina.
model_answer: >
  (Owner, round 6, in substance.) An integrator normally borrows from private lenders at
  a high rate because they cannot price the projects: it deploys hardware and the full
  integration, gets paid at the end, and only then can take on the next project. Remove
  that capital constraint and the pipeline scales much faster and larger. Do not move
  the cost to the customer; that makes the offer less competitive. The best outcome is
  that the public side takes the risk: de-risking loans into Europe's industrial renewal
  is aligned with public funders' missions. Wincent asks what the public side can do so
  the project scales without the capital constraint. The Machinery Regulation question is
  for Regina: Wincent flags it, pulls Regina in for a risk assessment, and Regina decides
  whether to raise it with the founder.
