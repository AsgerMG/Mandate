# HELD-OUT case (Fable mission, 12 Nov 2026) for Regina. Written from the method
# (regina.md, method.md "Before answering", the Regina agent's answer order), NOT from any
# run; no playbook was tuned on it. Checkpoints are Claude's reading of the method, to be
# confirmed or corrected by the owner or the expert at grading.
id: heldout_ai_hiring_tool_de_fr
job: policy-regulatory
held_out: true
status: draft_pending_owner
founder_says: >
  We are a Dutch B2B software company. Our product screens and ranks job applicants'
  CVs with AI for large employers. We want to sell in Germany and France from 2027. What
  regulation applies to us and to our customers, what must we have in place before the
  first contract, and who should we be talking to?
profile_hint:
  name: Example Hiring AI (held-out)
  sector: software_data_ai
  customerType: b2b
  usesAi: true
  handlesPersonalData: true
  markets: [NL, DE, FR]
founder_followup: >
  Dutch BV, 40 staff, Amsterdam. The product takes CVs and application answers, scores
  them against the job profile and ranks candidates; recruiters see the ranking and
  decide whom to interview. It runs on our own models trained on anonymised historic
  hiring data from customers. No video, no voice, no emotion inference. Customers would
  be employers with 1,000 or more staff. We have a DPO and ISO 27001.
must:
  - Asks for or uses the facts that decide the classification (what the system decides about people, who deploys it, which member states) and classifies under the AI Act by intended use, quoting the operative text for recruitment and selection, saying who is provider and who is deployer and what each owes.
  - States the AI Act application dates for the obligations that bite on this product as they stand today, researched and cited including the state of any postponement, never from memory.
  - "Separates the two questions: may the customer DO the activity (automated or AI-assisted candidate ranking under data-protection and employment law) from what the provider must have in place to SUPPLY it (conformity, documentation, registration), each with its own cited rule."
  - "National overlays per country, researched and cited, not generalised: in particular the employee-representation consultation or co-determination rules that bind the customer before deployment in each country, and any national data-protection specifics for employment."
  - Uses enforcement or case precedent on algorithmic hiring or employment data (regulator decisions, court rulings) with dates, cited, or says plainly none was found.
  - "Deal-breakers and sequencing: what must be in place before the first contract and before scale, in order, with a horizon; says what not to do yet (for example claiming certification before harmonised standards exist)."
  - Names the bodies and functions to engage, P1 and P2, per country (market-surveillance authority for AI, data-protection authority, the EU-level AI office function, employer associations as buyers' influencers), by function where names are not verified.
  - Ends with positioning that is grounded and politically appropriate, every live file on a watch, and one short formal outreach draft.
must_not:
  - Calls the product high-risk or not high-risk without tying it to the use and the annex wording.
  - States an AI Act date or a national rule without a citation.
  - Carries one member state's works-council or data-protection rule into the other.
  - Treats the provider's obligations as the customer's or the reverse.
  - Recommends claiming compliance or certification before the standards and assessment exist for it.
  - Lists the laws without saying what to do first.
