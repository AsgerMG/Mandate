# Policy / regulatory: an AI-native learning product for young children enters the EU.
#
# STATUS: DRAFT. The must / must_not below are Claude's draft, written BEFORE the
# subject-matter-expert interview (11 Nov 2026). They are NOT the expert's and must not be
# scored as ground truth until the expert has corrected them (module 7). There is NO
