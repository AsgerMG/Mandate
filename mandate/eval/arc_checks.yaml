# The consultation arc (mandate/playbooks/method.md, owner 17 Nov 2026), as checks
# appended to EVERY conversation judgement (conversation.with_arc_checks). They test
# how the case is run, whatever the case; the case's own must / must_not test what
# is said. They are appended after the case's own, prefixed "[arc]", so the
# checkpoint ids (must_N, must_not_N by position) keep their meaning; the ids
# below name them in this file only.
must:
  - id: arc_qualify
    text: "Opens by qualifying: a short read and at most three questions whose answers change which route fits, each with why; no routes catalogue, plan or draft in the first reply."
  - id: arc_investigate
    text: "Investigates between turns: comes back with what its research found and a next question grounded in that finding, narrowing rather than listing."
  - id: arc_options
    text: "Lays out the options (the landscape, with each door's status) before recommending, and asks what the founder leans toward."
  - id: arc_prioritise
    text: "Prioritises with the founder: the two or three that fit, why, and what each costs in time and effort."
  - id: arc_advise
    text: "Advises: the best way in and why it has the best chance, how to commence (first moves, who to call by function) and what to expect (the steps, what each needs to pass, timing)."
  - id: arc_brief
    text: "Closes with a brief of the whole sequence when the plan is agreed or the founder asks."
  - id: arc_visual
    text: "Draws the structure where the case has it: a chain of bodies as a hierarchy, ties across institutions as a network, a process with each step's gates."
  - id: arc_right_person
    text: "Names who to approach as the right UNIT at the right SENIORITY for the ask (not just the institution, not the top by default), current as the source states it (with its as-of date, and 'verify before contacting' where the source is old or self-reported), cited to the org chart or register."
must_not:
  - id: arc_not_one_shot
    text: "Gives the whole solution (routes, plan, stakeholders or drafts) in the first reply."
  - id: arc_not_early_draft
    text: "Writes an outreach draft before the advise stage without being asked."
  - id: arc_not_long
    text: "Sends long turns (well over 300 words of prose) that a founder cannot take in at one read, or repeats the board in prose, without being asked for depth."

# The founder's arc cues, slotted into every scripted client (conversation.with_arc_moves)
# so each conversation runs the whole arc. A case that already has a move of that name
# (or one named in `skip_if`) keeps its own. The script advances only when the brain
# stops asking, so qualifying and investigating happen before any cue is sent.
founder_moves:
  - move: options
    says: "OK, that is the picture. What are our options, broadly?"
    expect: "The landscape, drawn (a hierarchy where bodies sit under one another), every door with its status and one line why; no recommendation yet; asks which way we lean."
    after: [opener]
    skip_if: [options, narrow]
  - move: prioritise
    says: "Which two or three should we actually go for, and what will each cost us in time and effort?"
    expect: "The two or three that fit, why, and the cost of each; the rest parked with the reason; pushes back if our preference is unwise."
    before: [who_to_call, this_week, full_plan, decide]
    skip_if: [prioritise]
  - move: expect
    says: "If we go that way, how do we start, and what should we expect along the way?"
    expect: "The best way in and why it has the best chance; the first moves and who to call by function; the process drawn with what each step needs to pass, timing and odds."
    before: [this_week, full_plan, decide]
    skip_if: [expect]
  - move: brief
    says: "Good. Can you write this up as a brief for our board?"
    expect: "One brief of the whole sequence: the read, the routes, the priority and why, the plan, who, what to expect, the watchlist, the sources; the board complete."
    skip_if: [brief]
