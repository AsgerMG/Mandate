# THE ONE LIST of open loops (owner, 19 Nov 2026: "we never really finish anything").
# Every item ends `done` (with the date) or `parked` (with the TRIGGER that reopens it). No new scope
# starts while an item is `open` without a reason. Shown on the bench: Needs you -> Open loops.
# state: open | in_progress | waiting_owner | parked | done
# brain: wincent | regina | both  (which workspace shows it)
loops:
