    title: "Ties to ZIM, EXIST and the research tax allowance (programmes, not institutions)"
    brain: wincent
    state: in_progress
    next: "A tie may now end at a product (loader + network tool). Dry run: 2 ties (BMWE funds EXIST, BMFTR funds the research allowance) go to the owner with the DE people. ZIM waits on its product row (foerderdatenbank blocked: the census)."
