    title: "THE CENSUS: the map built from official registers, scoped by rule, one grid per body"
    brain: wincent
    state: parked
    trigger: "Starts when every other item here is done or parked (owner decision 19 Nov)."
  - id: storage_trims
    title: "Storage trims approved 18 Nov"
    brain: wincent
    state: parked
    trigger: "Database passes 3.5 GB (owner, 19 Nov). Vectors are already half precision (336 MB + 329 MB index); out-of-scope countries would save 47 MB of 1.7 GB. TODO: the weekly health check flags the size (not built yet)."
