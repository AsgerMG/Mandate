    title: "Two ties whose quote is not on the fetched page (Commission seat on the Chips JU; Welsh Government owns the Development Bank of Wales)"
    brain: wincent
    state: parked
    trigger: "Both pages render with JavaScript (the loader sees 2,800 chars, no governance text; EUR-Lex 202, alternatives 404). Reopens with a JavaScript-rendering fetch (headless Chrome is installed on the Mac) in the census."
