# mandate-platform: the code every brain shares (mandate/grounding, mandate/embedding).
#
# The import name is `mandate`, and the source tree IS this directory, so the
# wheel maps it explicitly: hatch cannot ship a package whose root is the
# project root by name. An editable install (what policy's uv source asks for)
# instead puts the REPO ROOT on sys.path (dev-mode-dirs), which makes `mandate`
# resolve to this very directory -- the same resolution capital gets from
# etl_env.py's sys.path line.
[project]
name = "mandate-platform"
version = "0.1.0"
description = "Mandate's shared grounding store and embedding module."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only the legacy local signals space (MiniLM) needs it; see embedding/spaces.py.
local = ["fastembed>=0.8.0"]
# Everything mandate/ needs to run its API, its eval and its tests. CI installs
# THIS (pip install "./mandate[test]"), never a list typed into the workflow:
# that list drifted from the code and failed CI on 9 Nov (anthropic).
test = ["pytest", "python-dotenv", "fastapi>=0.115", "uvicorn", "pyyaml", "anthropic", "pydantic", "pgserver; python_version < '3.13'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The WHOLE package ships, mapped under `mandate/`. It used to force-include a
# hand-kept list of subpackages (grounding, embedding, vocabulary, profile);
# runs.py, health/, refresh/, llm/ were added later and never listed, so the
# policy image had no `mandate.runs` and every Regina refresh since 7 Nov ran
# unrecorded (refresh_record_start_failed: No module named 'mandate.runs'),
# which left the weekly run waiting 8 h for a record that never came.
# Editable installs (laptops, tests) never saw it: they import the directory.
# test_wheel_ships_every_module.py now builds the wheel and fails on any gap.
dev-mode-dirs = [".."]
include = ["/**"]
exclude = ["tests", "eval/runs", "ops", "**/__pycache__", ".venv", "*.egg-info"]

[tool.hatch.build.targets.wheel.sources]
"" = "mandate"
