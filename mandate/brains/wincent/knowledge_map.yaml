# THE KNOWLEDGE MAP: everything Wincent should KNOW per market to draw the graphs, as a checklist
# the database is held up against (owner, 18 Nov: "map everything that we need to know first, so we
# can always hold it up against whether we actually know everything").
#
# It is a CHECKLIST, not a fact store: names and keys here are what to look for; nothing here is
# shown to a founder. A fact enters the database only through a loader, cited (migration 042).
# Coverage: `PYTHONPATH=. python3 -m mandate.eval.knowledge_coverage` (per market: held / missing).
#
# Four parts per market, the four things the graphs need:
#   institutions  the tree: key, name, kind, parent (key of the node above), level
#   products      flagship products under a node: key, name, offered_by, type
#   processes     key, title, for (a product or institution key)
#   roles         who is in charge: key, role, at (institution key)
#
# Status: DRAFT by Claude, 18 Nov 2026, from general knowledge; every line is to be confirmed by the
# loader against an official source, and the owner adds what a senior would expect that is missing.
# Germany is drafted in depth (the pilot); FR, IT, EU, UK at the top level only.

markets:
  DE:
    institutions:
      - {key: de.bund, name: Federal government, kind: ministry, level: national}
      - {key: de.bmwe, name: Federal Ministry for Economic Affairs and Energy (BMWE), kind: ministry, parent: de.bund, level: national}
