  quote: ist die Landesvertreterin oder der Landesvertreter des Finanzministeriums
  source: s11
- from: de.hb.swht
  to: de.hb.bab
  kind: oversees
  detail: named among BAB's competent supervisory authorities
  quote: Die Senatorin für Wirtschaft, Häfen und Transformation Zweite Schlachtpforte 3 28195 Bremen
  source: s12
- from: de.th.tmf
  to: de.th.tab
  kind: sits_on
