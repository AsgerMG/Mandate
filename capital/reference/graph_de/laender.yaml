# Org charts: '' = not verified; reasons in the comments. Ministry names follow the pages read (several Länder renamed ministries in 2026).
# de.he.hmdf link quote comes from a column-layout PDF; the TH link (s-tab) quote was read through a page summary tool, not raw HTML.
