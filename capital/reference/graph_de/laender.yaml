links:
- from: de.by.stmfh
  to: de.by.lfa
  kind: oversees
  detail: Rechtsaufsicht (legal supervision) of LfA by the Finance and Homeland ministry
  quote: Die Bank steht unter der Rechtsaufsicht des Staatsministeriums der Finanzen und für Heimat
  source: s1
- from: de.by.stmwi
  to: de.by.lfa
  kind: sits_on
  detail: the economy ministry's representative chairs the Verwaltungsrat
  quote: Den Vorsitz im Verwaltungsrat führt der Vertreter des Staatsministeriums für Wirtschaft, Landesentwicklung und Energie
  source: s1
- from: de.be.senfin
  to: de.be.ibb
  kind: sits_on
  detail: state secretary of the finance department sits on the Verwaltungsrat
  quote: Wolfgang Schyrocki, Staatssekretär der Senatsverwaltung für Finanzen
  source: s2
- from: de.bb.mdf
  to: de.bb.ilb
  kind: oversees
  detail: state supervision (Aufsichtsbehörde) of ILB
  quote: Die staatliche Aufsicht über die Bank führt das Ministerium der Finanzen
  source: s3
- from: de.he.hmdf
  to: de.he.wibank
  kind: sits_on
  detail: Hessian finance minister listed in the WIBank Wirtschafts- und Infrastrukturbank-Ausschuss (Geschäftsbericht 2024; column layout of the PDF)
  quote: Hessisches Ministerium der Finanzen
  source: s4
- from: de.mv.fm
  to: de.mv.lfi
  kind: sits_on
  detail: finance ministry representative chairs the LFI Kuratorium
  quote: Vorsitzende Dr. Carola Voß Ministerium für Finanzen und Digitalisierung Mecklenburg-Vorpommern
  source: s5
- from: de.ni.mf
  to: de.ni.nbank
  kind: sits_on
  detail: state secretary of the finance ministry is first deputy chair of the Verwaltungsrat
  quote: 1. Stellvertretende Vorsitzende Staatssekretärin Sabine Tegtmeyer-Dette - Niedersächsisches Finanzministerium
  source: s6
- from: de.rp.mf
  to: de.rp.isb
  kind: oversees
  detail: legal supervision and technical supervision for guarantees
  quote: Ministerium der Finanzen Rheinland-Pfalz Kaiser-Friedrich-Straße 5 55116 Mainz (Rechtsaufsicht sowie Fachaufsicht für Bürgschaften und Garantien)
  source: s7
- from: de.rp.mwtek
  to: de.rp.isb
  kind: oversees
  detail: technical supervision except guarantees
  quote: Ministerium für Wirtschaft, Tourismus, Energie und Klima des Landes Rheinland-Pfalz Stiftsstraße 9 55116 Mainz (Fachaufsicht, außer Bürgschaften und Garantien)
  source: s7
- from: de.sl.mwide
  to: de.sl.sikb
  kind: sits_on
  detail: state secretary of the economy ministry chairs the Aufsichtsrat
  quote: Vorsitzende des Aufsichtsrates Elena Yorgova-Ramanauskas Staatssekretärin Ministerium für Wirtschaft, Innovation, Digitales und Energie
  source: s8
- from: de.sn.smf
  to: de.sn.sab
  kind: owns
  detail: the finance ministry exercises the rights of the Gewährträger (the Free State)
  quote: Die Rechte des Gewährträgers nimmt das Staatsministerium der Finanzen wahr
  source: s9
- from: de.sn.smf
  to: de.sn.sab
  kind: sits_on
  detail: the finance minister chairs the Verwaltungsrat
  quote: Vorsitzender des Verwaltungsrats ist der Staatsminister der Finanzen
  source: s9
- from: de.sn.smf
  to: de.sn.sab
  kind: oversees
  detail: supervisory authority; statute changes need its consent
  quote: Zustimmung des Staatsministeriums der Finanzen als Aufsichtsbehörde
  source: s9
- from: de.st.mf
  to: de.st.ib
  kind: oversees
  detail: Rechtsaufsicht over Investitionsbank Sachsen-Anhalt
  quote: wird die Rechtsaufsicht vom Ministerium der Finanzen
  source: s10
- from: de.sh.fm
  to: de.sh.ibsh
  kind: sits_on
