# Batch eifo_investeu: banks, lessors, guarantee institutions and funds that ALREADY carry
# EIF / InvestEU or national fund-of-funds (KfW Capital) backing, per market. Loaded into
# capital.intermediaries (migration 041) by capital/ETL/terms/load_batch_eifo_investeu.py;
# read by Wincent's find_intermediaries tool.
#
# Every row is cited to the publishing institution's own list: the EIF's InvestEU portfolio
# guarantee and equity lists as of 31/12/2025 (one quote per programme line, verbatim) or KfW
# Capital's fund portfolio page. Selection (cap ~60, quality first): in DK, DE, IT, FR, NL, SE,
# BE, ES, the banks, lessors, specialised lenders, guarantee institutions and promotional banks
# holding at least one of the four SME debt products (SME Competitiveness, Innovation and
# Digitalisation, Sustainability SIW/SMEW): all of them in DK, DE and BE, the national champions,
# lessors and guarantee institutions elsewhere. Microfinance-only, skills-only and
# creative-sector-only signatories are left out. UK: InvestEU does not cover the UK, so its rows
# are UK-based managers in KfW Capital's fund portfolio. EU: the EIF itself.
#
# product_types: what the intermediary offers the company under that backing: a Direct Guarantee
# signatory lends (loan) or, for a lessor, leases (lease); a Counter Guarantee signatory issues
# guarantees (guarantee); a fund invests (equity). `kind` is ours, from the name and the list's
# support type; `backing_detail` is the list's own figures. A newer list is a NEW batch.

