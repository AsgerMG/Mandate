# Batch 1, Italy: the six regions' Smart Specialisation Strategy (S3) 2021-2027 priority domains.
#
# Why: a senior narrows by economic geography (playbook §4e.2). Robot deployment points to the
# industrial north and Lazio; the regions' OWN strategies make the case, cited. Loaded into
# capital.region_priorities. `priority` is the region's own words (each is located verbatim in
# `quote`); `activity_tags` is OUR mapping from that name to the activity vocabulary
# match_status / region_fit read (tag_basis says so). Insert-only.

regions:
  - {nuts: ITC4, region: Lombardia, doc: s3_lombardia, strategy: "S3 2021-2027 (DGR XI/4155/2020, updated DGR 5466/2025)",
     quote: "ECOSISTEMI DELL'INNOVAZIONE IN REGIONE LOMBARDIA"}
  - {nuts: ITH3, region: Veneto, doc: s3_veneto, strategy: "S3 2021-2027 (DGR 474 of 29 April 2022)",
     quote: "il passaggio da 4 a 6 ambiti di specializzazione ovvero"}
  - {nuts: ITC1, region: Piemonte, doc: s3_piemonte, strategy: "S3 2021-2027 (DGR 43-4315 of 10 December 2021)",
     quote: "i Sistemi Prioritari dell’innovazione (SPI), evoluzione delle aree di specializzazione della precedente S3: Aerospazio; Mobilità Sostenibile; Manifattura avanzata; Tecnologie, risorse e materiali verdi; Food; Salute."}
  - {nuts: ITH5, region: Emilia-Romagna, doc: s3_emilia_romagna, strategy: "S3 2021-2027 (Assemblea legislativa delibera 45 of 30 June 2021)",
     quote: "La nuova Strategia S3 ha individuato 15 ambiti tematici prioritari e 8 aree di specializzazione strategica: agroalimentare, edilizia e costruzioni, meccatronica e motoristica, industrie della salute e del benessere, industrie culturali e creative, innovazione nei servizi, digitale e logistica, energia e sviluppo sostenibile, turismo. A queste si aggiungono due nuove aree ad alto potenziale di sviluppo: la space economy e il settore delle grandi infrastrutture critiche o complesse."}
  - {nuts: ITI1, region: Toscana, doc: s3_toscana, strategy: "S3 2021-2027 (DGR 1321 of 28 November 2022)",
     quote: "Ambiente, territorio ed energia Cultura e beni culturali Salute Smart agrifood Impresa intelligente e sostenibile."}
  - {nuts: ITI4, region: Lazio, doc: s3_lazio, strategy: "RIS3 2021-2027 update (DGR 997 of 30 December 2021)",
     quote: "Il principale elemento di novità rispetto alla Strategia 2014-2020 riguarda l’introduzione di due nuove Aree di Specializzazione (AdS): “Automotive” ed “Economia del Mare”."}

