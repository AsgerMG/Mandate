# The gate that was missing. Every check here already existed and was run by
# hand; during the audit a broken build reached main because a commit ran on a
# separate line from a failing typecheck. Verification nobody is forced to run
# is verification that eventually does not happen.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: types, contracts, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      # The code fingerprint a verdict is bound to has exactly one
      # implementation, in ETL/lib/guard_verdicts.py, and the checks below shell
      # out to it rather than carrying a second one. A second implementation of
      # a fingerprint is a fingerprint of two different things the first time
      # either changes.
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci

      # No DATABASE_URL in CI by design, and now by more than convention. The
      # checks that need the corpus run where the corpus already is and publish
      # a verdict; the ones below read committed artifacts, or read those
      # verdicts over plain HTTPS. Handing this workflow a connection string
      # would widen the blast radius of one compromised job from "can read our
      # code" to "can read and write every award, company and fund we hold" —
      # and ETL/schema/check_guard_registry.py fails the build if one comes back.
      - name: Typecheck
        run: npx tsc --noEmit

      # Unit tests over the modules where production bugs actually lived:
      # the eligibility evaluator, the request sanitiser, watch-only detection
      # and cost accounting. Coverage has a floor so tests cannot be deleted
      # to make a build pass.
      - name: Unit tests
        run: npx vitest run --coverage

      # The output contracts must still describe the report we actually build.
      # The job is already named "contracts" for the vocabulary one; this is
      # the other half, and without it a contract can name a dead schema field
      # or leave a hard rule unenforced with nothing to notice.
      # A Next segment config must be a literal. `export const revalidate =
      # SOME_CONSTANT` fails the whole production build with a message naming
      # no file -- three pages carried it, so fixing two changed nothing, and
      # every Vercel deploy failed until someone read the logs.
      - name: Segment config is a literal
        run: npx tsx scripts/check_revalidate_literal.ts

      - name: Output contracts
        run: npx tsx scripts/check_contracts.ts

      # No number a visitor reads is a literal the corpus does not produce.
      # Hermetic: TypeScript source plus two COMMITTED artifacts, no database
      # and no credentials, so it cannot pass by finding nothing to read — and
      # it self-tests its own detector on every run before it judges the site.
      - name: Rendered numbers come from the corpus
        run: npx tsx scripts/check_rendered_numbers.ts

      # The same property for the numbers the owner plans on rather than the
      # ones a visitor reads. Three headline figures were retracted in one day
      # and two had been reported twice before anyone caught them; all three
      # were written into a planning document with the run that produced them
      # kept nowhere. Hermetic, self-testing, and it fails when a published
      # figure and its committed recomputation disagree.
      - name: Published figures name where they came from
        run: npx tsx scripts/check_published_figures.ts

      # Credentials load in one place, and a harness that needs them says so.
      # Free and hermetic — it reads source and runs nothing — and it belongs
      # in CI rather than only in `npm run check`, because the thing it stops
      # is somebody pasting the old env preamble back into a NEW script, which
      # arrives by pull request.
      - name: One env loader
        run: npx tsx scripts/check_env_loader.ts

      - name: Vocabulary contract
        run: npx tsx scripts/check_vocabularies.ts
        env: { NO_PG: '1' }

      - name: Archetype regression
        run: npx tsx scripts/check_archetypes.ts
        env: { NO_PG: '1' }

      - name: Per-request payload budget
        run: npx tsx scripts/check_payload_budget.ts

      # ── Checks that were in `npm run check` and in no automatic path ───────
      # Every one of these reads committed artifacts only. They were left out of
      # CI on the assumption that "needs the corpus" and "cannot run in CI" were
      # the same set; they are not, and these eight ran only when somebody typed
      # the command. That is how the fallback corpus reached 205 instruments out
      # of date on liveness, showing 26% of founders at least one dead call.
      #
      # `if: always()` so one failure does not hide the other seven. A run that
      # stops at the first red tells you one thing about a build that may be
      # wrong in four ways.
      - name: Liveness has one definition
        if: always()
        run: npx tsx scripts/check_liveness.ts
      - name: Offer routes are sourced
        if: always()
        run: npx tsx scripts/check_offer_route.ts
      - name: Regions match the NUTS reference
        if: always()
        run: npx tsx scripts/check_regions.ts
      - name: Theme index is not stale
        if: always()
        run: npx tsx scripts/check_theme_index.ts
      - name: Leaf cap headroom
        if: always()
        run: npx tsx scripts/check_leaf_cap.ts
      - name: Client modules reach no server-only import
        if: always()
        run: npx tsx scripts/check_client_boundary.ts
      # Reads the committed snapshot and deletes DATABASE_URL on its way past,
      # so it needs no credential and never has. It was in `npm run check` and
      # nowhere else -- and at position 17 of a 27-link `&&` chain whose 14th
      # link is red, so it had not run at all.
      - name: Every intake value reaches some publishable fund
        if: always()
        run: npx tsx scripts/check_capital_reach.ts
      - name: The recall set does not leak its answers
        if: always()
        run: npx tsx scripts/check_recall_leaks.ts
      # Both of the next two describe themselves as hermetic and are: the
      # committed corpus snapshot plus, for the second, a committed artifact.
      # No database, no credentials, sub-second, and neither can pass by having
      # nothing to read -- each fails outright on an empty scope. They were in
      # `npm run check` and in NO automatic path, which is what
      # ETL/schema/check_guard_reachability.py was red about.
      #
      # A filter that can REJECT an answer must be able to ACCEPT one. A
      # structural, cited comparator that admits nobody makes assessInstrument
      # return `blocked`, and blocked never reaches the founder -- the fund is
      # hidden from exactly the applicants it admits, with nothing on screen to
      # say so. That arrives by pull request, so it belongs here.
      - name: A filter that can reject someone can admit someone
        if: always()
        run: npx tsx scripts/check_comparator_admits.ts
      # The coverage ratchet on the open-question classification. An
      # unclassified requirement is never offered as a question and reads
      # exactly like "there was nothing worth asking", so a corpus that grows
      # past its artifact stops being askable in silence. The ceiling may fall,
      # never rise.
      - name: Open questions still cover the corpus
        if: always()
        run: npx tsx scripts/check_open_question_class.ts
      # Third of the same class, found by the same audit. It DELETES
      # DATABASE_URL on its way past and reads the committed snapshot, so it is
      # hermetic by construction rather than by luck. It holds the stand-in for
      # missing sector history inside the band where "neutral" is true of THIS
      # corpus -- the half a hand-built fixture cannot see, because the defect it
      # replaced (a constant 0.5 sitting at the 79th percentile) was invisible in
      # code and only visible against the data.
      - name: The stand-in for missing data is still neutral
        if: always()
        run: npx tsx scripts/check_missing_data_neutral.ts
      # The one ranking signal CI can actually see. `check_recall_floor` needs
      # DATABASE_URL and VOYAGE_KEY, so it has never run here and never will;
      # a regenerated peer prior cost ten graded cases and stayed green through
      # roughly fifteen merges because compile and typecheck were the only
      # things watching. This grades the committed prior against the committed
      # answer key in under a second, with no credential.
      - name: The peer prior still carries the funds companies won
        if: always()
        run: npx tsx scripts/check_peer_prior_canary.ts
      # The other thing the committed answer key can prove without a credential,
      # and the worst defect class this product has: a fund hidden from someone
      # who qualifies. A territorial screen removes an instrument whose own
      # notification declares a region the applicant is not in -- and a remit
      # attaches to the establishment doing the work, not to the registered
      # seat, so 15 companies the register says WON a fund are excluded from it
      # by our own screen. That number is a RATCHET here: it may fall, never
      # rise, and raising the ceiling is not a fix.
      - name: A company is never screened out of a fund it won
        if: always()
        run: npx tsx scripts/check_winner_not_blocked.ts
      # Skips honestly: data/raw/instrument_docs is gitignored, so there is
      # nothing here to verify a quotation against. Kept in CI anyway — the skip
      # is one line of output that says so, and its absence from any automatic
      # path is what let it be forgotten.
      - name: Quotations match their documents
        if: always()
        run: npx tsx scripts/check_extracted_quotes.ts

      # ── The published verdicts ─────────────────────────────────────────────
      # The guards that cannot run here, asserted without a credential. Reads
      # the site's /api/guards over HTTPS: has each corpus-side guard published,
      # is it green, and was it judged on THIS code. Deliberately not --full;
      # freshness belongs to the scheduled workflow, so the passage of a Sunday
      # cannot red a branch that did nothing wrong.
      - name: Guards that need the corpus have green verdicts
        if: always()
        run: npx tsx scripts/check_verdicts.ts

      # The site's committed headline figures against what the ETL last
      # recorded. This used to need DATABASE_URL and therefore ran only in a
      # scheduled job holding a secret; the census now publishes itself onto the
      # same feed, so it runs here on every pull request with no credential.
      - name: Site serves the corpus the ETL produced
        if: always()
        run: npx tsx scripts/check_corpus_census.ts

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npx next build
        env: { NEXT_TELEMETRY_DISABLED: '1' }

  etl:
    name: python syntax + schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Compile-checks every ETL module. Cheap, and it catches the class of
      # error that otherwise only surfaces mid-pipeline on a long run.
      - name: Byte-compile the ETL
        run: python3 -m compileall -q ETL website/build

      # The SQL schema must match what the code expects. A drifted schema file
      # is worse than none: it reads as authoritative while being wrong.
      - name: Postgres schema is committed
        run: test -f ETL/schema/postgres_schema.sql

      # Country name resolution lives in exactly one place. Copies drift in
      # coverage and an unresolvable name writes a NULL country rather than
      # raising, so the drift is silent.
      - name: One country map
        run: python3 ETL/schema/check_single_country_map.py

      - name: Country resolution
        run: python3 ETL/lib/test_europe_scope.py

      # Which fund an award is credited to decides what the answer key can
      # name, and a wrong credit reads as recall rather than as an error. Runs
      # on an in-memory corpus, so it needs no database.
      - name: Award attribution
        run: python3 ETL/terms/test_attribution.py

      # A spec can be syntactically valid, pass the vocabulary check, and still
      # mean the opposite of its source document.
      - name: Encoded rule sanity
        run: python3 ETL/schema/check_spec_sanity.py

      # The gate that refuses to publish a corpus that got worse. It failed a
      # run in which every axis GAINED instruments, and it could not see a loss
      # that came with a shrinking corpus at all. Both are asserted from the
      # committed baselines, so neither can come back.
      - name: Coverage gate separates loss from dilution
        run: python3 ETL/terms/test_coverage_gate.py

      # A membership test between two disjoint vocabularies is dead code, and
      # dead code in the middle of the split is invisible: it does not fail, it
      # just stops splitting. `split_families()` returned channel labels while
      # the caller compared rollup ids, so the SATR scheme split was off for all
      # 22 countries for ten days and the only symptom was a placement rate in
      # another module. Credential-free fixture, milliseconds, so it runs here
      # where the corpus cannot.
      - name: The split's target set is in the caller's value space
        run: python3 ETL/events/load/test_split_value_space.py

      # `funding_instruments` has two provenances: rows aggregated from events,
      # and rows other scripts insert additively for funds that have paid out
      # nothing we hold (open calls, hand-curated frameworks). The rebuild read
      # "not in my output" as "disappeared" and deleted 90 of the second kind
      # plus 629 gates encoded from their own published eligibility text. The
      # 20%-of-curated guard did not fire; 629 of 7,471 is 8%.
      - name: A rebuild deletes only the instrument rows it authored
        run: python3 ETL/events/load/test_external_instrument_ownership.py

      # The same class again, one column over and far more expensive: the split
      # keyed a child on `name` while the ETL renamed 430 of 453 children to the
      # Commission's registered scheme title. Placement read 11.5% instead of
      # 41.9% and seven countries instead of 22, and it looked like decay rather
      # than a dead join for a week.
      - name: The split's key is not a name something else rewrites
        run: python3 ETL/terms/test_split_key_is_not_a_name.py

      # The corpus census runs inside the ETL image, which has requirements.txt
      # and nothing else. It reached production importing pandas three modules
      # down and recorded a ModuleNotFoundError instead of the corpus figures --
      # invisibly, because it records a failed block rather than crashing.
      - name: The census can run in the ETL image
        run: python3 ETL/schema/check_census_imports.py

      - name: Cross-language constants
        run: python3 ETL/schema/check_cross_language_constants.py

      # Every table has ONE declared authoritative store, the count still owned
      # by SQLite may only fall, and no module may rebuild a Postgres-owned
      # table out of a SQLite connection. That last rule is what stops
      # "Postgres is the source of truth" from being a sentence the code
      # contradicts: moving a table's declaration fails until its write path
      # has actually moved.
      # Every migration id resolves to exactly one function and one file.
      # MIGRATIONS is a hand-written dict, and two functions with the same name
      # are collapsed by Python without a word -- so the dict stays well-formed
      # while one migration silently ceases to exist. That happened four times
      # in one week, twice while it was being fixed and twice more while the
      # fixes were being merged. `--ids` reads committed source only, so it
      # needs no corpus and no credentials, which is what CI has.
      - name: Every migration id is reachable
        run: python3 ETL/events/load/migrations/apply.py --ids

      # Fifteen columns of the live corpus were created by no committed
      # statement -- four of them by somebody typing ALTER at a prompt -- so
      # replaying schema.sql plus every migration into an empty database did not
      # produce this project's schema, it produced `no such column: scheme_code`.
      # Needs no corpus and no credentials: it builds the store it checks.
      - name: The schema can be rebuilt from its own migrations
        run: python3 ETL/schema/check_schema_replay.py

      - name: One store of record per table
        run: python3 ETL/schema/check_store_of_record.py

      # The corpus-marks guard itself cannot run here -- data/db.sqlite is
      # gitignored and lives on a Railway volume, so it runs in ETL/refresh.py
      # and on the weekly cron and publishes a verdict. But its SELF-TEST can:
      # it builds three throwaway stores (clean, opened-and-never-closed, closed
      # as partial) in a temp dir and asserts the guard fails on the last two and
      # on neither of the first. Credential-free, milliseconds, no corpus.
      # Without this the only proof that the publishing guard can go red is that
      # somebody once typed the flag.
      - name: The unfinished-run guard can still fail
        run: python3 ETL/schema/check_corpus_marks.py --self-test

      # Committed DDL must account for every column in every store. The
      # BETWEEN-STORES half needs the corpus and DATABASE_URL, which CI has
      # neither of by design, so it runs on the weekly cron and publishes a
      # verdict; this is the half that reads committed files only. It found a
      # git conflict marker sitting inside ETL/schema/postgres_schema.sql --
      # the file the step above asserts the EXISTENCE of.
      - name: Committed DDL accounts for every column
        run: python3 ETL/schema/check_store_schema.py

      # What we TRACK and what we OFFER are two populations. That check has
      # MOVED to the weekly Railway cron and is deliberately not here, because
      # here it could never run: data/db.sqlite is gitignored, so on every run
      # it has ever had it printed "skipping" and returned 0. It now executes
      # against the volume-resident corpus and publishes a verdict the frontend
      # job asserts on without credentials.
      #
      # This is the check on that arrangement: every registered guard has
      # exactly one publisher, every publisher is registered, each verdict is
      # bound to its own implementation — and no workflow holds a credential of
      # ours, which is the reason the arrangement exists at all.
      - name: Every guard has a publisher, and no workflow has a secret
        run: python3 ETL/schema/check_guard_registry.py

      # The other direction, and the one nothing could see. The check above
      # asserts that every REGISTERED guard has a publisher; it is blind to a
      # check_* module that was never registered, never added to a workflow and
      # never added to the cron -- which on 2026-08-08 was eight of them, two
      # red at the moment they were found. Reads committed source only.
      - name: Every guard runs somewhere, or says why it does not
        run: python3 ETL/schema/check_guard_reachability.py

      # The same question one layer down, about the DATA. Four artifacts read at
      # request time on the production ranking path were produced by commands no
      # pipeline ran and compared against nothing -- peerPrior, the signal worth
      # 19 points of exact-scheme recall, was measured naming 16 funds the corpus
      # no longer contained. Credential-free: committed source only.
      - name: Every committed artifact can be rebuilt, and something watches it
        run: python3 ETL/schema/check_artifact_reachability.py

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: website/frontend/package-lock.json }
      - run: npm ci
      # Wraps npm audit with a reviewed exceptions register: fails on anything
      # high or critical that is NOT documented, and fails when an exception
      # passes its review date. A check that cannot pass is a check people
      # learn to skip.
      - name: Dependency audit
        run: npx tsx scripts/check_dependencies.ts
