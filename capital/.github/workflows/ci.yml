# The gate that was missing. Every check here already existed and was run by
# hand; during the audit a broken build reached main because a commit ran on a
# separate line from a failing typecheck. Verification nobody is forced to run
# is verification that eventually does not happen.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: types, contracts, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      # The code fingerprint a verdict is bound to has exactly one
      # implementation, in ETL/lib/guard_verdicts.py, and the checks below shell
      # out to it rather than carrying a second one. A second implementation of
      # a fingerprint is a fingerprint of two different things the first time
      # either changes.
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci

      # No DATABASE_URL in CI by design, and now by more than convention. The
      # checks that need the corpus run where the corpus already is and publish
      # a verdict; the ones below read committed artifacts, or read those
      # verdicts over plain HTTPS. Handing this workflow a connection string
      # would widen the blast radius of one compromised job from "can read our
      # code" to "can read and write every award, company and fund we hold" —
      # and ETL/schema/check_guard_registry.py fails the build if one comes back.
      - name: Typecheck
        run: npx tsc --noEmit

      # Unit tests over the modules where production bugs actually lived:
      # the eligibility evaluator, the request sanitiser, watch-only detection
      # and cost accounting. Coverage has a floor so tests cannot be deleted
      # to make a build pass.
      - name: Unit tests
        run: npx vitest run --coverage

      # The output contracts must still describe the report we actually build.
      # The job is already named "contracts" for the vocabulary one; this is
      # the other half, and without it a contract can name a dead schema field
      # or leave a hard rule unenforced with nothing to notice.
      - name: Output contracts
        run: npx tsx scripts/check_contracts.ts

      # Credentials load in one place, and a harness that needs them says so.
      # Free and hermetic — it reads source and runs nothing — and it belongs
      # in CI rather than only in `npm run check`, because the thing it stops
      # is somebody pasting the old env preamble back into a NEW script, which
      # arrives by pull request.
      - name: One env loader
        run: npx tsx scripts/check_env_loader.ts

      - name: Vocabulary contract
        run: npx tsx scripts/check_vocabularies.ts
        env: { NO_PG: '1' }

      - name: Archetype regression
        run: npx tsx scripts/check_archetypes.ts
        env: { NO_PG: '1' }

      - name: Per-request payload budget
        run: npx tsx scripts/check_payload_budget.ts

      # ── Checks that were in `npm run check` and in no automatic path ───────
      # Every one of these reads committed artifacts only. They were left out of
      # CI on the assumption that "needs the corpus" and "cannot run in CI" were
      # the same set; they are not, and these eight ran only when somebody typed
      # the command. That is how the fallback corpus reached 205 instruments out
      # of date on liveness, showing 26% of founders at least one dead call.
      #
      # `if: always()` so one failure does not hide the other seven. A run that
      # stops at the first red tells you one thing about a build that may be
      # wrong in four ways.
      - name: Liveness has one definition
        if: always()
        run: npx tsx scripts/check_liveness.ts
      - name: Offer routes are sourced
        if: always()
        run: npx tsx scripts/check_offer_route.ts
      - name: Regions match the NUTS reference
        if: always()
        run: npx tsx scripts/check_regions.ts
      - name: Theme index is not stale
        if: always()
        run: npx tsx scripts/check_theme_index.ts
      - name: Leaf cap headroom
        if: always()
        run: npx tsx scripts/check_leaf_cap.ts
      - name: Client modules reach no server-only import
        if: always()
        run: npx tsx scripts/check_client_boundary.ts
      - name: The recall set does not leak its answers
        if: always()
        run: npx tsx scripts/check_recall_leaks.ts
      # Skips honestly: data/raw/instrument_docs is gitignored, so there is
      # nothing here to verify a quotation against. Kept in CI anyway — the skip
      # is one line of output that says so, and its absence from any automatic
      # path is what let it be forgotten.
      - name: Quotations match their documents
        if: always()
        run: npx tsx scripts/check_extracted_quotes.ts

      # ── The published verdicts ─────────────────────────────────────────────
      # The guards that cannot run here, asserted without a credential. Reads
      # the site's /api/guards over HTTPS: has each corpus-side guard published,
      # is it green, and was it judged on THIS code. Deliberately not --full;
      # freshness belongs to the scheduled workflow, so the passage of a Sunday
      # cannot red a branch that did nothing wrong.
      - name: Guards that need the corpus have green verdicts
        if: always()
        run: npx tsx scripts/check_verdicts.ts

      # The site's committed headline figures against what the ETL last
      # recorded. This used to need DATABASE_URL and therefore ran only in a
      # scheduled job holding a secret; the census now publishes itself onto the
      # same feed, so it runs here on every pull request with no credential.
      - name: Site serves the corpus the ETL produced
        if: always()
        run: npx tsx scripts/check_corpus_census.ts

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npx next build
        env: { NEXT_TELEMETRY_DISABLED: '1' }

  etl:
    name: python syntax + schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Compile-checks every ETL module. Cheap, and it catches the class of
      # error that otherwise only surfaces mid-pipeline on a long run.
      - name: Byte-compile the ETL
        run: python3 -m compileall -q ETL website/build

      # The SQL schema must match what the code expects. A drifted schema file
      # is worse than none: it reads as authoritative while being wrong.
      - name: Postgres schema is committed
        run: test -f ETL/schema/postgres_schema.sql

      # Country name resolution lives in exactly one place. Copies drift in
      # coverage and an unresolvable name writes a NULL country rather than
      # raising, so the drift is silent.
      - name: One country map
        run: python3 ETL/schema/check_single_country_map.py

      - name: Country resolution
        run: python3 ETL/lib/test_europe_scope.py

      # A spec can be syntactically valid, pass the vocabulary check, and still
      # mean the opposite of its source document.
      - name: Encoded rule sanity
        run: python3 ETL/schema/check_spec_sanity.py

      # The gate that refuses to publish a corpus that got worse. It failed a
      # run in which every axis GAINED instruments, and it could not see a loss
      # that came with a shrinking corpus at all. Both are asserted from the
      # committed baselines, so neither can come back.
      - name: Coverage gate separates loss from dilution
        run: python3 ETL/terms/test_coverage_gate.py

      # The corpus census runs inside the ETL image, which has requirements.txt
      # and nothing else. It reached production importing pandas three modules
      # down and recorded a ModuleNotFoundError instead of the corpus figures --
      # invisibly, because it records a failed block rather than crashing.
      - name: The census can run in the ETL image
        run: python3 ETL/schema/check_census_imports.py

      - name: Cross-language constants
        run: python3 ETL/schema/check_cross_language_constants.py

      # Every table has ONE declared authoritative store, the count still owned
      # by SQLite may only fall, and no module may rebuild a Postgres-owned
      # table out of a SQLite connection. That last rule is what stops
      # "Postgres is the source of truth" from being a sentence the code
      # contradicts: moving a table's declaration fails until its write path
      # has actually moved.
      - name: One store of record per table
        run: python3 ETL/schema/check_store_of_record.py

      # Committed DDL must account for every column in every store. The
      # BETWEEN-STORES half needs the corpus and DATABASE_URL, which CI has
      # neither of by design, so it runs on the weekly cron and publishes a
      # verdict; this is the half that reads committed files only. It found a
      # git conflict marker sitting inside ETL/schema/postgres_schema.sql --
      # the file the step above asserts the EXISTENCE of.
      - name: Committed DDL accounts for every column
        run: python3 ETL/schema/check_store_schema.py

      # What we TRACK and what we OFFER are two populations. That check has
      # MOVED to the weekly Railway cron and is deliberately not here, because
      # here it could never run: data/db.sqlite is gitignored, so on every run
      # it has ever had it printed "skipping" and returned 0. It now executes
      # against the volume-resident corpus and publishes a verdict the frontend
      # job asserts on without credentials.
      #
      # This is the check on that arrangement: every registered guard has
      # exactly one publisher, every publisher is registered, each verdict is
      # bound to its own implementation — and no workflow holds a credential of
      # ours, which is the reason the arrangement exists at all.
      - name: Every guard has a publisher, and no workflow has a secret
        run: python3 ETL/schema/check_guard_registry.py

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: website/frontend/package-lock.json }
      - run: npm ci
      # Wraps npm audit with a reviewed exceptions register: fails on anything
      # high or critical that is NOT documented, and fails when an exception
      # passes its review date. A check that cannot pass is a check people
      # learn to skip.
      - name: Dependency audit
        run: npx tsx scripts/check_dependencies.ts
