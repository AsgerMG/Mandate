# Does the website still serve the corpus the ETL produces?
#
# ── Why this runs on a clock and not on a push ─────────────────────────────
# check_corpus_currency.ts and check_corpus_census.ts are correct, and until
# now they fired nowhere. They live in `npm run check`, which CI does not run;
# CI runs a hand-picked subset and deliberately has no DATABASE_URL, so both
# would skip themselves even if it did. The only thing that ever ran them was a
# person typing the command — which is how the fallback corpus reached 205
# instruments out of date on liveness, showing 26% of founders at least one
# dead call.
#
# Making them push-triggered would not be enough either. The ETL runs on a
# clock and the drift starts the moment it does, so a push-triggered guard has
# a drift window equal to the time until somebody next pushes: measured over
# this repo's own history that is a median of 1.4 days but it is UNBOUNDED, and
# the quiet weeks when nobody pushes are exactly the weeks nobody is looking.
# `python3 ETL/lib/drift_window.py` re-derives both numbers from the git log.
#
# So this runs on the same clock as the ETL, a few hours behind it.
#
# ── Why it does not fix anything ───────────────────────────────────────────
# It reports and refuses. Publishing means committing regenerated artifacts and
# pushing, which redeploys the site, and an unattended cron with commit rights
# to main is a large blast radius to accept in exchange for a few hours of
# freshness. The artifacts it would push are the headline figures a founder
# reads. Those get looked at. The fix is one command: `make republish`.
#
# ── The one thing it must never do ─────────────────────────────────────────
# Pass because a secret was missing. `--require-db` turns the local "skip
# quietly" into a hard failure here, because a guard that reports success
# having checked nothing is the exact defect it exists to catch.
name: Corpus currency

on:
  schedule:
    # 08:00 UTC Sunday — five hours after the ETL cron (0 3 * * 0), which is
    # comfortably longer than any run has taken, and still Sunday morning so a
    # failure has the week in front of it rather than behind it.
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  currency:
    name: is the site serving the ETL's corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: website/frontend

      # Fail before running anything, rather than running everything and having
      # each check skip itself into a green tick.
      - name: The database must be reachable
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No DATABASE_URL secret. This workflow is the only thing"
            echo "::error::that compares the site against the ETL's corpus, and without"
            echo "::error::the secret every check below would skip and report success."
            exit 1
          fi

      # What the ETL last recorded about its own corpus, against what the site
      # serves: headline figures, the run's outcome, the coverage gate's
      # verdict, and whether the container is even running this code.
      - name: Site vs the ETL's census
        working-directory: website/frontend
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: npx tsx scripts/check_corpus_census.ts --require-db

      # The other corpus: the committed fund snapshot against live Postgres.
      # This one already existed and was in no automatic path.
      - name: Fallback snapshot vs Postgres
        if: always()
        working-directory: website/frontend
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: npx tsx scripts/check_corpus_currency.ts

      - name: Both stores agree
        if: always()
        working-directory: website/frontend
        env: { DATABASE_URL: '${{ secrets.DATABASE_URL }}' }
        run: npx tsx scripts/check_hydration_parity.ts

      # A failed scheduled run emails whoever owns the repo and is then never
      # seen again. An issue persists, accumulates the evidence, and closes
      # itself when the next run passes — so "still broken" and "fixed" are
      # both visible without anybody checking a workflow list.
      - name: Open or update the drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Corpus currency: the site is not serving the ETL\'s corpus';
            const body = [
              `The scheduled currency check failed on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'The site serves committed build artifacts and they do not follow the ETL',
              'on their own. Fix:',
              '',
              '```',
              'make republish',
              '```',
              '',
              'If the failure is DEGRADED or SILENT rather than STALE, do not republish —',
              'the corpus itself, or the weekly run, is the problem. `make verify-cron`.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'corpus-currency',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['corpus-currency'],
              });
            }

      - name: Close the drift issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'corpus-currency',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'Resolved: the site serves the corpus the ETL produced.',
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
            }
