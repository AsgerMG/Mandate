- requirement: Grant recipients must have a valid UK business bank account meeting specified
    criteria (same name as organisation, UK PRA-regulated bank, cheque and credit clearing
    facility) into which the grant will be paid.
  quote: "be a business account in the same name as the organisation listed in IFS \n be from\
    \ a UK bank regulated by the Prudential Regulation Authority (PRA) \n have a cheque and\
    \ credit clearing facility"
  source:
    file: innovate_uk_smart_grants_apr2024.html
    locator: chunk 7
  verified: llm_cited
- requirement: Applicants must not start their project before the date stated on the confirmation
    email and Grant Offer Letter; costs incurred before the agreed start date cannot be claimed.
  quote: You must not start your project before the date stated on your email and GOL. Any
