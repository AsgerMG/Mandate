obligations:
- requirement: Applicants must ensure proposed work involving animals complies with UKRI guidance
    on the use of animals in research and innovation.
  quote: Applicants must ensure that all of the proposed work within projects, both that in
    the UK and internationally, will comply with the UKRI guidance on the use of animals in
    research and innovation .
  source:
    file: innovate_uk_smart_grants_apr2024.html
    locator: chunk 2
  verified: llm_cited
- requirement: Funded organisations must ensure funding complies with all current Subsidy
    Control legislation applicable in the United Kingdom.
  quote: You must always make sure that the funding awarded to you is compliant with all current
    Subsidy Control legislation applicable in the United Kingdom.
  source:
    file: innovate_uk_smart_grants_apr2024.html
    locator: chunk 3
  verified: llm_cited
- requirement: Applicants must have the correct permits and licences in place by the project
    start date, otherwise the project cannot be funded.
  quote: We are unable to fund projects who do not have the correct permits or licences in
    place by your project start date.
  source:
    file: innovate_uk_smart_grants_apr2024.html
    locator: chunk 4
  verified: llm_cited
- requirement: If successful, at least one project team member must attend a one-hour briefing
    webinar within 10 days of receiving the successful notification.
  quote: at least one member of your project team must attend a one hour briefing webinar
