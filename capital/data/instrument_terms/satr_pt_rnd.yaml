cumulation:
  text: For the same eligible expenses, incentives under these Support Systems are not cumulative
    with other incentives of the same nature; where an operation benefits from incentives
    of a different nature (e.g. tax benefits or financial instruments), the total accumulated
    incentive must respect applicable State aid limits.
  quote: Para as mesmas despesas elegíveis, os apoios concedidos ao abrigo dos Sistemas de
    Incentivos previstos no presente Regulamento não são cumuláveis com quaisquer outros da
    mesma natureza.
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.6
  verified: llm_cited
application:
  channel: Applications are submitted under calls for applications (avisos para apresentação
    de candidaturas), potentially preceded by a pre-qualification aid request notice.
  typical_timeline: Following a pre-qualification aid request, the applicant must submit a
    formal application to the first subsequent call for applications after the aid request
    date.
  quote: As candidaturas aos apoios são apresentadas no âmbito de avisos para apresentação
    de candidaturas, conforme previsto no artigo 12.º do Decreto -Lei n.º 20 -A/2023, de 22
    de março.
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.4
  verified: llm_cited
