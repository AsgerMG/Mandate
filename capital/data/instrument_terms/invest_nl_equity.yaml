- id: g1-netherlands-nexus
  gate_family: G1_nexus
  requirement: The fund must have a clear impact in the Netherlands, being willing to invest
    at least twice the Invest-NL investment amount in Dutch companies.
  value: At least 2x Invest-NL ticket invested in Dutch companies
  intake_field: activityCountries
  quote: 'The fund has a clear impact in the Netherlands: the fund is willing to invest at
    least twice the investment from Invest-NL in Dutch companies.'
  source:
    file: nl_invest_nl_fund_investments.html
