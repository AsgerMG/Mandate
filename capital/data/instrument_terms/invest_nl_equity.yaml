  source:
    file: nl_invest_nl_fund_investments.html
    locator: nl_invest_nl_fund_investments.html#chunk 1
  verified: llm_cited
- id: g5-ecosystem-gap
  gate_family: G5_use_of_funds
  requirement: Funds must effectively fill a clear financing gap and have proven contributions
