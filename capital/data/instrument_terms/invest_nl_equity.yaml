  verified: llm_cited
- id: g2-fund-size
  gate_family: G2_size_ownership
  requirement: The fund must have an intended total size of at least €50 million.
  value: Minimum fund size €50 million
  intake_field: turnoverBand
  quote: Invest-NL focuses on funds with an intended total size of at least € 50 million.
  source:
    file: nl_invest_nl_fund_investments.html
    locator: nl_invest_nl_fund_investments.html#chunk 1
  verified: llm_cited
- id: g3-ticket-size
  gate_family: G3_financial
  requirement: Invest-NL participates with a ticket of between €5 million and €25 million
    per fund.
  value: €5 million to €25 million per fund
  intake_field: ticketBand
  quote: We participate with tickets between € 5 million and € 25 million per fund.
  source:
    file: nl_invest_nl_fund_investments.html
    locator: nl_invest_nl_fund_investments.html#chunk 1
  verified: llm_cited
- id: g4-borrower-model
  gate_family: G4_borrower_model
  requirement: Invest-NL invests as a limited partner / fund investor into venture capital
    funds rather than lending or granting directly to companies.
  value: Fund (LP) equity investment
  intake_field: borrowerModel
  quote: Invest-NL is committed to a more sustainable and innovative Netherlands. Therefore,
    we focus on investment funds that provide fast-growing innovative companies with greater
    and better access to risk capital.
  source:
    file: nl_invest_nl_fund_investments.html
    locator: nl_invest_nl_fund_investments.html#chunk 1
  verified: llm_cited
- id: g6-additionality
  gate_family: G6_conditionality
  requirement: Invest-NL only invests in funds that initially do not raise sufficient financing
    from private and institutional investors, i.e. funds must demonstrate a financing gap
    (additionality).
  value: Financing gap / additionality required
  intake_field: institutionalBacking
  quote: We invest in funds that initially do not raise sufficient financing from private
    and institutional investors. By investing early, we add value.
  source:
    file: nl_invest_nl_fund_investments.html
    locator: nl_invest_nl_fund_investments.html#chunk 1
  verified: llm_cited
- id: g6-experience
  gate_family: G6_conditionality
  requirement: The fund team must have a proven track record in investments within the scope
