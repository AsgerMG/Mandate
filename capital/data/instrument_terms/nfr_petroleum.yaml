  text: Because the Research Council only funds up to 50% for industrial research even though
    GBER would allow up to 70%, applicants may seek additional support from other public schemes
    such as Innovation Norway and SkatteFUNN; combined support may affect the scope of Research
    Council funding.
  quote: Siden Forskningsrådet kun tildeler inntil 50 prosent til industriell forskning selv
    om bedriften kunne fått dekket inntil 70 prosent, kan dere søke om ytterligere støtte
    fra andre offentlige ordninger, slik som Innovasjon Norge og SkatteFUNN.
  source:
