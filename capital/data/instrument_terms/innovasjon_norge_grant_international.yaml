cumulation:
  text: The grant is calculated on the assumption that no other public support beyond what
    is disclosed in the application is received for the same eligible project costs; if additional
    public support (including SkatteFunn) covering the same costs is received after the offer,
    the grant will be reduced or lapse accordingly, though the business may still receive
    other public support for different project costs not covered by Innovasjon Norge's grant.
  quote: Dette er ikke til hinder for at bedriften kan motta annen offentlig støtte til andre
    prosjektkostnader enn de vi har lagt til grunn.
  source:
    file: innovasjon_norge_grant_international_eos_midlene.html
    locator: innovasjon_norge_grant_international_eos_midlene.html#chunk 1
  verified: llm_cited
application:
  channel: Applications are made in response to open calls (utlysninger) published by the
    beneficiary countries' programme administrators; Norwegian businesses apply to become
    project partners.
  typical_timeline: Varies (Varierer) depending on calls; deadlines are per individual call
    (utlysninger).
  quote: Søknadsfrist Utlysninger Hvor mye Varierer
