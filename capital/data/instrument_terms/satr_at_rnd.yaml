cumulation:
  text: Aid under this guideline may not be cumulated with de-minimis aid for the same eligible
    costs if the cumulation would exceed the aid intensities set out in section 4.2; funding
    decisions require checking against other potential funders for prohibited multiple funding.
  quote: 'Beihilfen auf Basis dieser Richtlinie dürfen nicht mit De-minimis-Beihilfen für
    dieselben beihil-

    fefähigen Kosten kumuliert werden, wenn durch diese Kumulierung die in Punkt 4.2. festge-

    legten Beihilfeintensitäten überschritten werden.'
  source:
    file: at_ffg_kmu_richtlinie_2024_2026.pdf
    locator: at_ffg_kmu_richtlinie_2024_2026.pdf#p.41
  verified: llm_cited
application:
  channel: Written application via FFG's electronic submission platform within the deadline
    set in the call for proposals, using the specified form
  typical_timeline: Applications processed either continuously (open call/Antragsverfahren)
    or evaluated at a fixed deadline (competitive call/Wettbewerbsverfahren); simplified procedure
    for grants up to EUR 20,000
  quote: 'Die Förderungswerbenden haben bei der FFG einen schriftlichen Förderungsantrag,
    unter Ver-

    wendung des jeweiligen Formulars, innerhalb der in der Aufforderung zur Einreichung von

    Förderungsanträgen festgelegten Frist, einzureichen.'
  source:
    file: at_ffg_kmu_richtlinie_2024_2026.pdf
    locator: at_ffg_kmu_richtlinie_2024_2026.pdf#p.32
  verified: llm_cited
