cumulation:
  text: Cumulation of the notified aid with other aid, de minimis aid, or Union funding covering
    the same eligible costs is permitted for most participating Member States (except Italy)
    provided the combined public funding does not exceed the most favourable funding rate
    under applicable Union law.
  quote: 'most of the participating Member States have indicated that cumulation with

    other aid, de minimis aid (89) or Union funding will be allowed to cover the same

    eligible costs, provided that the total amount of public funding granted in relation to

    the same eligible costs does not exceed the most favourable funding rate laid down in

    the applicable rules of Union law, pursuant to point 35 of the IPCEI

    Communication'
  source:
    file: ipcei_med4cure_sa104974_decision_2024.pdf
    locator: ipcei_med4cure_sa104974_decision_2024.pdf#p.63
  verified: llm_cited
application:
  channel: National funding agreements concluded by participating Member States following
    Commission approval; State aid is subject to prior Commission approval before any grant
    can be made.
  typical_timeline: Aid may only be granted after notification and Commission decision approving
    the aid for execution of the IPCEI; national funding agreements are expected to be concluded
    following the Commission's decision.
  quote: 'The participating Member States submit that they shall not grant State aid to any
    of

    the direct participants before the notification of the Commission’s decision

    approving the aid for the execution of the IPCEI Med4Cure'
  source:
    file: ipcei_med4cure_sa104974_decision_2024.pdf
    locator: ipcei_med4cure_sa104974_decision_2024.pdf#p.66
  verified: llm_cited
