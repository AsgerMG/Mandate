application:
  channel: Competitive calls for proposals published by the European Commission, with grants
    awarded to consortia following evaluation; some actions implemented under indirect management
    via Contribution Agreements with the European Defence Agency, and some via Specific Grant
    Agreements under Framework Partnership Agreements without a call.
  typical_timeline: Calls run annually (e.g., EDF-2025-DA, EDF-2026-DA); expedited (EDF-2026-DA-EXP)
    and accelerated (EDF-2026-DA-ACC) calls have shorter submission/evaluation timeframes;
    recommended action durations vary (e.g. 3 years for NFP action, 12-36 months for SMERO-NT).
  quote: Grants will be awarded to consortia after the evaluation of the proposals submitted
    following the publication of calls for proposals.
  source:
    file: edf_work_programme_2025_partII.pdf
    locator: edf_work_programme_2025_partII.pdf#p.41
  verified: llm_cited
