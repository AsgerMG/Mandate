cumulation:
  text: Innovasjon Norge bases its grant calculation on an assumption that no other public
    support, including SkatteFunn, is received beyond what is stated in the application for
    the same eligible project costs; if such other public support is received later covering
    the same costs, the grant may be reduced or lapse. This does not prevent the company from
    receiving other public support for other project costs not covered by Innovasjon Norge's
    calculation.
  quote: Ved fastsettelse av tilskuddsbeløpet legger derfor vi til grunn at det ikke mottas
    annen offentlig støtte, herunder Skattefunn, enn det som er oppgitt i søknaden.
  source:
    file: innovasjon_norge_grant_startup_oppstartstilskudd_1.html
    locator: innovasjon_norge_grant_startup_oppstartstilskudd_2.html#chunk 1
  verified: llm_cited
