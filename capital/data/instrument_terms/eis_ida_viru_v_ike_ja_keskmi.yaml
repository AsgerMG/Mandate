obligations:
- requirement: Applicant must submit the application together with a project and business
    plan, financial statement projections, activity plan and budget, and (where applicable)
    a Do No Significant Harm (DNSH) assessment.
  quote: "Valmista taotluse lisadokumendid eelnevalt ette: \n Taotlusvormi näidis (täidetakse\
    \ ja esitatakse e-toetuse keskkonnas) \n Projekti- ja äriplaani vorm"
  source:
    file: eis_ida_viru_v_ike_ja_keskmi_investeeringute_toetus.html
    locator: chunk 3
  verified: llm_cited
- requirement: Applicant must submit documents confirming ownership or right of use of the
    property where equipment will be installed, or at minimum a written preliminary agreement
    to acquire/rent the property for the eligibility period plus at least three years thereafter.
  quote: Dokumendid, mis kinnitavad taotleja kinnistu, millele tarnitavate seadmete ostuks
    toetust taotletakse, omandi- või kasutusõigust, või asjaolu, et taotleja on sõlminud vähemalt
    kirjaliku eelkokkuleppe kinnistu omanikuga kinnistu omandamiseks või rentimiseks projekti
    abikõlblikkuse perioodil ja vähemalt kolme aasta jooksul projekti abikõlblikkuse perioodi
    lõppemisest arvates
  source:
    file: eis_ida_viru_v_ike_ja_keskmi_investeeringute_toetus.html
    locator: chunk 3
  verified: llm_cited
- requirement: Beneficiary must submit current-year balance sheet and income statement as
    of the end of the last completed quarter, plus prior year's annual report if not available
    in the Commercial Register.
  quote: Jooksva aasta bilanss ja kasumiaruanne viimase lõppenud kvartali seisuga
  source:
    file: eis_ida_viru_v_ike_ja_keskmi_investeeringute_toetus.html
    locator: chunk 3
  verified: llm_cited
- requirement: Beneficiary must comply with procurement principles (economical use of funds,
    equal treatment of bidders, use of competition, documentation retention, prohibition on
    transactions between related parties) and use the state procurement register for purchases
    of €100,000 or more.
  quote: 100 000 eurot ja enam maksvate ostude puhul tuleb ostumenetlus viia läbi riigihangete
