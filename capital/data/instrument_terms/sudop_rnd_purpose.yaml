- id: g5_excluded_activities
  gate_family: G5_use_of_funds
  requirement: Financial aid may not be granted to businesses in tobacco, alcohol, pornography,
    weapons/ammunition trade, gambling, or narcotics/psychotropic substance production or
    distribution.
  value: 'excluded sectors: tobacco, alcohol, pornography, weapons, gambling, narcotics'
  intake_field: none
  quote: '1) wytwarzania, przetwórstwa lub wprowadzania do obrotu tytoniu i wyrobów tytoniowych;

    2) produkcji lub wprowadzania do obrotu napojów alkoholowych;

    3) produkcji lub wprowadzania do obrotu treści pornograficznych;

    4) obrotu materiałami wybuchowymi, bronią i amunicją;

    5) gier losowych, zakładów wzajemnych, gier na automatach i gier na automatach o niskich
