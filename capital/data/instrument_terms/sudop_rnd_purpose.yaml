cumulation:
  text: Public aid is subject to cumulation rules under Article 8 of Regulation 651/2014,
    and de minimis aid under Article 5 of Regulation 1407/2013; aid cannot be combined where
    it would exceed maximum aid intensity or amount thresholds for the same eligible costs.
  quote: 'Pomoc publiczna podlega kumulacji na zasadach określonych w art. 8 rozporządzenia
    nr 651/2014.

    2. Pomoc de minimis podlega kumulacji na zasadach określonych w art. 5 rozporządzenia
    nr 1407/2013.'
  source:
