obligations:
- requirement: Before aid is granted, the applicant must submit to NCBR information about
    the undertaking, its business, and information about previously received public aid or
    a declaration of not having received such aid.
  quote: 'Przed udzieleniem pomocy finansowej wnioskodawca przedstawia NCBR:

    1) w przypadku pomocy publicznej i pomocy na rzecz IPCEI – informacje dotyczące tego przedsiębiorcy
    i prowadzonej

    przez niego działalności gospodarczej oraz informacje o otrzymanej pomocy publicznej albo
    oświadczenie

    o nieotrzymaniu takiej pomocy'
  source:
    file: pl_ncbr_rozporzadzenie_mnisw_2020_pomoc_publiczna_poir.pdf
    locator: pl_ncbr_rozporzadzenie_mfipr_2023_pomoc_finansowa_feng.pdf#p.7
  verified: llm_cited
- requirement: For fisheries and aquaculture research aid, the undertaking must publish online,
    before starting the project, information about the intent, purpose, expected date of results
    availability, and free access guarantee.
  quote: '1) zamiarze wykonania tego projektu;

    2) celu tego projektu;

    3) przybliżonym terminie udostępnienia wyników tego projektu i o adresie strony internetowej,
    na której zostaną one

    udostępnione;

    4) zapewnieniu nieodpłatnej dostępności wyników tego projektu dla wszystkich przedsiębiorców
    działających w sektorze

    rybołówstwa i akwakultury.'
  source:
    file: pl_ncbr_rozporzadzenie_mnisw_2020_pomoc_publiczna_poir.pdf
    locator: pl_ncbr_rozporzadzenie_mnisw_2020_pomoc_publiczna_poir.pdf#p.7
  verified: llm_cited
- requirement: Results of fisheries/aquaculture research aid projects must be made publicly
    available online for at least 5 years from project completion.
  quote: przez okres co najmniej 5 lat od dnia zakończenia jego wykonywania.
  source:
    file: pl_ncbr_rozporzadzenie_mnisw_2020_pomoc_publiczna_poir.pdf
    locator: pl_ncbr_rozporzadzenie_mnisw_2020_pomoc_publiczna_poir.pdf#p.8
