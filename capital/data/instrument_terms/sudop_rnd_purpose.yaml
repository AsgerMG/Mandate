- id: g2_risk_finance_undertaking
  gate_family: G2_size_ownership
  requirement: Risk-finance commercialisation aid targets an unlisted micro, small or medium
    enterprise that has either not operated in any market, operated less than 7 years since
    first commercial sale, or needs initial risk-finance investment exceeding 50% of its average
    annual turnover over the preceding 5 years.
  value: unlisted SME meeting one of three early-stage/investment-need criteria
  intake_field: developmentStage
  quote: 'jest nienotowanym mikro-, małym albo średnim przedsiębiorcą

    w rozumieniu art. 2 pkt 76 rozporządzenia nr 651/2014 i spełnia co najmniej jeden z następujących
    warunków:

    1) nie prowadzi działalności na żadnym rynku,

    2) prowadzi działalność na dowolnym rynku przez okres krótszy niż 7 lat od pierwszej sprzedaży
    komercyjnej'
  source:
    file: pl_ncbr_rozporzadzenie_mnisw_2020_pomoc_publiczna_poir.pdf
    locator: pl_ncbr_rozporzadzenie_mnisw_2020_pomoc_publiczna_poir.pdf#p.8
