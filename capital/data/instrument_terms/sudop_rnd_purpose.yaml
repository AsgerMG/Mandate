application:
  channel: NCBR (National Centre for Research and Development) call for proposals procedure
  typical_timeline: Not specified in text; aid granted following a call for proposals under
    the project selection procedure of Chapter 14 of the Act of 28 April 2022.
  quote: 'Pomoc finansowa może zostać udzielona w wyniku przeprowadzenia naboru wniosków o
    dofinansowanie pro-

    jektów w procedurze wyboru projektów, o której mowa w rozdziale 14 ustawy z dnia 28 kwietnia
    2022 r. o zasadach

