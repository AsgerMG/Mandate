- id: g6-african-ukrainian-role-requirement
  gate_family: G6_conditionality
  requirement: African or Ukrainian participants must hold a formal 'beneficiary' role with
    their own budget in the Horizon Europe application; being an 'Associated Partner' is not
    sufficient to qualify for the extra PES bonus.
  value: Must be 'beneficiary' with own budget, not merely Associated Partner
  intake_field: conditionality
