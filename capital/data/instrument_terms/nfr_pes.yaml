cumulation:
  text: De minimis aid to an enterprise is capped at EUR 300,000 over a rolling three-year
    period, applied at the level of the corporate group as a general rule if the enterprise
    is part of a group.
  quote: For foretak som er del av et konsern, gjelder maksimalgrensen som hovedregel for
    konsernet som sådan.
  source:
    file: nfr_pes_horisont_europa_call_2025.html
    locator: nfr_pes_horisont_europa_call_2025.html#chunk 2
  verified: llm_cited
application:
  channel: Electronic application ('eSøknad') submitted via 'Mitt nettsted' (Forskningsrådet's
    applicant portal), with mandatory template attachments.
  typical_timeline: Applications should be submitted as early as possible and no later than
    four weeks before the EU deadline; for coordinated collaborative projects, contact with
    an NCP is recommended at least 12 weeks before the EU deadline. Decisions are usually
    communicated within four weeks of receipt.
  quote: Du må søke om støtte så tidlig som mulig – helst så snart et prosjektforslag begynner
    å ta form – og seinest fire uker før EU-fristen.
  source:
    file: nfr_pes_horisont_europa_call_2025.html
    locator: nfr_pes_horisont_europa_call_2025.html#chunk 1
  verified: llm_cited
