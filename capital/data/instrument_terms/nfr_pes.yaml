    eget budsjett i Horisont Europa-søknaden. Å være "Associated Partner" er ikke tilstrekkelig
    for å kvalifisere for ekstra midler fra PES-ordningen.
  source:
    file: nfr_pes_horisont_europa_call_2025.html
    locator: nfr_pes_horisont_europa_call_2025.html#chunk 3
  verified: llm_cited
obligations:
- requirement: Applicants must submit a final report via 'Mitt nettsted' after receiving the
    EU evaluation, including the Evaluation Summary Report (ESR) or equivalent.
  quote: Sluttrapport for prosjektet skal leveres via Mitt nettsted, og skal sendes til Forskningsrådet
    når søker har mottatt evaluering fra EU. Sluttrapporten skal inneholde Evaluation Summary
    Report (ESR) eller tilsvarende søknadsvurdering.
  source:
    file: nfr_pes_horisont_europa_call_2025.html
    locator: nfr_pes_horisont_europa_call_2025.html#chunk 2
  verified: llm_cited
- requirement: Enterprises must provide a written confirmation and overview of all other de
    minimis aid received during the previous three fiscal years prior to payout.
  quote: Vi vil i forkant av en eventuell utbetaling av bagatellmessig støtte, be om en skriftlig
    bekreftelse og oversikt over all annen bagatellmessig støtte som foretaket har mottatt
    i løpet av de siste tre regnskapsårene.
  source:
    file: nfr_pes_horisont_europa_call_2025.html
    locator: nfr_pes_horisont_europa_call_2025.html#chunk 2
  verified: llm_cited
- requirement: Companies participating in a Eurostars project must attach documentation confirming
    they hold at least NOK 500,000 in equity at the time of application.
  quote: 'Eurostars-søknader: Bedrifter som skal delta i et Eurostars-prosjekt må vedlegge
    dokumentasjon som bekrefter at bedriften har minst 500 000 kroner i egenkapital ved søketidspunktet.'
  source:
    file: nfr_pes_horisont_europa_call_2025.html
    locator: nfr_pes_horisont_europa_call_2025.html#chunk 4
  verified: llm_cited
- requirement: Applications and all attachments must be written in Norwegian or English, using
    the required templates, and must be submitted together with the application by the deadline.
  quote: Søknaden og alle vedlegg må være skrevet på norsk eller engelsk.
  source:
    file: nfr_pes_horisont_europa_call_2025.html
    locator: nfr_pes_horisont_europa_call_2025.html#chunk 4
  verified: llm_cited
