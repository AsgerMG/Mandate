- id: g6-eurostars-threshold-criteria
  gate_family: G6_conditionality
  requirement: For Eurostars, PES payout requires a score above the minimum 3.6 threshold
    on each of three criteria (Quality, Impact, Excellence) and a passed Legal and Financial
