cumulation:
  text: Combined public funding from Business Finland and other public funders may not exceed
    the project's maximum public funding intensity ceiling, and Business Finland will reduce
    its own contribution if necessary to stay within the limit; costs subsidized by non-combinable
    public funding are ineligible.
  quote: 'The combined total funding that the project receives from the Funding Agency and
    other providers

    of public funding may not exceed the project’s maximum limit for public funding. If necessary,
    the

    Funding Agency will reduce its own contribution so that the maximum amount of public funding
    is

    not exceeded.'
  source:
    file: fi_business_finland_rd_funding_terms_2026.pdf
    locator: fi_business_finland_rd_funding_terms_2026.pdf#p.13
  verified: llm_cited
application:
  channel: Business Finland online service (application, reporting, forms Y1/Y3/Y4/Y5)
  typical_timeline: Costs eligible only from date of application submission; loan documents/promissory
    note must be delivered/signed within six months of advance payment decision; final report
    and installment applied for at project completion
  quote: 'only procurements and work ordered or agreed upon in

    writing after submitting the funding application are approved for the project'
  source:
    file: fi_business_finland_rd_funding_terms_2026.pdf
    locator: fi_business_finland_rd_funding_terms_2026.pdf#p.6
  verified: llm_cited
