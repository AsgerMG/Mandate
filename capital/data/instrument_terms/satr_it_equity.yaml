application:
  channel: Online telematic procedure via the Invitalia website (www.invitalia.it), with a
    valutativa a sportello (chronological, first-come first-served evaluation) procedure managed
    by Invitalia as soggetto gestore.
  typical_timeline: Pre-filing opens 30 April 2025 at 10:00; submission opens 20 May 2025
    at 10:00; applications processed in chronological order subject to available resources.
  quote: Ai fini dell’accesso alle agevolazioni è prevista una procedura valutativa con procedimento
    a sportello. L’Agenzia Nazionale per l’attrazione degli investimenti e lo sviluppo d’impresa
    – Invitalia Spa, in qualità di soggetto gestore, procede alle attività istruttorie secondo
    l’ordine cronologico di presentazione delle domande di agevolazione, tenuto conto delle
    risorse economiche disponibili.
  source:
    file: satr_it_equity_pnric_investimenti_sostenibili_40_scheda.pdf
    locator: satr_it_equity_pnric_investimenti_sostenibili_40_scheda.pdf#p.3
  verified: llm_cited
