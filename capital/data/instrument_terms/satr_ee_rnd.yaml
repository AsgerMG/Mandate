cumulation:
  text: State aid or de minimis aid received for the same activity from other public sources,
    together with aid already granted under this regulation, is deducted from newly granted
    support; de minimis aid cumulation follows the EU De Minimis Regulation's rules and ceiling,
    treating related entities as a single undertaking.
  quote: eraldatud toetusest arvestatakse maha samale tegevusele käesoleva määruse alusel
    varasemalt saadud ning teistest avaliku sektori allikatest saadav riigiabi.
  source:
    file: satr_ee_rnd_riigiteataja_maarus_wayback.html
    locator: chunk 10, §22 intro
  verified: llm_cited
application:
  channel: Applications are submitted to Ettevõtluse ja Innovatsiooni Sihtasutus (Enterprise
    Estonia / EIS) via the e-toetuse structural aid register environment, either on a rolling
    basis or via calls (voorupõhine).
  typical_timeline: Rolling applications processed within 40 working days of registration;
    call-based applications processed within 60 working days of call closure, extendable by
    up to 10 working days for justified reasons.
  quote: Jooksva taotlemise korral 40 tööpäeva taotluse registreerimisest arvates; 2) voorulise
    taotlemise korral 60 tööpäeva taotlusvooru sulgumisest arvates.
  source:
    file: satr_ee_rnd_riigiteataja_maarus_wayback.html
    locator: chunk 7, §16(3)
  verified: llm_cited
