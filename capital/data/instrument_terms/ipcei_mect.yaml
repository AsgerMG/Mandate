obligations:
- requirement: Member States must report to the Commission on the implementation of the claw-back
    mechanism within two months after each application of that mechanism.
  quote: The application of the claw-back mechanism will be reported by the relevant Member
    State to the Commission within two months following completion of each test-run and after
    the End date.
  source:
    file: ipcei_mect_commission_decision_SA101129.pdf
    locator: ipcei_mect_commission_decision_SA101129.pdf#p.158
  verified: llm_cited
- requirement: Beneficiaries above the claw-back threshold must secure repayment obligations
    via a letter of credit from a reputable, investment-grade rated financial institution,
    or an alternative account-based system meeting specified conditions.
  quote: A letter of credit (by a reputable financial institution having investment grade
    rating from a first-rank rating agency) should cover the repayment obligation at the End
    date by the aid beneficiary, from the first test-run.
  source:
    file: ipcei_mect_commission_decision_SA101129.pdf
    locator: ipcei_mect_commission_decision_SA101129.pdf#p.158
  verified: llm_cited
- requirement: Member States must comply with transparency and publication requirements, publishing
    the full text of individual aid granting decisions on the Commission's transparency award
    module or a comprehensive State aid website.
  quote: the Member States have committed to publish in the Commission’s transparency award
    module or on a comprehensive State aid website, at national or regional level, the full
    text of the individual aid granting decision
  source:
    file: ipcei_mect_commission_decision_SA101129.pdf
    locator: ipcei_mect_commission_decision_SA101129.pdf#p.99
  verified: llm_cited
- requirement: Participating undertakings must maintain separate analytical accounting to
    support ex post claw-back calculations, subject to annual approval by an independent auditor.
  quote: separate analytical accounting will be required from the participating undertakings
    in the relevant Member State
  source:
    file: ipcei_mect_commission_decision_SA101129.pdf
    locator: ipcei_mect_commission_decision_SA101129.pdf#p.99
  verified: llm_cited
- requirement: Undertakings receiving aid are expected to disseminate results widely, including
    via scientific publications, MPW access, training and knowledge-sharing with SMEs, ROs
    and universities, to ensure broad spillovers.
  quote: AT&S will grant universities, ROs and SMEs access to the FID site and provide hands-on
    training for its newly developed technologies.
  source:
    file: ipcei_mect_commission_decision_SA101129.pdf
    locator: ipcei_mect_commission_decision_SA101129.pdf#p.85
  verified: llm_cited
