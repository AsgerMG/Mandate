cumulation:
  text: Cumulation with other aid, de minimis aid, or Union funding covering the same eligible
    costs is allowed provided total public funding does not exceed the most favourable funding
    rate under applicable Union law rules.
  quote: cumulation with other aid, de minimis aid (23) or Union funding will be allowed to
    cover the same eligible costs, provided that the total amount of public funding granted
    in relation to the same eligible costs does not exceed the most favourable funding rate
    laid down in the applicable rules of Union law
  source:
    file: ipcei_mect_commission_decision_SA101129.pdf
    locator: ipcei_mect_commission_decision_SA101129.pdf#p.99
  verified: llm_cited
application:
  channel: National funding agreements concluded by participating Member States following
    Commission approval of the IPCEI decision; undertakings apply to the relevant Member State
    prior to the start of works on their individual projects.
  typical_timeline: Applications must precede start of works; cost eligibility periods run
    from 2022 through workstream-specific end dates (2029-2032); aid may only be granted following
    Commission's approval decision.
  quote: The Commission has verified that all undertakings have submitted their applications
    for aid to the relevant Member States before the start of the works on their individual
    projects included in IPCEI ME/CT
  source:
    file: ipcei_mect_commission_decision_SA101129.pdf
    locator: ipcei_mect_commission_decision_SA101129.pdf#p.139
  verified: llm_cited
