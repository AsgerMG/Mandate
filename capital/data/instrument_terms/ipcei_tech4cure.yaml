cumulation:
  text: Except for Italy, cumulation of the notified aid with other aid, de minimis aid, or
    Union funding covering the same eligible costs is allowed, provided total public funding
    does not exceed the most favourable funding rate under applicable Union law.
  quote: participating Member States have indicated that cumulation with other aid, de minimis
    aid (51) or Union funding will be allowed to cover the same eligible costs, provided that
    the total amount of public funding granted in relation to the same eligible costs does
    not exceed the most favourable funding rate laid down in the applicable rules of Union
    law
  source:
    file: ipcei_tech4cure_sa113212_decision_2025.pdf
    locator: ipcei_tech4cure_sa113212_decision_2025.pdf#p.43
  verified: llm_cited
application:
  channel: National funding agreements concluded following Commission approval, via national
    calls for interest organized by participating Member States (France, Hungary, Italy, Slovakia,
    Slovenia).
  typical_timeline: Works planned to start in 2025; FID phase planned to end in 2033.
  quote: The granting of State aid will be governed by national funding agreements that are
    expected to be concluded following the Commission’s decision.
  source:
    file: ipcei_tech4cure_sa113212_decision_2025.pdf
    locator: ipcei_tech4cure_sa113212_decision_2025.pdf#p.45
  verified: llm_cited
