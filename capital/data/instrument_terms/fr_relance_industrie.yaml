cumulation:
  text: For a given project, the same expenditure base cannot be cumulated with aid from different
    aid schemes; if multiple schemes must be mobilized, each must correspond to a distinct
    expenditure base, and each aid amount must not exceed the ceiling or maximum intensity
    authorized by its respective applicable scheme.
  quote: Pour un projet donné, une même assiette de dépenses ne peut pas faire l’objet d’un
    cumul d’aides de différents régimes. S’il est nécessaire de mobiliser différents régimes
    d’aide, à chacun doit correspondre une assiette de dépenses distinctes ; auquel cas, le
    montant de chaque aide ne doit pas excéder, sur leurs assiettes de dépenses, le plafond
    ou l’intensité maximale autorisée par le régime d’aide qui leur est respectivement applicable.
  source:
    file: fr_relance_industrie_aides_territoires.html
    locator: fr_relance_industrie_rebond_bpifrance_subdomain.html#chunk 2
  verified: llm_cited
application:
  channel: Applications submitted regionally to Bpifrance following the engineering mission
    on the territory; forms selected by region of project execution.
  typical_timeline: Open since September 2022; rolling review (au fil de l'eau) per territory
    until the allocated envelope is exhausted.
  quote: Le dispositif est ouvert de septembre 2022 et de la sélection des territoires lauréats
    du dispositif. Sur chaque territoire, la sélection des dossiers se fait au fil de l'eau
    et jusqu'à épuisement de l'enveloppe allouée au territoire.
  source:
    file: fr_relance_industrie_aides_territoires.html
    locator: fr_relance_industrie_rebond_bpifrance_subdomain.html#chunk 2
  verified: llm_cited
