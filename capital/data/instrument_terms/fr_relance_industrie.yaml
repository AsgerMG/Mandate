  intake_field: borrowerModel
  quote: Les aides inférieures à 800 000€ seront versées entièrement sous forme de subventions.
    Pour les aides supérieures à 800 000€, la tranche marginale au-delà de 800 000€ sera versée
    sous forme d’avances remboursables.
  source:
    file: fr_relance_industrie_aides_territoires.html
    locator: fr_relance_industrie_rebond_bpifrance_subdomain.html#chunk 2
  verified: llm_cited
obligations:
- requirement: Grants are paid in two tranches (50% upon signing the aid contract, 50% at
    project completion) and may be subject to repayment (répétition) if the project is not
    fully or partially carried out, per conditions in the signed subsidy contract.
  quote: 'Les subventions seront versées en deux tranches : 50% à la signature du contrat
    d’aide et 50% à la fin du projet. Celles-ci peuvent faire l’objet d’une répétition en
    cas de non réalisation totale ou partielle du projet, selon des conditions qui seront
    stipulées dans le contrat de subvention signé entre Bpifrance et l’entreprise lauréate.'
  source:
    file: fr_relance_industrie_aides_territoires.html
    locator: fr_relance_industrie_rebond_bpifrance_subdomain.html#chunk 2
  verified: llm_cited
- requirement: Conversion of the recoverable advance tranche into a grant (abandon de créance)
    is conditional on job creation, the number of which is determined with the company at
    contract signature, measured as net FTE headcount increase per URSSAF calculations.
  quote: Cette transformation sera conditionnée à la création d’emplois, dont le nombre sera
    déterminé avec l’entreprise à la signature du contrat. La création d’emplois s’entend
    comme l’augmentation nette de l’effectif de l’entreprise en ETP sur la base des calculs
    de l’URSSAF.
  source:
    file: fr_relance_industrie_aides_territoires.html
    locator: fr_relance_industrie_rebond_bpifrance_subdomain.html#chunk 2
  verified: llm_cited
