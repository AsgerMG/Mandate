cumulation:
  text: When applying preferential fees, the aggregate aid content already used by the enterprise
    plus the aid content of the new guarantee must not exceed the statutory maximum aid amount
    or aid intensity threshold; if exceeded, only a corrected or market fee may apply.
  quote: amennyiben a vállalkozás által már igénybe vett és a kezességnyújtással összefüggésben
    számolt támogatástartalom együttes összege a jogszabályi maximumot, illetve támogatási
    intenzitást nem lépi túl
  source:
    file: hu_avhga_uzletszabalyzat_2019.pdf
    locator: hu_avhga_uzletszabalyzat_2019.pdf#p.14
  verified: llm_cited
application:
  channel: Applications are submitted by the financial institution (not directly by the enterprise)
    via the E-garancia electronic system (Rendszer) or on paper, using the Igénylő Lap (Application
    Form) with mandatory attachments.
  typical_timeline: The Foundation decides within 3 business days for guarantees up to HUF
    25 million, 5 business days for HUF 25,000,001-200 million, and 8 business days above
    HUF 200 million, extendable in case of deficiency remedy or collateral relief.
  quote: 3 munkanap alatt bírálja el 25 millió Ft kezességgel biztosított összegig
  source:
    file: hu_avhga_uzletszabalyzat_2019.pdf
    locator: hu_avhga_uzletszabalyzat_2019.pdf#p.18
  verified: llm_cited
