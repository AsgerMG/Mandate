obligations:
- requirement: Beneficiary must publish at least 2 internship/apprenticeship offers (aid ≤€100k)
    or at least 3 offers (aid >€100k) of minimum two-month duration on the stages.iledefrance.fr
    platform.
  quote: Le bénéficiaire s’engage à publier à minima 3 offre(s) de stage(s) ou de contrat(s)
    de travail en alternance (contrat d’apprentissage ou de professionnalisation) d’une période
    minimale de deux mois sur la plateforme https://stages.iledefrance.fr, selon les modalités
    qui lui sont communiquées par la Région. (2 offres de stage à minima pour les aides inférieures
    ou égales à 100K€ et 3 offres à minima pour les aides supérieures à 100K€).
  source:
    file: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf
    locator: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf#p.10
  verified: llm_cited
- requirement: Beneficiary must provide proof of internship/apprenticeship offer publication.
  quote: Le bénéficiaire fournit un justificatif de dépôt de publication d’offre stagiaires
    et apprentis(es).
  source:
    file: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf
    locator: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf#p.11
  verified: llm_cited
- requirement: Beneficiary must mention the support of the France 2030 Programme and the Île-de-France
    Region in its communications and publication of results, using the specified mention and
    logos.
  quote: ce projet a été soutenu par le Programme France 2030, France Relance et la Région
    Ile-de-France
  source:
    file: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf
    locator: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf#p.7
  verified: false
  verify_note: 'fragment not found verbatim: ''ce projet a été soutenu par le Programme France
    20'''
- requirement: Beneficiary must send Bpifrance a communication sheet about the supported project
    upon contract signature.
  quote: Le bénéficiaire enverra à Bpifrance une fiche de communication relative au projet
    soutenu lors de la signature du contrat.
  source:
    file: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf
    locator: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf#p.8
  verified: llm_cited
- requirement: Beneficiary must communicate information needed for evaluation of the action
    upon request by Bpifrance, the State, or the Region, and be available for follow-up meetings.
  quote: Le bénéficiaire est tenu de communiquer à la demande de Bpifrance, de l’Etat et de
    la Région les éléments d’information nécessaires à l’évaluation de l’action et de se rendre
    disponible autant que de besoin pour les réunions de suivi de projet.
  source:
    file: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf
    locator: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf#p.8
  verified: llm_cited
- requirement: Beneficiary must submit a final program report with expense summary detailing
    use of public funds and project progress, and repayment terms apply for recoverable advances
    regardless of project outcome.
  quote: Le montant des échéances de remboursement tient compte des prévisions d'activité
    du bénéficiaire et prévoit un montant de remboursement forfaitaire minimum, quelle que
    soit l'issue du projet.
  source:
    file: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf
    locator: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf#p.7
  verified: llm_cited
- requirement: If expenses are found non-compliant with the presented project, or if the project
