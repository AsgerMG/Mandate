    for 2024-2026, and rates/amounts must respect maximum intensities set by applicable EU
    State aid regulation.
  quote: Les aides accordées dans ce cadre sont prioritairement adossées au régime cadre exempté
    de notification N°SA. 111723 relatif aux aides à la recherche, au développement et à l’innovation
    (RDI) pour la période 2024 - 2026.
  source:
    file: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf
    locator: bpifrance_innovup_leader_idf_appel_a_projets_2025.pdf#p.4
  verified: llm_cited
