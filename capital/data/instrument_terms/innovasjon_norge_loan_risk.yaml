cumulation:
  text: Aid measurement is based on an overall assessment of how much public aid is needed
    to trigger the project; grant calculation assumes no other public aid beyond what is stated
    in the application for the same eligible costs, but the company may still receive other
    public aid for other project costs.
  quote: Ved fastsettelse av tilskuddsbeløpet legger derfor vi til grunn at det ikke mottas
    annen offentlig støtte, herunder Skattefunn, enn det som er oppgitt i søknaden.
  source:
    file: innovasjon_norge_loan_risk_gront_risikolan.html
