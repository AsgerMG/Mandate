obligations:
- requirement: The application must disclose whether other public aid has been or will be
    sought for the project.
  quote: Det skal opplyses i søknaden hvorvidt det er søkt eller vil bli søkt annen offentlig
    støtte til prosjektet.
  source:
    file: innovasjon_norge_loan_risk_gront_risikolan.html
    locator: innovasjon_norge_loan_risk_gront_risikolan.html#chunk 1
  verified: llm_cited
- requirement: If other public aid, including SkatteFunn, is nevertheless received after the
    offer is given and covers the same costs, the grant may be reduced correspondingly or
    lapse.
  quote: I tilfelle slik annen offentlig støtte, herunder SkatteFunn, likevel blir mottatt
    etter at vårt tilbud er gitt, og til dekning av de samme kostnadene, vil tilskuddet fra
    oss kunne bli redusert tilsvarende eller bortfalle.
  source:
    file: innovasjon_norge_loan_risk_gront_risikolan.html
    locator: innovasjon_norge_loan_risk_gront_risikolan.html#chunk 1
  verified: llm_cited
- requirement: If changes to loan terms or securities are needed for an ongoing loan, an application
