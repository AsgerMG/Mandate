gates:
- id: G1-fiscal-residence-es
  gate_family: G1_nexus
  requirement: Beneficiary entities must have their own legal personality and have tax residence
    or a permanent establishment in Spain.
  value: Legal personality + tax residence/permanent establishment in Spain
  intake_field: entityCountries
  quote: válidamente constituidas y tengan residencia fiscal o establecimiento permanente
    en España
  source:
