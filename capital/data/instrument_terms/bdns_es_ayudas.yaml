cumulation:
  text: Aid under this scheme is compatible with other public or private subsidies for the
    same purpose from any administration, national or international body, provided cumulation
    and incompatibility rules and maximum aid intensities are respected, and that the same
    cost is not financed twice.
  quote: La percepción de estas ayudas será compatible, de acuerdo con el artículo 9, del
    Reglamento (UE) 2021/241 del Parlamento Europeo y del Consejo, de 12 de febrero, con la
    percepción de otras subvenciones, ayudas, ingresos o recursos para la misma finalidad,
    procedentes de cualesquiera administraciones públicas o entes públicos o privados, nacionales,
    internacionales, de la Unión Europea o de organismos internacionales
  source:
    file: bdns_es_orden_cin_1502_2021_bases_cpp.html
    locator: bdns_es_orden_cin_1502_2021_bases_cpp.html#chunk 31
  verified: llm_cited
application:
  channel: Electronic submission via the Ministerio de Ciencia e Innovación's electronic headquarters
    (sede electrónica), using advanced electronic signature through the electronic register.
  typical_timeline: Application window as short as 7 days minimum to 30 days maximum; resolution
    to be issued and notified within a maximum of six months from publication of the call
    extract in the BOE, extendable by up to six more months.
  quote: El plazo de solicitud no podrá ser inferior a siete días ni superior a treinta.
  source:
    file: bdns_es_orden_cin_1502_2021_bases_cpp.html
    locator: bdns_es_orden_cin_1502_2021_bases_cpp.html#chunk 15
  verified: llm_cited
