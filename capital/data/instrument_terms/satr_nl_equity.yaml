- id: G6-cumulation-nationalpark
  gate_family: G6_conditionality
  requirement: Contributions from municipalities, provinces, water boards, public bodies or
    other administrative bodies are treated as public co-financing and are disregarded when
    calculating the maximum grant amount per application under this title.
  value: public co-financing disregarded in max-amount calculation
  intake_field: cofinancingBand
  quote: Bijdragen van gemeenten, provincies, waterschappen, openbare lichamen als bedoeld
    in artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen , of andere bestuursorganen,
    worden aangemerkt als publieke cofinanciering, en blijven bij de toepassing van artikel
    6, eerste lid, van het besluit buiten beschouwing voor zover het de berekening betreft
    van het maximumbedrag dat krachtens deze titel per aanvraag kan worden verstrekt.
  source:
    file: nl_rnes_wetten_overheid_2023.html
    locator: chunk 41#Artikel 2.12.9 Cumulatie
  verified: llm_cited
- id: G1-nationalpark-noneconomic
  gate_family: G1_nexus
  requirement: Applicant receiving this subsidy that also performs economic activities alongside
    the non-economic activities must keep separate accounting for financing, costs and income
    of those economic activities.
  value: separate accounting required if economic activities also performed
  intake_field: borrowerModel
  quote: Indien een subsidieontvanger naast de niet-economische activiteiten, bedoeld in artikel
    2.12.2, eerste lid , ook economische activiteiten verricht, voert de subsidieontvanger
    met betrekking tot de financiering van en de kosten en inkomsten uit die economische activiteiten
    een gescheiden boekhouding.
  source:
    file: nl_rnes_wetten_overheid_2023.html
    locator: chunk 41#Artikel 2.12.8 Verplichtingen subsidieontvangers
  verified: llm_cited
- id: G4-borgstelling-provisie
  gate_family: G4_borrower_model
  requirement: The guarantee mechanism (borgstelling) charges a one-off premium of 3 percent
    of the guaranteed credit, with reduced rates for starters/successors and shorter-term
    loans.
  value: 1% to 3% one-off provisie depending on borrower/term
  intake_field: borrowerModel
  quote: van de provisie, bedoeld in artikel 32, derde lid, van het besluit bedraagt eenmalig
    3 procent.
  source:
    file: nl_rnes_wetten_overheid_2023.html
    locator: chunk 34#Artikel 2.5.4
  verified: llm_cited
- id: G3-borgstelling-omvang
  gate_family: G3_financial
  requirement: The guarantee covers 70% of the credit amount generally, or 90% if the credit
    finances additional investments, subject to a credit ceiling of €1,200,000 (or €2,500,000
    for specified investment types).
  value: 70%/90% guarantee coverage; ceiling €1.2m/€2.5m
  intake_field: ticketBand
  quote: a. 70 procent van het kredietbedrag voor zover het krediet niet strekt tot financiering
    van aanvullende investeringen;
  source:
    file: nl_rnes_wetten_overheid_2023.html
    locator: chunk 34#Artikel 2.5.6 Omvang borgstelling
  verified: llm_cited
obligations:
- requirement: Recipient must submit an application containing at least the data required
    under article 6, second paragraph, of the general block exemption regulation.
  quote: Een aanvraag voor subsidie als bedoeld in artikel 2.5.2 bevat ten minste de gegevens,
    bedoeld in artikel 6, tweede lid, van de algemene groepsvrijstellingsverordening.
  source:
    file: nl_rnes_wetten_overheid_2023.html
    locator: chunk 34#Artikel 2.5.8 Informatieverplichtingen
  verified: llm_cited
- requirement: Activities funded must not favour individual businesses and results must be
    made freely and equally accessible to everyone.
  quote: Alle resultaten van de activiteiten, bedoeld in artikel 2.12.2, eerste lid , worden
    voor een ieder zonder onderscheid kosteloos toegankelijk gemaakt.
  source:
    file: nl_rnes_wetten_overheid_2023.html
    locator: chunk 41#Artikel 2.12.8 Verplichtingen subsidieontvangers
  verified: llm_cited
- requirement: Outsourcing to third parties for performance of activities must occur on the
    basis of transparent criteria and at market-conform rates.
  quote: Opdrachtverlening aan derden voor het verrichten van de activiteiten, bedoeld in
    artikel 2.12.2, eerste lid , of een deel van die activiteiten, vindt plaats op basis van
    transparante criteria en tegen marktconforme tarieven.
  source:
    file: nl_rnes_wetten_overheid_2023.html
    locator: chunk 41#Artikel 2.12.8 Verplichtingen subsidieontvangers
  verified: llm_cited
