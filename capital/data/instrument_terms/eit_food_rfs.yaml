obligations:
- requirement: During the internship, the Mentor must send monthly reports confirming the
    internship is proceeding according to the Internship Agenda plan.
  quote: During the internship, YOUR MENTOR will send us MONTHLY REPORTS as a confirmation
    that the internship goes according to a plan (Internship Agenda).
  source:
    file: eit_food_rfs_info_page.html
    locator: eit_food_rfs_faq_page.html#chunk 2
  verified: llm_cited
- requirement: At the end of the internship, intern and mentor must jointly prepare an Internship
    Feedback document summarizing tasks and activities.
  quote: "At the end of the internship, we will ask you and your Mentor to prepare an Internship\
    \ Feedback as\n a document that will sum up all tasks and activities that you were \n\
    responsible for."
  source:
    file: eit_food_rfs_info_page.html
    locator: eit_food_rfs_faq_page.html#chunk 2
  verified: llm_cited
- requirement: Intern must issue and submit a Tax Residency Certificate (scan by email and
    hard copy by post/courier) to avoid double taxation, though not strictly mandatory to
    start.
  quote: You will also be asked to issue the Tax Residency Certificate from your Tax Office.
  source:
    file: eit_food_rfs_info_page.html
    locator: eit_food_rfs_faq_page.html#chunk 3
  verified: false
  verify_note: 'fragment not found verbatim: ''You will also be asked to issue the Tax Residency
    '''
- requirement: Both the Consent Form and Tax Residency Certificate must be sent by email (scan)
    and hard copy by post/courier.
  quote: Both documents you have to send by email (scan) and a hard copy by post/courier.
  source:
    file: eit_food_rfs_info_page.html
    locator: eit_food_rfs_faq_page.html#chunk 2
  verified: llm_cited
- requirement: Financial support is paid monthly in arrears, only after the host company representative
    confirms the internship is proceeding according to plan.
  quote: The financial support will be paid in monthly instalments after the host company
    representative will confirm that the internship goes according to plan.
  source:
    file: eit_food_rfs_info_page.html
    locator: eit_food_rfs_faq_page.html#chunk 4
