gates:
- id: g1-france-registration
  gate_family: G1_nexus
  requirement: Applicant must be a company registered in France in the commercial and companies
    register (RCS) at the time of application submission.
  value: Registered in France (RCS)
  intake_field: entityCountries
  quote: Être porté par une société immatriculée en France au registre du commerce et des
    sociétés (RCS) à la date de dépôt du dossier
  source:
