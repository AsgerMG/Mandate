  value: Industrial Research / Experimental Development only
  intake_field: developmentStage
  quote: Eligible costs must be focussed on INDUSTRIAL RESEARCH or EXPERIMENTAL DEVELOPMENT19
    and as set out in the Research, Development and Innovation Scheme 2014-2020, with Sections
    1 to 11, 15 and 17 being the relevant sections for the DTIF.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.11
  verified: llm_cited
- id: g5-fundamental-research-excluded
  gate_family: G5_use_of_funds
