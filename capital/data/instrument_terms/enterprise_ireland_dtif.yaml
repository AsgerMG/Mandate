- id: g2-consortium-minimum-composition
  gate_family: G2_size_ownership
  requirement: The consortium must comprise at least 3 independent partners seeking DTIF funding,
    including at least one established manufacturing company and one other enterprise, and
    must include an SME.
  value: At least 3 independent partners incl. 1 manufacturing company, 1 other enterprise,
    1 SME
  intake_field: consortium
  quote: The consortium comprises at least 3 independent partners seeking funding from the
    DTIF including at least one established manufacturing company8 and one other enterprise,
    and must include an SME9.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.7
  verified: llm_cited
- id: g2-sme-definition
  gate_family: G2_size_ownership
  requirement: SME status is determined per EU Recommendation 2003/361 based on staff headcount
    and either turnover or balance sheet total.
  value: Staff headcount ≤250; turnover ≤€50m or balance sheet ≤€43m
  intake_field: fteBand
  quote: 'Small and medium-sized enterprises (SMEs) are defined in the EU recommendation 2003/361.

    The main factors determining whether an enterprise is an SME are:

    1. staff headcount

    2. either turnover and/or balance sheet total.'
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.17
  verified: llm_cited
- id: g2-undertaking-in-difficulty
  gate_family: G2_size_ownership
  requirement: Applicants must not be considered an Undertaking in Difficulty at the time
    of application.
  value: Not an Undertaking in Difficulty
  intake_field: lossesOverHalfCapital
  quote: All company applicants should ensure that the company cannot be considered an Undertaking
    in Difficulty (as defined in COMMISSION REGULATION (EU) No 651/2014 of 17 June 2014 declaring
    certain categories of aid compatible with the internal market in application of Articles
    107 and 108 of the Treaty) at time of application.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.17
  verified: llm_cited
- id: g2-rpo-share-cap
  gate_family: G2_size_ownership
  requirement: RPOs cannot receive more than 50% of the total DTIF grant aid to the project
    in any collaboration.
  value: RPO share of grant aid ≤ 50%
  intake_field: consortium
  quote: RPOs cannot receive more than 50% of the total DTIF grant aid to the project.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.10
  verified: llm_cited
- id: g2-partner-share-minimum
  gate_family: G2_size_ownership
  requirement: No consortium participant should account for less than 10% of the project funding,
    unless holding specific capability/IP, with reduced minimums (3%/10% total) for SMEs doing
    R&D.
  value: Min 10% share per partner (or 3% for SMEs, 10% total for 3 SMEs)
  intake_field: consortium
  quote: There should be appropriate balance in the consortium and no participant should account
    for less than 10% of the project funding, unless they have specific capability or intellectual
    property on which the project hinges.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.10
  verified: llm_cited
- id: g3-minimum-funding-request
  gate_family: G3_financial
  requirement: The consortium must request a minimum funding amount from DTIF of at least
    €1.5 million over 3 years.
  value: Minimum request €1.5 million over 3 years
  intake_field: ticketBand
  quote: The consortium is requesting minimum funding from DTIF of at least €1.5 million over
    3 years7.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.7
  verified: llm_cited
- id: g3-sme-aid-intensity
  gate_family: G3_financial
  requirement: SMEs (enterprises) may claim up to 50% of their eligible project costs.
  value: Up to 50% aid intensity for SMEs
  intake_field: turnoverBand
  quote: Companies may claim up to 50% of their eligible project costs with the exception
    of large companies where the aid intensity is reduced to a flat rate of 40%.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.12
  verified: llm_cited
- id: g3-large-company-aid-intensity
  gate_family: G3_financial
  requirement: Large companies may claim up to 40% (flat rate) of their eligible project costs.
  value: 40% flat rate for large companies
  intake_field: turnoverBand
  quote: large companies where the aid intensity is reduced to a flat rate of 40%
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.12
  verified: llm_cited
- id: g3-rpo-aid-intensity
  gate_family: G3_financial
  requirement: Research Performing Organisations (RPOs) can claim up to 100% of their eligible
    costs.
  value: Up to 100% for RPOs
  intake_field: cofinancingBand
  quote: Research Performing Organisations (RPOs) can claim up to 100% of eligible costs.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.5
  verified: llm_cited
- id: g3-cofunding-cannot-be-state-eu
  gate_family: G3_financial
  requirement: Where a company claims 50% (or 40%) of costs, the remaining costs cannot be
    funded through other State or EU funds.
  value: No other State/EU co-funding for remainder
  intake_field: cofinancingBand
  quote: Where a company is claiming 50% (or 40% as above) of their costs, the other 50% (or
    60%) cannot be funded through other State or EU funds.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.12
  verified: llm_cited
- id: g3-pre-finance-small-companies
  gate_family: G3_financial
  requirement: Small companies (fewer than 50 employees) may receive pre-finance of up to
    one-third of the research grant prior to costs being incurred, subject to conditions.
  value: Pre-finance up to 1/3 of grant for companies <50 employees
  intake_field: fteBand
  quote: 'Enterprise Ireland can make payment of up to one-third of the research grant prior
    to the approved costs being incurred (grant rate: 50%), subject to the company supplying:'
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.12
  verified: llm_cited
- id: g4-grant-mechanism
  gate_family: G4_borrower_model
  requirement: DTIF operates as a grant funding aid scheme reimbursing incurred costs, not
    a loan or equity instrument.
  value: Grant, paid retrospectively on incurred costs
  intake_field: borrowerModel
  quote: In general, claims will be based on incurred costs and paid retrospectively.
  source:
    file: enterprise_ireland_dtif_call5_guide.pdf
    locator: enterprise_ireland_dtif_call5_guide.pdf#p.11
  verified: llm_cited
- id: g5-eligible-cost-focus
  gate_family: G5_use_of_funds
  requirement: Eligible costs must be focussed on Industrial Research or Experimental Development,
