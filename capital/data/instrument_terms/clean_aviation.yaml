- id: g4-in-kind-contribution
  gate_family: G4_borrower_model
  requirement: Founding Members and Associated Members must bring in-kind contributions (IKOP
    and IKAA) sufficient to collectively ensure the minimum level of in-kind contribution
    (IKC) of €2.4 billion set under Article 61 of the SBA.
  value: €2.4 billion minimum in-kind contribution (incl. up to €39.2 million admin costs)
  intake_field: institutionalBacking
  quote: the Founding Members and Associated Members shall bring an amount of in-kind contribution
    to operational activities ‘IKOP’ at the level of the indirect actions and an amount of
    in-kind contribution to additional activities ‘IKAA’ both at the level of the indirect
    actions and at the level of the Programme to be able to collectively ensure the minimum
    level of in-kind contribution (IKC) (€2.4 billion, including up to €39.2 million for administrative
    costs) set under Article 61 of the SBA.
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.81
  verified: llm_cited
- id: g6-minimum-trl4-call4
  gate_family: G6_conditionality
  requirement: The content of Call 4 is contingent upon progress achieved in Phase 1, with
    a requirement to reach a minimum TRL 4 by the project end.
  value: Minimum TRL 4 by project end required
  intake_field: developmentStage
  quote: The content of Call 4 will be prepared between Q3 2025 an early 2026 and is contingent
    upon progress achieved in Phase 1, with a requirement to reach a minimum TRL 4 by the
    project end.
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.77
  verified: llm_cited
obligations:
- requirement: Beneficiaries must, up to 10 years after the end of the action, inform the
    granting authority if results could reasonably be expected to contribute to European or
    international standards.
  quote: beneficiaries are required up to 10 years after the end of the action to inform the
    granting authority if the results could reasonably be expected to contribute to European
    or international standards
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.87
  verified: llm_cited
- requirement: If no exploitation of results takes place within one year after the period
    set out in the MGA, beneficiaries must use the Horizon Results Platform and/or CAJU membership
    to find interested parties to exploit those results, unless waived.
  quote: If no exploitation takes place within one year after the period set out in Article
    4 of the MGA, the beneficiary must use the Horizon Results Platform and/or the CAJU membership
    to find interested parties to exploit those results. If justified on the basis of a request
    of the beneficiary, this obligation may be waived.
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.87
  verified: llm_cited
- requirement: Selected participants must accede to the Clean Aviation Cooperation Agreement
    under the conditions set out in Annex 5 of the MGA.
  quote: Participants in projects selected under the relevant call topics will be required
    to accede to the Clean Aviation Cooperation Agreement - under the conditions set out in
    Annex 5 of the MGA.
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.92
  verified: llm_cited
- requirement: Founding and Associated Members must ensure compliance with the Membership
    Agreement, including contributions from non-Members, via conclusion of a suitable Consortium
    Agreement governing the project.
  quote: Founding and Associated Members must also ensure compliance with the Membership Agreement
    including contributions from non-Members, inter alia via the conclusion of a suitable
    Consortium Agreement [CA] governing the project and its consortium.
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.92
  verified: llm_cited
- requirement: If requested, beneficiaries must grant non-exclusive licenses to their results,
    for a limited period specified in the request, on fair and reasonable conditions, to entities
    addressing a public emergency, up to four years after the end of the action.
  quote: If requested by the granting authority, beneficiaries must grant non-exclusive licenses
    to their results – for a limited period of time specified in the request and based on
    fair and reasonable conditions – to legal entities that need the results to address a
    public emergency.
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.92
  verified: llm_cited
