cumulation:
  text: CAJU complies with Article 29 of the SBA on multi-annual instalments, capping cumulative
    budgetary commitments in instalments and requiring UK-ineligible allocation of carried-over
    appropriations to specific calls.
  quote: CAJU complies with the Article 29 of the Single Basic Act (SBA) establishing that
    until 2024, the cumulative amount of budgetary commitments in instalments shall not exceed
    50 % of the total budget for the programme period, and that from 2025 onwards, at least
    20% of the cumulative budget of the residual years shall not be covered by annual instalments.
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.120
  verified: llm_cited
application:
  channel: EU Funding & Tenders opportunities portal via published Calls for Proposals
  typical_timeline: Two Calls for Proposals published in early 2026 (Call 4) and early 2027
    (Call 5)
  quote: As part of the Clean Aviation Work Programme 2026-2027, two Calls for Proposals will
    be published in early 2026 and early 2027 to fund Innovation Actions (IAs),Research and
    Innovation Actions (RIAs) and Coordination and Support Actions (CSAs).
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.77
  verified: llm_cited
