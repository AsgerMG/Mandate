gates:
- id: g1-eligible-countries
  gate_family: G1_nexus
  requirement: 'Applicants must be established in one of the eligible countries: EU Member
    States (including outermost regions), Overseas Countries and Territories linked to Member
    States, countries associated to Horizon Europe, or low- and middle-income countries.'
  value: EU Member States, OCTs, HE Associated Countries, low- and middle-income countries
  intake_field: entityCountries
  quote: 'To be eligible for funding, applicants must be established in one of the eligible
    countries, i.e.:

    - the Member States of the European Union, including their outermost regions

    - the Overseas Countries and Territories (OCTs) linked to the Member States

    - countries associated to Horizon Europe26

    - low- and middle-income countries27'
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.82
  verified: llm_cited
- id: g1-uk-non-eligible
  gate_family: G1_nexus
  requirement: Entities established in the UK are non-eligible for EU funding in award procedures
    implementing the budgets 2021 to 2023, and carried-over appropriations may not be used
    to fund UK beneficiaries.
  value: UK entities excluded (2021-2023 budgets)
  intake_field: entityCountries
  quote: entities established in the UK in award procedures implementing budget 2021 to 2023
    are non-eligible for EU funding, nor carried over appropriations should be used to fund
    UK beneficiaries.
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.120
  verified: llm_cited
- id: g1-associated-country-restriction
  gate_family: G1_nexus
  requirement: Legal entities established in countries without a concluded or legally effective
    Horizon Europe Association Agreement may not be selected for CAJU membership.
  value: Association Agreement to Horizon Europe required and in legal effect
  intake_field: entityCountries
  quote: 'legal entities established in countries with which an Association Agreement to the
    Horizon Europe has not yet been concluded, or

    - legal entities established in countries with which an Association Agreement has been
    concluded but it has not yet started producing legal effects either through provisional
    application or their entry into force'
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.81
  verified: llm_cited
- id: g1-consortium-composition
  gate_family: G1_nexus
  requirement: Consortia must include at least one independent legal entity established in
    a Member State and at least two other independent legal entities each established in different
    Member States or Associated Countries, unless otherwise provided.
  value: Min. 3 independent legal entities from 3 different MS/Associated Countries
  intake_field: consortium
  quote: 'legal entities forming a consortium are eligible to participate in actions provided
    that the consortium includes:

    - at least one independent legal entity established in a Member State;

    - at least two other independent legal entities, each established in different Member
    States or Associated Countries.'
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.83
  verified: llm_cited
- id: g1-single-entity-derogation
  gate_family: G1_nexus
  requirement: Pursuant to Article 72 of the SBA Regulation, where duly justified in the topic
    conditions, a single legal entity or a consortium not meeting the standard composition
    condition may be eligible to participate in indirect actions.
  value: Single-entity derogation possible if justified in call topic conditions
  intake_field: consortium
  quote: a single legal entity established in a Member State or Associated Country or consortia
    not meeting the condition laid down in Article 22.2 of the Horizon Europe Regulation shall
    be eligible to participate in indirect actions funded by the Clean Aviation Joint Undertaking.
  source:
    file: clean_aviation_amended_wpb_2026_2027.pdf
    locator: clean_aviation_amended_wpb_2026_2027.pdf#p.83
  verified: llm_cited
