cumulation:
  text: Links to other Enterprise Ireland funding (e.g. R&D Fund, Commercialisation Fund)
    are assessed as part of the commercial assessment.
  quote: Are there any links to other EI funding – e.g. R&D Fund, Commercialisation Fund?
  source:
    file: enterprise_ireland_ipp_guidelines_2025.pdf
    locator: enterprise_ireland_ipp_guidelines_2025.pdf#p.6
  verified: llm_cited
application:
  channel: Application via Principal Investigator at the research institute, submitted by
    email to ipp@enterprise-ireland.com, via Outline Proposal, optional Feasibility Study,
    then Full Proposal, decided by the Industry Research and Commercialisation Committee (IRCC).
  typical_timeline: 6-8 weeks for a decision after receipt of a full and complete eligible
    proposal.
  quote: Upon receipt of a full and complete eligible proposal, Enterprise Ireland will aim
    to provide the consortium with a decision, from Enterprise Ireland’s Industry Research
    and Commercialisation Committee, within 6-8 weeks.
  source:
    file: enterprise_ireland_ipp_guidelines_2025.pdf
    locator: enterprise_ireland_ipp_guidelines_2025.pdf#p.5
  verified: llm_cited
