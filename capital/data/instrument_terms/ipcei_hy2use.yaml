application:
  channel: Notification by Member States to the European Commission under Article 108(3) TFEU;
    national funding agreements concluded following Commission approval decision
  typical_timeline: Aid granted following prior Commission approval; national funding agreements
    expected to be concluded after the Commission's decision
  quote: 'The Member States submit that they shall not grant State aid to any of the

    individual projects before notification of the Commission’s decision approving

    aid for the execution of Hy2Use. The granting of State aid will be governed by

    national funding agreements that are expected to be concluded following the

    Commission’s decision'
  source:
    file: ipcei_hy2use_commission_decision_SA64650.pdf
    locator: p.59
  verified: llm_cited
