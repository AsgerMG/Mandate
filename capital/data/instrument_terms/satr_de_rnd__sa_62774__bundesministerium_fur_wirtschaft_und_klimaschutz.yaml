  value: Manufacturing-linked commercial enterprises (German seat) plus universities/research institutions/public
    bodies
  intake_field: entityCountries
  quote: Zuwendungsempfänger können Unternehmen der gewerblichen Wirtschaft mit Bezügen zum produzierenden
