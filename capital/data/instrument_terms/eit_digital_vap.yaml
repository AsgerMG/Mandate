obligations:
- requirement: Selected companies must sign the Scaleup Support Agreement with EIT Digital
    Accelerator.
  quote: Sign the Scaleup Support Agreement with EIT Digital Accelerator
  source:
    file: eit_digital_vap_venture_program_page.html
    locator: eit_digital_vap_call_2022.pdf#p.5
  verified: llm_cited
- requirement: Selected companies must appoint internal resources to ensure successful collaboration
    with the EIT Digital Accelerator.
  quote: 'Appoint the necessary internal resources to allow for a successful collaboration
    with the EIT

    Digital Accelerator, minimize collaboration delays and maximize impact'
  source:
    file: eit_digital_vap_venture_program_page.html
    locator: eit_digital_vap_call_2022.pdf#p.5
  verified: llm_cited
- requirement: Selected companies must submit a mandatory final report at the end of the acceleration
    period covering the acceleration description, key objectives identified, and lessons learned.
  quote: 'A mandatory final report is expected at the end of the acceleration period. Templates
    for the

    reports will be provided. The reports will contain at least:

    Acceleration description

    o

    Key objectives (pain points) identified

    o

    Lessons learned (successes and outcomes)'
  source:
    file: eit_digital_vap_venture_program_page.html
    locator: eit_digital_vap_call_2022.pdf#p.5
  verified: llm_cited
- requirement: A success fee will apply for deals closed after the 12-month acceleration period,
    though no fee applies during the acceleration period itself.
  quote: 'No success fees will be charged for deals closed during the 12

    months of acceleration period. However, for deals closed after said 12 months, a success
    fee will

    apply.'
  source:
    file: eit_digital_vap_venture_program_page.html
    locator: eit_digital_vap_call_2022.pdf#p.5
  verified: llm_cited
- requirement: Teams must incorporate their venture and demonstrate a validated MVP before
    applying for the Final Prize stage.
  quote: Teams that successfully complete Stage 1, incorporate their venture, and demonstrate
    a validated MVP may apply for the Final Prize stage.
  source:
    file: eit_digital_vap_venture_program_page.html
    locator: eit_digital_vap_venture_program_page.html#chunk 2
  verified: llm_cited
