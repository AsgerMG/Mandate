cumulation:
  text: De minimis aid to a single undertaking may not exceed EUR 300,000 gross grant equivalent
    over any three-year period and may be cumulated with other de minimis aid up to the highest
    applicable ceiling under other de minimis regulations, and may also be cumulated with
    State aid for the same eligible costs if intensity/amount limits under block exemption
    regulations or Commission decisions are not exceeded.
  quote: 'A kedvezményezett és a vele egy és ugyanazon vállalkozásnak minősülő vállalkozások
    részére az (EU) 2023/2831 bizottsági rendelet hatálya alá tartozó, bármely három év során
    Magyarországon odaítélt csekély összegű támogatás (ezen alcím alkalmazásában a továbbiakban:
    támogatás) bruttó támogatástartalma nem haladhatja meg a 300 000 eurónak megfelelő forintösszeget'
  source:
    file: hu_nkfi_alap_380_2014_korm_rendelet.html
    locator: hu_nkfi_alap_380_2014_korm_rendelet.html#chunk 17
  verified: llm_cited
