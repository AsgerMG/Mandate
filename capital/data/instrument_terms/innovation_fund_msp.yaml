cumulation:
  text: Innovation Fund grants may be combined with funding from another directly-managed
    EU programme provided the EU Synergies clause is enabled in both grant agreements and
    the combined funding rate does not exceed 100%; combination with EU operating grants is
    also possible under conditions.
  quote: 'Innovation Fund grants may be combined with funding

    from another EU programme (directly managed by the EU Commission), if in both

    grants the EU Synergies actions’ clause is enabled in Article 6.3 of the Model Grant

    Agreement and the combined funding rates at grant level do not exceed 100% (see

    AGA — Annotated Grant Agreement, art 6.3).'
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf#p.41
  verified: llm_cited
