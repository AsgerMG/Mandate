obligations:
- requirement: Beneficiaries must confirm mandate to act for all applicants and that all participants
    comply with eligibility, financial/operational capacity and exclusion conditions; each
    beneficiary and affiliated entity must sign a declaration of honour before grant signature.
  quote: 'Before signing the grant, each beneficiary and affiliated entity will have

    to confirm this again by signing a declaration of honour (DoH). Proposals without full

    mandate will be rejected.'
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf#p.15
  verified: llm_cited
- requirement: Applicants must demonstrate sufficient operational capacity (know-how, qualifications,
    resources) to implement the project.
  quote: 'Applicants must have the know-how, qualifications and resources to successfully

    implement the projects and contribute their share (including sufficient experience in

    projects of comparable size and nature).'
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf#p.20
  verified: llm_cited
- requirement: Projects must comply with the 'do no significant harm' Technical Screening
    Criteria for the climate change mitigation objective where such criteria exist for the
    economic activity carried out.
  quote: 'projects must demonstrate that they comply

    with the DNSH technical screening criteria (TSC) set out in Annex

    II to Commission Delegated Regulation (EU) 2021/2139, (EU)

    2022/1214 and/or Commission Delegated Regulation (EU)

    2023/2486 for the environmental objective ‘climate change

    mitigation’ where TSC exist for an economic activity carried out

    by the project (see Annex 4).'
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf#p.25
  verified: llm_cited
- requirement: Beneficiaries are subject to a liability regime for recoveries as fixed in
    the Grant Agreement, which may include joint and several liability.
  quote: 'limited joint and several liability with individual ceilings — each beneficiary
    up

    to their maximum grant amount

    − unconditional joint and several liability — each beneficiary up to the maximum

    grant amount for the action'
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf#p.37
  verified: llm_cited
- requirement: Proposals for projects already completed will be rejected; proposals for started
    projects are assessed case-by-case, with no reimbursement for costs incurred before the
    project starting date.
  quote: 'Proposals for projects that have already been

    completed will be rejected; proposals for projects that have already started will be

    assessed on a case-by-case basis (in this case, no costs can be reimbursed for

    activities that took place before the project starting date/proposal submission).'
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf#p.41
  verified: llm_cited
