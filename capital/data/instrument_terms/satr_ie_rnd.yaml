cumulation:
  text: Aid under the SME/start-up scheme may not be cumulated with de minimis aid for the
    same eligible costs if it would exceed the GBER aid intensity ceilings.
  quote: Aid under this Scheme shall not be cumulated with any de minimis aid in respect of
    the same eligible costs if such cumulation would result in an aid intensity exceeding
    those laid down in the Regulation.
  source:
    file: ie_smes_startups_aid_scheme.pdf
    locator: ie_smes_startups_aid_scheme.pdf#p.5
  verified: llm_cited
application:
  channel: Application submitted directly to Enterprise Ireland (or Údarás na Gaeltachta/Local
    Enterprise Office) via online application forms; project must not start before submission.
  typical_timeline: Applications accepted anytime; approval expected within Delegated Powers
    up to €150,000 (MAC) or Investment Committee above that threshold; project must begin
    within six months of approval.
  quote: Applications for funding can be submitted anytime. Application forms and company
    guidelines are available on the Enterprise Ireland website.
  source:
    file: ie_smes_startups_aid_scheme.pdf
    locator: enterprise_ireland_tor_rd_2024.pdf#p.13
  verified: llm_cited
