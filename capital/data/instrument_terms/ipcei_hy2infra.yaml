cumulation:
  text: Cumulation with other aid to cover the same eligible costs is permitted provided the
    total public funding does not exceed the most favourable funding rate under applicable
    Union law rules.
  quote: the participating Member States have confirmed that the total amount of public funding
    granted in relation to the same eligible costs will not exceed the most favourable funding
    rate laid down in the applicable rules of Union law
  source:
    file: ipcei_hy2infra_commission_decision_SA102825.pdf
    locator: ipcei_hy2infra_commission_decision_SA102825.pdf#p.132
  verified: llm_cited
application:
  channel: National funding authorities of participating Member States, following national
    calls and funding agreements; notified collectively to the European Commission under Article
    107(3)(b) TFEU.
  typical_timeline: Application for aid must precede the start of works; national funding
    agreements concluded following the Commission's approval decision; annual reporting thereafter
    until end of project lifetime.
  quote: the participating undertakings’ individual projects are governed by funding agreements
    to be concluded with the relevant funding authority within each participating Member State.
  source:
    file: ipcei_hy2infra_commission_decision_SA102825.pdf
    locator: ipcei_hy2infra_commission_decision_SA102825.pdf#p.87
  verified: llm_cited
