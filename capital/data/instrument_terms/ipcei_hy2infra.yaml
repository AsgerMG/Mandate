obligations:
- requirement: Participating undertakings and Member States must submit annual reporting on
    execution of activities, spillovers, and DNSH compliance to national funding authorities
    and the Commission.
  quote: the participating undertakings will report annually the execution of their activities,
    as regards the advancements of their individual projects, the individually committed spillovers
    and the compliance with the DNSH principle to the national funding authorities.
  source:
    file: ipcei_hy2infra_commission_decision_SA102825.pdf
    locator: ipcei_hy2infra_commission_decision_SA102825.pdf#p.139
  verified: llm_cited
- requirement: The concerned Member States must report to the Commission on the application
    of the claw-back mechanism annually by the end of September until the end of the project's
    lifetime.
  quote: The application of the claw-back mechanism will be reported by the Member State to
    the European Commission by the end of September each year until the end of the project’s
    lifetime.
  source:
    file: ipcei_hy2infra_commission_decision_SA102825.pdf
    locator: ipcei_hy2infra_commission_decision_SA102825.pdf#p.143
  verified: llm_cited
- requirement: Beneficiaries must maintain separate analytical accounting and have ex-post
    financial figures subject to annual approval by an independent auditor as the basis for
    the claw-back mechanism.
  quote: The basis for the claw-back mechanism will be ex-post financial figures, which have
    been subject to annual approval by an independent auditor. For this purpose, separate
    analytical accounting will be required from the participating undertakings in the relevant
    Member State.
  source:
    file: ipcei_hy2infra_commission_decision_SA102825.pdf
    locator: ipcei_hy2infra_commission_decision_SA102825.pdf#p.91
  verified: llm_cited
- requirement: The participating Member States must comply with transparency and publication
    requirements, publishing the full text of the individual aid granting decision and related
    information.
  quote: the participating Member States have committed to publish in the Commission’s transparency
    award module or on a comprehensive State aid website, at national or regional level, the
    full text of the individual aid granting decision and its implementing provisions or a
    link to it
  source:
    file: ipcei_hy2infra_commission_decision_SA102825.pdf
    locator: ipcei_hy2infra_commission_decision_SA102825.pdf#p.92
  verified: llm_cited
