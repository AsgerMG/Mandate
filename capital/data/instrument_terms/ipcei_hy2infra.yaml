  source:
    file: ipcei_hy2infra_commission_decision_SA102825.pdf
    locator: ipcei_hy2infra_commission_decision_SA102825.pdf#p.125
  verified: llm_cited
- id: G6-02
  gate_family: G6_conditionality
  requirement: Projects involving construction of infrastructure must comply with principles
