  source:
    file: ipcei_hy2infra_commission_decision_SA102825.pdf
    locator: ipcei_hy2infra_commission_decision_SA102825.pdf#p.114
  verified: llm_cited
- id: G6-03
  gate_family: G6_conditionality
  requirement: The project must comply with the do-no-significant-harm (DNSH) principle across
