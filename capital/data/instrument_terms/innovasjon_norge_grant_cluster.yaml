obligations:
- requirement: Applicant must not assume other public support beyond what is stated in the
    application when Innovasjon Norge calculates the grant amount for the eligible project
    costs.
  quote: Ved fastsettelse av tilskuddsbeløpet legger derfor vi til grunn at det ikke mottas
    annen offentlig støtte, herunder Skattefunn, enn det som er oppgitt i søknaden.
  source:
    file: innovasjon_norge_grant_cluster_bedriftsnettverk.html
    locator: innovasjon_norge_grant_cluster_bedriftsnettverk.html#chunk 1
  verified: llm_cited
- requirement: Applicant may still receive other public support for other project costs not
    covered by Innovasjon Norge's grant calculation.
