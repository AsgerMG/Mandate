  gate_family: G4_borrower_model
  requirement: Start of loan repayment can be deferred by up to 24 months.
  value: Deferral up to 24 months
  intake_field: borrowerModel
  quote: Aizdevuma atmaksas uzsākšanu var atlikt līdz 24 mēnešiem
  source:
