- id: g2-exclude-undertaking-in-difficulty-micro-small
  gate_family: G2_size_ownership
  requirement: Support is not granted to a micro or small undertaking that was already in
    difficulty on 31 December 2019 and, at the time of granting, is subject to legal protection
