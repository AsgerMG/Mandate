  value: ≤ EUR 900,000 cumulative per recipient/group
  intake_field: ticketBand
  quote: iepriekš saņemto grantu un aizdevumu neatmaksātā kopsumma vienam atbalsta saņēmējam
    un ar to saistīto personu grupai, kas piešķirta šo noteikumu ietvaros, nepārsniedz 900
