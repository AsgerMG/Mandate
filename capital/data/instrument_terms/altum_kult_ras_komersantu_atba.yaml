- id: g5-grant-eligible-costs
  gate_family: G5_use_of_funds
  requirement: 'The grant portion of support may only be used to compensate specific event
    costs: artistic preparation costs and performer fees, and technical equipment costs.'
  value: Artistic preparation/performer fees + technical equipment
  intake_field: none
  quote: 'Atbalstu granta veidā sniedz, kompensējot šādas pasākuma izmaksas: 18.1. pasākuma
    mākslinieciskās sagatavošanas izmaksas un atlīdzība izpildītājiem (piemēram, māksliniekiem,
    scenogrāfiem, režisoriem); 18.2. tehniskā nodrošinājuma izmaksas (piemēram, skatuvei,
    gaismām, telpām)'
  source:
    file: altum_kult_ras_komersantu_atba_mk_noteikumi_320816.html
    locator: chunk 2, §18
  verified: llm_cited
obligations:
- requirement: Applicant must submit information and confirmation about previously received
    and planned limited-amount aid under the Temporary Framework, including grant date, granting
    authority, legal basis, instrument, and repaid amount if applicable.
  quote: informāciju un apliecinājumu par iepriekš saņemtā un plānotā ierobežota apjoma atbalsta
    apmēru, kas izsniegts saskaņā ar Eiropas Komisijas 2020. gada 19. marta paziņojumu "Pagaidu
    regulējums valsts atbalsta pasākumiem, ar ko atbalsta ekonomiku pašreizējā Covid-19 uzliesmojuma
    situācijā" (C(2020)1863) (turpmāk – Pagaidu regulējums), tā piešķiršanas datumu, atbalsta
    sniedzēja nosaukumu, normatīvos aktus, saskaņā ar kuriem ierobežota apjoma atbalsts ir
    piešķirts vai plānots to piešķirt, atbalsta instrumentu un, ja attiecināms, atmaksātā
    ierobežota apjoma atbalsta apmēru
  source:
    file: altum_kult_ras_komersantu_atba_mk_noteikumi_320816.html
    locator: chunk 2, §20.2
  verified: llm_cited
- requirement: If multiple recipients apply for the same event, each must confirm that its
    application does not include cost items for which another recipient has applied or plans
    to apply.
  quote: apliecinājumu, ka atbalsta pieteikumā nav iekļautas tādas pasākuma īstenošanas izmaksu
    pozīcijas, par kurām atbalstam ir pieteicies vai plāno pieteikties cits atbalsta saņēmējs
  source:
    file: altum_kult_ras_komersantu_atba_mk_noteikumi_320816.html
    locator: chunk 2, §20.3
  verified: llm_cited
- requirement: After the event takes place, the recipient must submit a report to Altum on
    the implementation of the event, including revenue and expenses, timing, visitor numbers
    and other related matters; if the event did not take place due to Covid-19 restrictions,
    additional information on the reasons must be provided.
  quote: Pēc pasākuma norises atbalsta saņēmējs sabiedrībā "Altum" iesniedz pārskatu par pasākuma
    īstenošanu. Pārskatā sniedz informāciju par ieņēmumiem un izdevumiem, pasākuma norises
    laiku, apmeklētāju skaitu un citiem ar pasākuma īstenošanu saistītiem jautājumiem
  source:
    file: altum_kult_ras_komersantu_atba_mk_noteikumi_320816.html
    locator: chunk 2, §23.1
  verified: llm_cited
