  value: Excludes NACE Section K
  intake_field: activityCountries
  quote: Atbalsts šo noteikumu ietvaros netiek piešķirts finanšu un apdrošināšanas darbībai
    (NACE 2.  redakcijas K sadaļa "Finanšu un apdrošināšanas darbības")
  source:
    file: altum_kult_ras_komersantu_atba_mk_noteikumi_320816.html
