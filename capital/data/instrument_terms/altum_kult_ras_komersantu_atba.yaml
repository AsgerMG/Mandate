    locator: chunk 2, §10.3
  verified: llm_cited
- id: g3-max-support-per-event
  gate_family: G3_financial
  requirement: Maximum support amount for implementation of one event is EUR 300,000.
  value: Max EUR 300,000 per event
  intake_field: ticketBand
  quote: Maksimālais atbalsta apmērs viena pasākuma īstenošanai ir 300 000 euro
  source:
    file: altum_kult_ras_komersantu_atba_mk_noteikumi_320816.html
    locator: chunk 2, §11
  verified: llm_cited
- id: g3-loan-grant-ratio
  gate_family: G3_financial
  requirement: The combined loan and grant amount for implementing an event cannot exceed
