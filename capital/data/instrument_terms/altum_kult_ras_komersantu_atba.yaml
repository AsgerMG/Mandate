  source:
    file: altum_kult_ras_komersantu_atba_mk_noteikumi_320816.html
    locator: chunk 2, §13
  verified: llm_cited
- id: g3-max-cumulative-support
  gate_family: G3_financial
  requirement: The cumulative outstanding grants and loans previously received and newly granted
