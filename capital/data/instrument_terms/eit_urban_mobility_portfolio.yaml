    value may have tax implications, which can vary depending on the country of incorporation.
    We strongly recommend consulting with a local tax advisor to fully understand any potential
    tax liabilities or obligations related to these aspects of the funding.
  source:
    file: eit_urban_mobility_portfolio_startup_investment_page.html
    locator: chunk 4
  verified: llm_cited
