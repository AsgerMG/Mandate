cumulation:
  text: Cumulation with other aid, de minimis aid, or other Union funding covering the same
    eligible costs is permitted only up to the most favourable funding rate under applicable
    Union law rules.
  quote: cumulation with other aid, de minimis aid (37) or Union funding will be allowed to
    cover the same eligible costs, provided that the total amount of public funding granted
    in relation to the same eligible costs does not exceed the most favourable funding rate
    laid down in the applicable rules of Union law, pursuant to point 35 of the IPCEI Communication
  source:
    file: ipcei_cloud_commission_decision_SA102517.pdf
    locator: ipcei_cloud_commission_decision_SA102517.pdf#p.68
  verified: llm_cited
application:
  channel: National funding agreements concluded following the Commission's approval decision,
    with Member States as granting authorities (SA.102517 IPCEI decision)
  typical_timeline: State aid may only be granted after Commission approval and conclusion
    of national funding agreements; annual reporting thereafter until end of project
  quote: The granting of State aid will be governed by national funding agreements that are
    expected to be concluded following the Commission's decision
  source:
    file: ipcei_cloud_commission_decision_SA102517.pdf
    locator: ipcei_cloud_commission_decision_SA102517.pdf#p.70
  verified: llm_cited
