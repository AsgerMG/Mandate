cumulation:
  text: Other public funding or guarantees for the same activities must be notified to IFD
    and may be offset against IFD's investment so that combined co-financing does not exceed
    the maximum IFD could provide alone; violation may require reimbursement of entire IFD
    and EU investment.
  quote: Such funding/guarantees might be offset in the investment which IFD provides or has
    provided, thus the maximal co-financing percentage/the guarantee coverage offered by IFD
    and others is identical to the maximal co-financing IFD can provide without such alternative
    cofounding.
  source:
    file: innovationsfonden_other_general_terms_international_projects_2018.pdf
    locator: p.9
  verified: llm_cited
