- id: g1-also-eligible-research
  gate_family: G1_nexus
  requirement: Universities and research institutions per Article 2(83) GBER, associations with R&D capacity
    in Germany, and public authorities/administrative bodies are also eligible applicants.
  value: 'Also eligible: universities, research institutions, associations with R&D capacity, public authorities'
  intake_field: borrowerModel
  quote: Antragsberechtigt sind auch Hochschulen und Forschungseinrichtungen gemäß Artikel 2 Nummer 83
