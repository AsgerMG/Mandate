gates:
- id: g1-eligible-applicants
  gate_family: G1_nexus
  requirement: Eligible applicants are commercial enterprises and members of the liberal professions (in
    particular lawyers, engineers, architects) with an establishment in Germany.
  value: Commercial enterprises and liberal professions with German establishment
  intake_field: entityCountries
  quote: Antragsberechtigt sind Unternehmen der gewerblichen Wirtschaft sowie Angehörige der Freien Berufe
    (insbesondere Rechtsanwälte, Ingenieure, Architekten) mit einer Betriebsstätte oder Niederlassung
    in Deutschland.
  source:
