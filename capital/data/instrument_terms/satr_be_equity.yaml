application:
  channel: Online application submitted during a specific call (oproep) with fixed deadlines,
    assessed by a jury of economic and cultural experts on a competitive, ranked basis until
    budget is exhausted; Wallimage requires direct contact for financing requests.
  typical_timeline: 'Two calls per year (deadlines in March and September for Screen Flanders);
    Oproep 1: 06-03-2026, Oproep 2: 04-09-2026'
  quote: Screen Flanders heeft twee oproepen per jaar met deadlines in maart en september.
    Elke oproep beschikt over een specifieke budgetenveloppe.
  source:
    file: be_screenflanders_criteria.html
    locator: be_screenflanders_criteria.html#chunk 2
  verified: llm_cited
