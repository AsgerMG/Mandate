- id: g6_project_not_started
  gate_family: G6_conditionality
  requirement: The project must not have started, and expenses must not have been committed,
    before the application submission date.
  value: No commitment/expenditure before application date
  intake_field: conditionality
  quote: Le projet ne doit pas avoir commencé avant le dépôt de la candidature. Les dépenses
    ne doivent pas avoir été engagées avant le dépôt de la candidature (ex. devis signé, acompte
    sur commande, réservation de salon,…)
  source:
    file: bpifrance_pmup_idf_guide_candidat_2024.pdf
    locator: bpifrance_pmup_idf_guide_candidat_2024.pdf#p.5
  verified: llm_cited
- id: g6_ecological_transition_axis
  gate_family: G6_conditionality
  requirement: Projects must systematically include actions dedicated to ecological and energy
    transition linked to their growth strategy, and must justify implementing at least one
    such action for balance payment.
  value: Mandatory ecological/energy transition axis with proof at balance payment
  intake_field: conditionality
  quote: IMPORTANT. Conformément au règlement d’intervention, les projets doivent présenter
    un axe de développement dédié à la transition écologique et énergétique. Pour le versement
    du solde de la subvention, l’entreprise devra justifier de la mise en œuvre d’au moins
    une action relevant de cette transition.
  source:
    file: bpifrance_pmup_idf_guide_candidat_2024.pdf
    locator: bpifrance_pmup_idf_guide_candidat_2024.pdf#p.29
  verified: llm_cited
- id: g6_no_conflict_of_interest
  gate_family: G6_conditionality
  requirement: Expenditure must be incurred with a third party at arm's length market conditions,
    without the buyer being able to exercise control over the seller or vice versa.
  value: No conflict of interest between company and provider
  intake_field: conditionality
  quote: Les dépenses doivent être effectuées auprès d’un tiers aux conditions du marché,
    sans que l’acquéreur soit en position d’exercer un contrôle sur le vendeur, et vice versa
  source:
    file: bpifrance_pmup_idf_guide_candidat_2024.pdf
    locator: bpifrance_pmup_idf_guide_candidat_2024.pdf#p.22
  verified: false
  verify_note: 'fragment not found verbatim: ''Les dépenses doivent être effectuées auprès
