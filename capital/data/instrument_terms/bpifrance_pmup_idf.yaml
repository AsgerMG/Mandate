cumulation:
  text: Cumulation of public subsidies on the same expenditure line is capped at 50% of the
    total amount, or 10%/20% for amortizable investments, and double regional funding (agriculture,
    culture, environment, training) is excluded.
  quote: 'Le cumul de subventions publiques, au-delà de 50%, ou au- delà de 10% ou 20% pour
    les investissements amortissables du montant total, n’est pas possible


    • Exclusion du double financement de régional (agriculture, culture, environnement, formation
    … )'
  source:
    file: bpifrance_pmup_idf_guide_candidat_2024.pdf
    locator: bpifrance_pmup_idf_guide_candidat_2024.pdf#p.22
  verified: false
application:
  channel: Application filed via the regional platform mesdemarches.iledefrance.fr, following
    a preliminary intention form, pre-selection committee review, in-depth diagnostic instruction,
    and monthly regional selection jury.
  typical_timeline: Pre-qualification phase up to 20 days; complementary documents to be returned
    within 4 weeks; jury meets monthly; applications accepted on a rolling basis throughout
    the year.
  quote: La demande est à déposer sur la plateforme régionale mesdemarches.iledefrance.fr
    Les candidatures peuvent être déposées « au fil de l'eau »  et sont relevées régulièrement
    tout au long de l'année. Le jury de sélection se réunit à un rythme mensuel.
  source:
    file: bpifrance_pmup_idf_guide_candidat_2024.pdf
    locator: bpifrance_pmup_idf_iledefrance_page.html#chunk 2
  verified: llm_cited
