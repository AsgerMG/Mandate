- id: g3_grant_ceiling
  gate_family: G3_financial
  requirement: The grant is capped at €250,000, exceptionally increased to €375,000 for projects
    in economic reconquest zones or with strong ecological impact.
  value: Cap €250,000; bonus up to €375,000
  intake_field: ticketBand
  quote: 'L’aide plafonnée à 250 000€ permet le financement, des investissements matériels
    et immatériels, des prestations de conseil, des recrutements structurants ainsi que les
    dépenses de développement à l’international (conseil, salons, VIE) et de dépôt et extension
    de brevets

    L’aide peut être exceptionnellement bonifiée à hauteur de 375 000 €'
  source:
    file: bpifrance_pmup_idf_guide_candidat_2024.pdf
    locator: bpifrance_pmup_idf_guide_candidat_2024.pdf#p.5
  verified: llm_cited
- id: g3_max_intensity
  gate_family: G3_financial
  requirement: The maximum aid intensity is generally 50% of eligible expenditure, per the
    intervention regulation, with lower rates (10-20%) for standard material/immaterial investments
    outside bonus categories.
  value: Max intensity 50% (10-50% depending on category)
  intake_field: cofinancingBand
  quote: Le taux de prise en charge maximum est de 50% des dépenses éligibles, conformément
    au règlement d'intervention.
  source:
    file: bpifrance_pmup_idf_guide_candidat_2024.pdf
    locator: bpifrance_pmup_idf_iledefrance_page.html#chunk 2
  verified: llm_cited
- id: g3_aid_cumulation_cap
  gate_family: G3_financial
  requirement: Cumulation of public subsidies beyond 50% (or beyond 10%/20% for amortizable
    investments) of the total amount is not permitted on the same expenditure line.
  value: Cumulative public aid capped at 50% (10-20% for amortizable investments)
  intake_field: cofinancingBand
  quote: Le cumul de subventions publiques, au-delà de 50%, ou au- delà de 10% ou 20% pour
    les investissements amortissables du montant total, n’est pas possible
  source:
    file: bpifrance_pmup_idf_guide_candidat_2024.pdf
    locator: bpifrance_pmup_idf_guide_candidat_2024.pdf#p.22
  verified: false
  verify_note: 'fragment not found verbatim: ''Le cumul de subventions publiques, au-delà
