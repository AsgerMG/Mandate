cumulation:
  text: The guarantee follows either the exemption regulation (GBER, e.g., Article 17 aid
    for SME investments) or, if conditions are not met or upon beneficiary request, the de
    minimis regulation, with different obligations attached depending on which framework applies.
  quote: 'ai sensi del regolamento de minimis qualora ne sia fatta richiesta dal soggetto

    beneficiario finale, ovvero nei casi in cui non sia soddisfatta una o più delle condizioni

    stabilite dal regolamento di esenzione'
  source:
    file: fondo_di_garanzia_disposizioni_operative_2023.pdf
    locator: fondo_di_garanzia_disposizioni_operative_2023.pdf#p.22
  verified: llm_cited
application:
  channel: Online submission exclusively via the Portale FdG (Fund Guarantee Portal) by the
    requesting entity (bank/financial intermediary), with the Portale per le imprese used
    for SME data verification.
  typical_timeline: Admission/non-admission proposals are resolved by the Management Board
    within 2 months from the date of arrival or completion of the request; requesting entities
    must respond to information requests within 3 months.
  quote: 'Le proposte di ammissione ovvero di non ammissione sono deliberate dal Consiglio
    di

    gestione entro 2 mesi dalla data di arrivo o di completamento della richiesta.'
  source:
    file: fondo_di_garanzia_disposizioni_operative_2023.pdf
    locator: fondo_di_garanzia_disposizioni_operative_2023.pdf#p.31
  verified: llm_cited
