cumulation:
  text: Innovation Fund grants may be combined with funding from another EU programme directly
    managed by the Commission if the EU Synergies clause is enabled in both grant agreements
    and combined funding rates do not exceed 100%; combination with EU operating grants is
    also possible under conditions.
  quote: 'Innovation Fund grants may be combined with funding

    from another EU programme (directly managed by the EU Commission), if in both

    grants the EU Synergies actions’ clause is enabled in Article 6.3 of the Model Grant

    Agreement and the combined funding rates at grant level do not exceed 100%'
  source:
    file: innovfund_2024_battery_call_document.pdf
    locator: p.32
  verified: llm_cited
