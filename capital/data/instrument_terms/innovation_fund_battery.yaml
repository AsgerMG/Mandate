obligations:
- requirement: Beneficiaries must confirm compliance with EU funding conditions by signing
    a declaration of honour before grant signature.
  quote: 'Before signing the grant, each beneficiary and affiliated entity will have to confirm
    this

    again by signing a declaration of honour (DoH).'
  source:
    file: innovfund_2024_battery_call_document.pdf
    locator: p.11
  verified: llm_cited
- requirement: The maximum grant amount will only be paid out if the project reaches at least
    75% of the total planned GHG emission avoidance over the project duration.
  quote: 'the maximum grant amount will only be paid out, if over the entire project

    duration, the project reaches at least 75% of the total amount of GHG

    emission planned to be avoided.'
  source:
    file: innovfund_2024_battery_call_document.pdf
    locator: p.27
  verified: llm_cited
- requirement: Beneficiaries must submit a statement by an independent auditor confirming
