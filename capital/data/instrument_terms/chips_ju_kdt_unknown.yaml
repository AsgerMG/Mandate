cumulation:
  text: For undertakings, state aid with identifiable eligible costs may be cumulated with
    other State aid either on different eligible costs, or on the same/overlapping eligible
    costs only if the cumulation does not exceed the highest applicable aid intensity or aid
    amount.
  quote: 'Cumulation: In case of undertakings aid with identifiable eligible costs may be
    cumulated with:

    (a) any other State aid, as long as those measures concern different identifiable eligible

    costs,

    (b) any other State aid, in relation to the same eligible costs, partly or fully overlapping,

    only if such cumulation does not result in exceeding the highest aid intensity or aid
    amount

    as defined above.'
  source:
    file: chips_ju_kdt_work_programme_2021.pdf
    locator: chips_ju_kdt_work_programme_2021.pdf#p.92
  verified: llm_cited
application:
  channel: National applications are submitted to national funding authorities in parallel
    with the KDT JU proposal submission, following country-specific procedures (e.g. Italy
    MUR deadline, Austria eCall, Poland National Application Form, Germany National Grant
    table).
  typical_timeline: National application/eligibility documents (e.g. Part C) must be submitted
    at Project Outline and/or Full Project Proposal stage, with national grant agreements
    signed after KDT JU grant agreements are signed.
  quote: 'submitted to MUR by the same deadline of the KDT call. Any participant who does

    not send its national application by this deadline, will be considered ineligible.'
  source:
    file: chips_ju_kdt_work_programme_2021.pdf
    locator: chips_ju_kdt_work_programme_2021.pdf#p.102
  verified: llm_cited
