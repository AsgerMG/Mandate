- requirement: Spain (AEI) limits a Principal Investigator to submitting only one proposal
    across the KDT 2021 RIA and IA calls combined; multiple submissions render the PI ineligible
    in all but one.
  quote: 'Principal Investigators can only apply for funding in one proposal in KDT 2021

    calls RIA and IA all together. The limit is NOT one proposal per subprogram (RIA

    or IA), but one proposal in both RIA and IA. If one PI submits two or more

    proposals he/she will be declared ineligible in all but one.'
  source:
    file: chips_ju_kdt_work_programme_2021.pdf
    locator: chips_ju_kdt_work_programme_2021.pdf#p.127
  verified: llm_cited
- requirement: Czech applicants that seriously breached obligations towards the MEYS under
