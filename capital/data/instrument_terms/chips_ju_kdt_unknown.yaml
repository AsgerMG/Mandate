obligations:
- requirement: Applicants established in Horizon 2020 Associated Countries or negotiating
    association will be treated as entities established in an Associated Country for eligibility
    purposes, subject to the association agreement applying at grant signature.
  quote: 'applicants established in Horizon 2020

    Associated Countries or in other third countries negotiating association to Horizon Europe

    will be treated as entities established in an Associated Country, if the Horizon Europe

    association agreement with the third country concerned applies at the time of signature
    of

    the grant agreement.'
  source:
    file: chips_ju_kdt_work_programme_2021.pdf
    locator: chips_ju_kdt_work_programme_2021.pdf#p.37
  verified: llm_cited
- requirement: The EU contribution per project is capped at 12M€ under the general call conditions.
  quote: 'Capping: The EU contribution per project is capped at 12M€ and the maximum

    contribution per partner in a project is limited to 40% of the total EU funding for

    the project.'
  source:
    file: chips_ju_kdt_work_programme_2021.pdf
    locator: chips_ju_kdt_work_programme_2021.pdf#p.37
  verified: llm_cited
- requirement: Proposals that do not comply with the size and capping conditions will be excluded.
  quote: Proposals that do not comply to the above will be excluded.
  source:
    file: chips_ju_kdt_work_programme_2021.pdf
    locator: chips_ju_kdt_work_programme_2021.pdf#p.37
  verified: llm_cited
- requirement: Beneficiaries must submit declarations regarding company size and financial
