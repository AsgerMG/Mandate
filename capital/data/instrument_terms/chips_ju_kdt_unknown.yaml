- requirement: National funding is subject to reduction if required to respect state aid intensity
    limits when combined with other public funding.
  quote: 'National funding will be subject to conditions in current state aid rules (Commission

    Regulation (EU) No 651/2014). If other public funding, besides the EU funding, will be

    granted for the project, the listed maximum rates for national funding will be reduced
    if

    required to ensure that aid intensity limits in the state aid rules are respected.'
  source:
    file: chips_ju_kdt_work_programme_2021.pdf
    locator: chips_ju_kdt_work_programme_2021.pdf#p.113
  verified: llm_cited
- requirement: Spanish MINAETD will verify participants are not undertakings in difficulty/crisis
