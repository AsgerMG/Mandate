  gate_role: filter
- id: g1-basic-funded-institutions
  gate_family: G1_nexus
  requirement: Research institutions that receive core funding from the Federal Government and/or the
    Länder can only be granted project funding for their additional project-related expenses under certain
    conditions.
  value: 'Core-funded research institutions: conditional add-on project funding only'
  intake_field: institutionalBacking
  quote: Forschungseinrichtungen, die von Bund und/oder Ländern grundfinanziert werden, können neben ihrer
    institutionellen Förderung nur unter bestimmten Voraussetzungen eine Projektförderung für ihre zusätzlichen
    projektbedingten Ausgaben beziehungsweise Kosten bewilligt bekommen.
  source:
    file: https://www.quantentechnologien.de/forschung/foerderung/quantencomputer-demonstrationsaufbauten
    locator: eligibility_text
  verified: llm_cited
  gate_role: filter
- id: g5-risk-profile
  gate_family: G5_use_of_funds
  requirement: Funded are pre-competitive R&D projects characterised by high scientific-technical risk.
  value: Pre-competitive R&D, high scientific-technical risk
  intake_field: developmentStage
  quote: Gefördert werden vorwettbewerbliche Forschungs- und Entwicklungsvorhaben, die gekennzeichnet
