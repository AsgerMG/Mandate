- id: g1-germany-establishment
  gate_family: G1_nexus
  requirement: At the time the grant is paid, the recipient must have an establishment or branch (for
    enterprises) or another facility serving the recipient's activity (for universities/research institutions)
    in Germany.
  value: Establishment/facility in Germany required at payout
  intake_field: entityCountries
  quote: Zum Zeitpunkt der Auszahlung einer gewährten Zuwendung wird das Vorhandensein einer Betriebsstätte
