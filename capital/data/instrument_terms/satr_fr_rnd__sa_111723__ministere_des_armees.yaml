id: satr_fr_rnd__sa_111723__ministere_des_armees
name: Régime cadre exempté de notification relatif aux aides à la recherche, au développement et à l’innovation
  (RDI) pour la période 2024-2026
administering_body: see source document
country: FR
capital_type: unknown
status: draft
gates:
- id: g1-beneficiary-any-size
  gate_family: G1_nexus
  requirement: Any beneficiary qualifying as an enterprise and meeting the definition of a testing and
    experimentation infrastructure may receive investment aid, regardless of size.
  value: Enterprise operating a testing/experimentation infrastructure, any size
  intake_field: borrowerModel
  quote: Tout porteur pouvant être qualifié d’entreprise et répondant à la définition d’infrastructure
    d’essai et d’expérimentation figurant en annexe I du présent régime d’aides, quelle que soit sa taille,
    peut bénéficier d’aides à l’investissement en faveur des infrastructures d’essai et d’expérimentation
  source:
    file: https://www.europe-en-france.gouv.fr/fr/aides-d-etat/regimes-d-aide/sa111723-regime-cadre-exempte-notification-ndeg-sa-111723-relatif-aides
    locator: eligibility_text
  verified: llm_cited
  gate_role: filter
- id: g1-recovery-order-exclusion
  gate_family: G1_nexus
  requirement: Aid is excluded for a company subject to an unexecuted recovery order from a prior Commission
    decision declaring aid granted by France unlawful and incompatible with the internal market.
  value: Excluded if subject to unexecuted EU recovery order
  intake_field: none
  quote: aux aides en faveur d’une entreprise faisant l’objet d’une injonction de récupération non exécutée,
    émise dans une décision antérieure de la Commission déclarant une aide octroyée par la France illégale
    et incompatible avec le marché intérieur
  source:
    file: https://www.europe-en-france.gouv.fr/fr/aides-d-etat/regimes-d-aide/sa111723-regime-cadre-exempte-notification-ndeg-sa-111723-relatif-aides
    locator: eligibility_text
  verified: llm_cited
  gate_role: filter
- id: g3-difficulty-exclusion
  gate_family: G3_financial
  requirement: Aid is excluded for companies in difficulty, as defined by specified criteria.
  value: Undertakings in difficulty excluded
  intake_field: lossesOverHalfCapital
  quote: aux aides aux entreprises en difficulté, lorsque les entreprises répondent à l’un des critères
    suivants
  source:
    file: https://www.europe-en-france.gouv.fr/fr/aides-d-etat/regimes-d-aide/sa111723-regime-cadre-exempte-notification-ndeg-sa-111723-relatif-aides
    locator: eligibility_text
  verified: llm_cited
  gate_role: filter
- id: g1-fisheries-exclusion
  gate_family: G1_nexus
  requirement: Aid granted in the fisheries and aquaculture sector is excluded from this regime, except
    for R&D aid and innovation aid for SMEs.
  value: Fisheries/aquaculture sector excluded (except SME R&D/innovation aid)
  intake_field: none
  quote: aux aides octroyées dans le secteur de la pêche et de l’aquaculture, lequel relève du règlement
    (UE) n° 1379/2013 du Parlement européen et du Conseil, exception faite des aides à la recherche et
    développement et des aides à l’innovation en faveur des PME
  source:
    file: https://www.europe-en-france.gouv.fr/fr/aides-d-etat/regimes-d-aide/sa111723-regime-cadre-exempte-notification-ndeg-sa-111723-relatif-aides
    locator: eligibility_text
  verified: llm_cited
  gate_role: filter
- id: g2-beneficiary-size
  gate_family: G2_size_ownership
  requirement: Beneficiaries listed on the scheme portal are large enterprises and SMEs.
  value: 'Beneficiaries: large enterprises and SMEs'
  intake_field: turnoverBand
  quote: 'Bénéficiaires (fiche portail) : Grandes entreprises ; PME.'
  source:
