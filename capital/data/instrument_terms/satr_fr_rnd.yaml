cumulation:
  text: Aid under the scheme may be cumulated with other State aid on different identifiable
    eligible costs without restriction; where cumulated on the same (fully or partially overlapping)
    eligible costs, cumulation is permitted only up to the highest applicable aid intensity
    or amount under GBER; disability-related aid may push cumulation up to 100% of relevant
    costs; centrally-managed EU funding not controlled by Member States does not count as
    State aid but total public funding for the same costs must not exceed the most favourable
    EU-law financing rate.
  quote: 'Les aides aux coûts admissibles identifiables octroyées sur la base du présent régime
    peuvent être cumulées avec : a) toute autre aide d’Etat, dès lors qu’elle porte sur des
    coûts admissibles identifiables différents ; b) toute autre aide d’Etat portant sur les
    mêmes coûts admissibles se chevauchant en partie ou totalement, uniquement dans les cas
    où ce cumul ne conduit pas à un dépassement de l’intensité ou du montant d’aide les plus
    élevés applicables à ces aides en vertu du règlement général d’exemption par catégorie'
  source:
    file: satr_fr_rnd_sa111723_regime_cadre_2024_2026.pdf
    locator: satr_fr_rnd_sa111723_regime_cadre_2024_2026.pdf#p.22
  verified: llm_cited
application:
