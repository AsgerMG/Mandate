    block exemption framework scheme; no centralized single application portal is specified
    in the text.
  typical_timeline: Individual aid records must be published within six months of the grant
    decision; Commission notification required if thresholds exceeded, subject to standard
    State aid notification procedures.
  quote: Ces informations sont publiées dans les six mois suivant la date à laquelle l’aide
    a été octroyée ou, pour les aides sous forme d’avantages fiscaux, dans l’année qui suit
    la date à laquelle la déclaration fiscale doit être introduite
  source:
    file: satr_fr_rnd_sa111723_regime_cadre_2024_2026.pdf
    locator: satr_fr_rnd_sa58995_regime_cadre_2014_2023.pdf#p.18
  verified: llm_cited
