id: satr_de_rnd__sa_112919__bundesamt_fur_wirtschaft_und_ausfuhrkontrolle
name: Richtlinie für die Bundesförderung für Energie- und Ressourceneffizienz in der Wirtschaft – Zuschuss
  und Kredit [BMWK, IIA6]
administering_body: see source document
country: DE
capital_type: unknown
status: draft
gates:
- id: g1-eligible-establishment
  gate_family: G1_nexus
  requirement: Applicants must have an establishment in Germany; eligible types are private, municipal
    and state (Land) companies, freelancers (if the establishment is predominantly used for the freelance
    activity), and contractors.
  value: Must have German establishment; private/municipal/Land companies, freelancers, contractors
  intake_field: entityCountries
  quote: 'Antragsberechtigt mit einer Betriebsstätte oder Niederlassung in Deutschland sind:

    - private Unternehmen,

    - kommunale Unternehmen,

    - Landesunternehmen,

    - freiberuflich Tätige, wenn die Betriebsstätte überwiegend für die freiberufliche Tätigkeit genutzt
    wird,

    - Contractoren, die in dieser Förderrichtlinie genannte Maßnahmen für ein antragsberechtigtes Unternehmen
    durchführen.'
  source:
    file: https://www.bafa.de/DE/Energie/Energieeffizienz/Energieeffizienz_und_Prozesswaerme/energieeffizienz_und_prozesswaerme_node.html
    locator: eligibility_text
  verified: llm_cited
  gate_role: filter
