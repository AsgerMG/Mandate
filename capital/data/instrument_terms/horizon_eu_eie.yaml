id: horizon_eu_eie
name: horizon_eu_eie
administering_body: see source document
country: ''
capital_type: unknown
status: draft
gates:
- id: g1-country-eligibility
  gate_family: G1_nexus
  requirement: Applicants must be established in an eligible country (EU Member States including
    outermost regions, Associated Countries, or listed low/middle-income third countries)
    to be eligible for funding.
  value: EU Member States, Associated Countries, and listed low/middle-income third countries
  intake_field: entityCountries
  quote: 'To be eligible for funding, applicants must be established in one of the following
    countries:'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russia-belarus-exclusion
  gate_family: G1_nexus
  requirement: Legal entities established in Russia, Belarus, or non-government controlled
    territories of Ukraine are not eligible to participate in any capacity.
  value: 'Excluded: Russia, Belarus, non-government controlled Ukraine territories'
  intake_field: entityCountries
  quote: 'such legal entities are not eligible to participate in any capacity. This

    includes participation as beneficiaries, affiliated entities, associated partners, third
    parties

    giving in-kind contributions, subcontractors or recipients of financial support to third
    parties (if

    any)'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russia-ownership-exclusion
  gate_family: G1_nexus
  requirement: Legal entities established outside Russia but more than 50% owned by a Russia-established
    person/entity are not eligible to participate in any capacity.
  value: 'Excluded: >50% Russian-owned entities'
  intake_field: nonEuControl
  quote: 'legal entities established outside Russia whose

    proprietary rights are directly or indirectly owned for more than 50% by a legal person,
    entity

    or body established in Russia are also not eligible to participate in any capacity.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-hungary-restriction
  gate_family: G1_nexus
  requirement: Hungarian public interest trusts established under Hungarian Act IX of 2021
    (or entities they maintain) are not eligible to participate in any funded role.
  value: 'Excluded: Hungarian public interest trusts under Act IX/2021'
  intake_field: entityCountries
  quote: 'such entities are not eligible to participate in any funded role

    (beneficiaries, affiliated entities, subcontractors, recipients of financial support to
    third parties,

    etc.).'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-china-restriction-ia-ria
  gate_family: G1_nexus
  requirement: Legal entities established in China are not eligible to participate in any
    capacity in IA and RIA actions (with case-by-case exceptions).
  value: 'Excluded: China-established entities in IA/RIA actions'
  intake_field: entityCountries
  quote: 'this includes participation of legal entities established in

    China in any capacity (as beneficiaries, affiliated entities, associated partners, third
    parties

    giving in-kind contributions, subcontractors or recipients of financial support to third
    parties (if

    any)).'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-miit-universities
  gate_family: G1_nexus
  requirement: Chinese universities administered by or under supervision of the Ministry of
    Industry and Information Technology (MIIT) are not eligible to participate in any action.
  value: 'Excluded: MIIT-supervised Chinese universities'
  intake_field: entityCountries
  quote: 'universities (higher

    education establishments) established in China which are public bodies, that are administered

    by or fall under the supervision of the Ministry of Industry and Information Technology
    (MIIT)

    are not eligible to participate in any action under all parts of this Work Programme.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-high-risk-5g-suppliers
  gate_family: G1_nexus
  requirement: Entities assessed as high-risk suppliers of mobile network communication equipment
    (and entities they own or control) are not eligible to participate in restricted 5G/communication
    network actions in any funded role.
  value: 'Excluded: high-risk 5G equipment suppliers'
  intake_field: nonEuControl
  quote: 'Entities that are assessed as high-risk suppliers of mobile network communication
    equipment

    (and any entities they own or control) are not eligible to participate as beneficiaries,
    affiliated

    entities and associated partners.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.9
  verified: llm_cited
- id: g1-consortium-composition
  gate_family: G1_nexus
  requirement: Applications (unless call conditions state otherwise) must form a consortium
    of at least three independent legal entities established in three different countries,
    including at least one in a Member State and two others each in different Member States
    or Associated Countries.
  value: Minimum 3 independent entities in 3 different countries (min. 1 MS + 2 others in
    different MS/AC)
  intake_field: consortium
  quote: 'at least one independent legal entity established in a Member State; and

    − at least two other independent legal entities, each established in different Member
    States

    or Associated Countries.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g1-civil-applications-only
  gate_family: G1_nexus
  requirement: Projects must focus exclusively on civil applications and must not pursue human
    cloning, heritable genetic modification, or embryo creation solely for research/stem cell
    procurement.
  value: Civil applications only; specific bioethics exclusions apply
  intake_field: none
  quote: 'Projects must focus exclusively on civil applications and must not:

    – aim at human cloning for reproductive purposes;'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g1-restriction-strategic-assets
  gate_family: G1_nexus
  requirement: For actions related to EU strategic assets, interests, autonomy or security,
    specific call conditions may limit participation to legal entities established only in
    EU Member States (or MS plus specified associated/third countries) and may exclude entities
    controlled by non-eligible third countries.
  value: Restricted participation for strategic autonomy/security actions
  intake_field: nonEuControl
  quote: 'the

    specific call/topic conditions may limit participation to legal entities established only
    in EU

    Member States or in EU Member States and specific associated or non-associated third

    countries.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.9
  verified: llm_cited
- id: g2-operational-capacity
  gate_family: G2_size_ownership
  requirement: Applicants must have the know-how, qualifications and resources (operational
    capacity) to successfully implement their project tasks, assessed via the 'Quality and
    efficiency of the implementation' award criterion.
  value: Operational capacity assessed by evaluation score threshold
  intake_field: none
  quote: 'Applicants must have the know-how, qualifications and resources to successfully
    implement

    their tasks in the project and contribute their share (including, when appropriate, sufficient

    experience in EU/transnational projects of comparable size).'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.22
  verified: llm_cited
- id: g2-exclusion-situations
  gate_family: G2_size_ownership
  requirement: Applicants subject to EU administrative sanctions or in exclusion situations
    (e.g. bankruptcy, winding up, court-administered affairs) cannot participate.
  value: 'Excluded: entities under EU administrative sanctions or in bankruptcy/insolvency
    situations'
  intake_field: none
  quote: 'bankruptcy, winding up, affairs administered by the courts, arrangement with creditors,

    suspended business activities or other similar procedures (including procedures for

    persons with unlimited liability for the applicant’s debts);'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.22
  verified: llm_cited
- id: g4-grant-instrument
  gate_family: G4_borrower_model
  requirement: Funding is provided as EU grants (including lump sum grants), not loans or
    equity, under the standard Horizon Europe grant agreement mechanics.
  value: Grant instrument (incl. lump sum grants)
  intake_field: borrowerModel
  quote: 'For lump sum grant proposals, the estimated budget must be described in a detailed
    budget

    table. This will be used as a basis for justifying and/or fixing the lump sum amount.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.28
  verified: llm_cited
- id: g5-eligible-activities-scope
  gate_family: G5_use_of_funds
  requirement: Eligible activities are those described in the specific call/topic conditions;
    applications will only be considered eligible if their content corresponds to the topic
    description.
  value: Activities must correspond to call topic description
  intake_field: developmentStage
  quote: 'Eligible activities are the ones described in the call conditions. Applications
    will only be

    considered eligible if their content corresponds, wholly or in part, to the topic description
    for

    which it is submitted.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g5-no-profit-rule
  gate_family: G5_use_of_funds
  requirement: Grants may not generate a profit (surplus of revenues plus EU grant over costs),
    checked at project end.
  value: No-profit rule applies to grant funding
  intake_field: none
  quote: 'Grants may NOT give a profit (i.e. surplus of revenues + EU grant over costs). This
    will

    be checked by the granting authority at the end of the project.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
- id: g6-no-double-funding
  gate_family: G6_conditionality
  requirement: Any given action may receive only one grant from the EU budget (except EU Synergy
    grants) and the same costs may never be declared to two different EU actions.
  value: Strict prohibition of double funding
  intake_field: cofinancingBand
  quote: 'There is strict prohibition of double funding from the EU budget. Any given action

    may receive only ONE grant from the EU budget (except for EU Synergy grants) and same
    costs

    may under NO circumstances be declared to two different EU actions.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
- id: g6-completed-projects
  gate_family: G6_conditionality
  requirement: Applications for projects that have already been completed will be rejected;
    applications for already-started projects are assessed case-by-case, with costs before
    submission normally not reimbursable.
  value: Completed projects ineligible; started projects assessed case-by-case
  intake_field: developmentStage
  quote: 'Applications for projects that have already been completed will be rejected. Applications
    for

    projects that have already started will be assessed on a case-by-case basis'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.37
  verified: llm_cited
obligations:
- requirement: Beneficiaries must ensure gender equality plans are in place for public bodies,
    research organisations and higher education establishments applying as beneficiaries or
    affiliated entities.
  quote: 'legal entities from Member States and Associated Countries that are

    public bodies, research organisations or higher education establishments (including private

    research organisations and private higher education establishments) applying as beneficiaries

    or affiliated entities must have at the moment of grant signature and during the duration
    of the

    grant a gender equality plan'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.18
  verified: llm_cited
- requirement: Applicants must include a plan for exploitation and dissemination of results
    including communication activities.
  quote: 'Applications must include a plan for the exploitation and dissemination of results
    including

    communication activities, unless provided otherwise in the specific call/topic conditions.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.4
  verified: llm_cited
- requirement: Applicants must complete an ethics self-assessment as part of their application
    and comply with ethical principles.
  quote: Applicants must have completed the ethics self-assessment as part of their application.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.16
  verified: llm_cited
- requirement: Beneficiaries must take all measures to promote equal opportunities between
    men and women in implementing the action.
  quote: 'Beneficiaries must take all measures to promote equal opportunities between men
    and women

    in implementing the action and, where applicable, in line with their gender equality plan.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.18
  verified: llm_cited
- requirement: Beneficiaries must ensure their projects are not subject to national/third-country
    security requirements that could affect implementation and must notify any security issues
    immediately.
  quote: 'beneficiaries must ensure that their projects are not subject to national/third-

    country security requirements that could affect implementation or put into question the
    award

    of the grants (e.g. technology restrictions, national security classification, etc.).
    Any potential

    security issues must be notified immediately to the granting authority.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.18
  verified: llm_cited
- requirement: Where financial support to third parties is allowed, projects must publish
    open calls widely, keep calls open at least 2 months, and publish outcomes without delay.
  quote: the calls must remain open for at least 2 months;
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.19
  verified: llm_cited
- requirement: Participants must conclude a written consortium agreement unless otherwise
    provided in specific call conditions.
  quote: 'participants must conclude a written consortium agreement to ensure the smooth and

    successful implementation of the action and to deal with exceptional or unforeseen

    circumstances, unless otherwise provided for in the specific call conditions.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.37
  verified: llm_cited
