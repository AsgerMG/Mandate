- id: G3-3
  gate_family: G3_financial
  requirement: The maximum loan amount for one business operator and its group of related
    persons is up to EUR 1,500,000.
  value: EUR 1,500,000 maximum per borrower/group
  intake_field: ticketBand
  quote: Maksimālā aizdevumu summa vienam saimnieciskās darbības veicējam un ar to saistīto
    personu grupai ir līdz 1 500 000 euro
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §9
  verified: llm_cited
- id: G3-4
  gate_family: G3_financial
  requirement: Where a loan is granted under §5.1 (per European Commission decision), the
    maximum loan amount may not exceed double the operator's 2019 (or last available year)
    wage costs including social charges, or the projected two-year wage costs for companies
    founded after 1 January 2019.
  value: 'Cap: 2x annual wage costs (or projected for new companies)'
  intake_field: foundedYear
  quote: divkāršus saimnieciskās darbības veicēja izdevumus par atalgojumu (ieskaitot sociālās
    izmaksas) 2019. gadā vai pēdējā pieejamā gadā par atalgojumu (ieskaitot sociālās izmaksas).
    Uzņēmumiem, kuri izveidoti pēc 2019. gada 1. janvāra, maksimālais aizdevums nedrīkst pārsniegt
    paredzamo gada atalgojuma apmēru pirmajos divos darbības gados
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §9.1
  verified: llm_cited
- id: G3-5
  gate_family: G3_financial
  requirement: Alternatively the loan cap under §5.1 may be set as 25% of the operator's total
    2019 turnover.
  value: 'Cap: 25% of 2019 turnover'
  intake_field: turnoverBand
  quote: 25 % no saimnieciskās darbības veicēja kopējā apgrozījuma 2019. gadā
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §9.2
  verified: llm_cited
- id: G3-6
  gate_family: G3_financial
  requirement: Alternatively the loan cap under §5.1 may be based on the calculated liquidity
