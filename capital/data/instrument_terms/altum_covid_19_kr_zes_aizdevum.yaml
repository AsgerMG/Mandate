    34. punktā noteiktajai definīcijai
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 1, §3.2
  verified: llm_cited
- id: G2-3
  gate_family: G2_size_ownership
  requirement: Related persons are defined as business operators meeting the linked-enterprise
    definition under Commission Regulation No 651/2014 Annex I Article 3(3) or Commission
    Regulation No 2022/2472 Annex I Article 3(3), relevant for aggregating the maximum loan
