    Komisijas regula Nr.  651/2014 ), 1. pielikumā noteiktajai definīcijai
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 1, §3.1
  verified: llm_cited
- id: G2-2
  gate_family: G2_size_ownership
  requirement: Large business operators are also eligible if they are legal persons meeting
