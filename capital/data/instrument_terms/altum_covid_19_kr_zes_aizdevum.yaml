  value: 'Cap: calculated liquidity needs (18 or 12 months)'
  intake_field: turnoverBand
  quote: pamatojoties uz tam aprēķināto nepieciešamo likviditātes vajadzības apjomu turpmākajiem
    18 mēnešiem sīkajam (mikro), mazajam un vidējam saimnieciskās darbības veicējam un 12
    mēnešiem – lielajam saimnieciskās darbības veicējam
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §9.3
  verified: llm_cited
- id: G4-1
  gate_family: G4_borrower_model
  requirement: The instrument is a working capital loan (not a grant or equity investment),
    repayable within a maximum term of four years, taking into account the operator's business
    and working capital cycle.
  value: Working capital loan, max 4-year term
  intake_field: borrowerModel
  quote: Aizdevuma atmaksas termiņš nepārsniedz četrus gadus, ievērojot saimnieciskās darbības
    veicēja darbības un apgrozāmo līdzekļu aprites ciklu.
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §10
  verified: llm_cited
- id: G4-2
  gate_family: G4_borrower_model
  requirement: Repayment of the loan principal can be deferred for a period of up to 24 months.
  value: Grace period up to 24 months
  intake_field: borrowerModel
  quote: Aizdevuma atmaksas uzsākšanu var atlikt par termiņu līdz 24 mēnešiem.
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §11
  verified: llm_cited
- id: G4-3
  gate_family: G4_borrower_model
  requirement: For loans issued under §5.1, the interest rate is determined taking into account
    the conditions specified in the annex to these regulations (credit risk margins varying
    by enterprise size and term).
  value: Risk-based interest margin pricing (25-200 basis points by size/term)
  intake_field: none
  quote: Atbilstoši šo noteikumu 5.1. apakšpunktam izsniegtajiem aizdevumiem procentu likmi
    nosaka, ņemot vērā šo noteikumu pielikumā minētos nosacījumus.
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §12
  verified: llm_cited
- id: G4-4
  gate_family: G4_borrower_model
  requirement: If the borrower cannot meet its loan obligations but cash flow or a business
    development plan demonstrates future ability to repay, Altum may restructure the loan,
    extending the term up to six years and altering the payment schedule and structure.
  value: 'Restructuring option: term extension to 6 years'
  intake_field: borrowerModel
  quote: sabiedrība "Altum" restrukturizē aizdevumu, pagarinot šo noteikumu  10. punktā  minēto
    termiņu līdz sešiem gadiem, kā arī maina maksājumu kārtību (apmēru) un struktūru (periodiskumu)
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §17
  verified: llm_cited
- id: G5-1
  gate_family: G5_use_of_funds
  requirement: Loan funds must be used to finance working capital of Covid-19 negatively affected
    business operators, needed to mitigate the negative impact of Covid-19 spread on business
    or financial condition.
  value: 'Use of funds: working capital financing to mitigate Covid-19 impact'
  intake_field: borrowerModel
  quote: apgrozāmo līdzekļu aizdevums ir nepieciešams, lai mazinātu Covid-19 izplatības seku
    negatīvo ietekmi uz tā saimniecisko darbību vai finanšu stāvokli
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 1-2, §8
  verified: llm_cited
- id: G5-2
  gate_family: G5_use_of_funds
  requirement: Support is not granted for weapons and ammunition trade, tobacco production/trade,
    alcohol trade, gambling and betting, financial and insurance activities, real estate operations,
    residential real estate development, freight vehicle purchases for road transport carriers,
    or refinancing of other loans.
  value: Excluded sectors/activities list
  intake_field: none
  quote: ieroču un munīcijas tirdzniecībai (NACE 2. redakcijas grupa 47.78 "Citur neklasificēta
    jaunu preču mazumtirdzniecība specializētajos veikalos")
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §18.4
  verified: llm_cited
- id: G5-3
  gate_family: G5_use_of_funds
  requirement: Funds may not be used to refinance other loans.
  value: No refinancing of other loans
  intake_field: none
  quote: citu aizdevumu refinansēšanai
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §18.12
  verified: llm_cited
- id: G6-1
  gate_family: G6_conditionality
  requirement: Loans and loan extensions are provided either per a European Commission decision
