    No 1408/2013, or No 717/2014 thereafter or where conditions of the Commission decision
    are not met.
  value: 'Dual legal basis: EC decision or de minimis regulations'
  intake_field: conditionality
  quote: kā de minimis atbalstu pēc Eiropas Komisijas lēmumā noteiktā spēkā esamības termiņa
    beigām vai gadījumos, kad piešķirtais aizdevums neatbilst Eiropas Komisijas lēmuma nosacījumiem
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 1, §5.2
  verified: llm_cited
- id: G6-2
  gate_family: G6_conditionality
  requirement: To receive a loan, the business operator must submit a loan application and
    other information specified on Altum's website.
  value: Application submission requirement
  intake_field: none
  quote: Lai saņemtu aizdevumu, saimnieciskās darbības veicēji iesniedz sabiedrībā "Altum"
    aizdevuma pieteikumu un citu sabiedrības "Altum" tīmekļvietnē norādīto informāciju.
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §15
  verified: llm_cited
- id: G6-3
  gate_family: G6_conditionality
  requirement: Altum grants the loan only for activities it has assessed as economically viable,
    evaluating sustainability, required funding amount, collateral, financial situation, knowledge/experience,
    and business risks.
  value: Economic viability assessment required
  intake_field: conditionality
  quote: finansējot tikai tādas darbības, kuras sabiedrība "Altum" ir atzinusi par ekonomiski
    dzīvotspējīgām, tai skaitā izvērtējot saimnieciskās darbības veicēja ilgtspēju, nepieciešamo
    finansējuma apjomu, nodrošinājumu, saimnieciskās darbības veicēja esošo un nākotnes finanšu
    situāciju, zināšanu un pieredzes atbilstību, kā arī analizējot uzņēmējdarbības riskus
    un citus faktorus
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §16
  verified: llm_cited
obligations:
- requirement: The business operator must be assessed by Altum as economically viable considering
    business potential and sustainability, collateral and its liquidity, current and future
    financial situation, knowledge and experience, business risks and other factors, before
    a loan is granted.
  quote: ja saimnieciskās darbības veicējs ir ekonomiski dzīvotspējīgs, vērtējot saimnieciskās
    darbības potenciālu un ilgtspēju, nodrošinājumu un tā likviditāti, saimnieciskās darbības
    veicēja esošo un nākotnes finanšu situāciju, zināšanas un pieredzi, uzņēmējdarbības riskus
    un citus faktorus
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 1-2, §8
  verified: llm_cited
- requirement: The business operator can receive multiple loans provided the total outstanding
    balance of all loans, including the new one, does not exceed the maximum aggregate loan
    amount.
  quote: Saimnieciskās darbības veicējs var saņemt vairākus aizdevumus, ja aizdevuma piešķiršanas
    brīdī piešķiramā un iepriekš saņemto aizdevumu neatmaksātā kopsumma nepārsniedz šajā punktā
    noteikto maksimālo aizdevumu summu.
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §9
  verified: llm_cited
