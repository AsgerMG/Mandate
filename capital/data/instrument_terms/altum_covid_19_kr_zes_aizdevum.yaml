  value: Micro/small/medium enterprises per EU SME definition
  intake_field: fteBand
  quote: sīkie (mikro), mazie un vidējie saimnieciskās darbības veicēji, kuri atbilst Komisijas
    2014. gada 17. jūnija Regulas (ES) Nr.  651/2014 , ar ko noteiktas atbalsta kategorijas
