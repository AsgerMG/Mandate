  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 1, §6
  verified: llm_cited
- id: G3-2
  gate_family: G3_financial
  requirement: Altum attracts a state loan of up to EUR 150,000,000 in the form of a credit
