  value: Covid-19 negatively affected business operators
  intake_field: borrowerModel
  quote: Aizdevumi paredzēti Covid-19 izplatības seku negatīvi ietekmēto saimnieciskās darbības
    veicēju apgrozāmo līdzekļu finansēšanai
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 1-2, §8
  verified: llm_cited
- id: G2-1
  gate_family: G2_size_ownership
  requirement: Eligible support recipients are micro, small and medium-sized business operators
