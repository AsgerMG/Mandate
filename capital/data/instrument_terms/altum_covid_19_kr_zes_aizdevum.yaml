cumulation:
  text: Where a business operator receiving a loan under Commission Regulation No 2023/2831,
    No 1408/2013 or No 717/2014 simultaneously operates in both supported and excluded sectors
    or performs non-supportable activities under the respective regulation, specific rules
    apply on how the aid is to be treated per sector/activity.
  quote: Ja saimnieciskās darbības veicējs, kuram aizdevumu piešķir saskaņā ar Komisijas regulu
    Nr. 2023/2831 , Komisijas regulu Nr. 1408/2013 vai Komisijas regulu Nr. 717/2014 , vienlaikus
    darbojas vienā vai vairākās atbalstāmajās nozarēs, gan izslēgtajās nozarēs vai veic neatbalstāmas
    darbības saskaņā ar attiecīgo regulu
  source:
    file: altum_covid_19_kr_zes_aizdevum_mk_noteikumi_313370.html
    locator: chunk 2, §19
  verified: llm_cited
