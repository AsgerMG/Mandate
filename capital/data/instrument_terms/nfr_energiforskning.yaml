- id: g2
  gate_family: G1_nexus
  requirement: The project-responsible entity must be a private company or a public enterprise
    engaged in industrial or commercial activity; sole proprietorships cannot be project-responsible.
  value: Private bedrift eller offentlig foretak av industriell/forretningsmessig karakter;
    enkeltpersonforetak ikke tillatt som prosjektansvarlig
  intake_field: borrowerModel
  quote: Dette innebærer at prosjektansvarlig enten må være en privat bedrift, eller et offentlig
    foretak som driver virksomhet av industriell eller forretningsmessig karakter. I resten
    av utlysningen bruker vi fellesbetegnelsen "bedrift". Enkeltpersonforetak kan ikke være
    prosjektansvarlige, men de kan være samarbeidspartnere.
  source:
