    locator: '#chunk 3'
  verified: llm_cited
- id: g3
  gate_family: G1_nexus
  requirement: The project-responsible party must carry out the project together with at least
    one collaborating partner (Norwegian company) or purchase contract research from at least
    one R&D provider.
  value: At least one Norwegian collaborating partner or R&D provider required
  intake_field: consortium
  quote: Vi krever at prosjektansvarlig gjennomfører prosjektet sammen med minst én samarbeidspartner
    (norsk bedrift) eller kjøper inn oppdragsforskning fra minst én FoU-leverandør.
  source:
