obligations:
- requirement: All partners must have clearly defined tasks and roles in project implementation,
    and must participate as described in the application.
  quote: Alle partnerne skal ha definerte oppgaver og en tydelig rolle i gjennomføringen av
    prosjektet.
  source:
    file: nfr_energiforskning_innovasjonsprosjekt_energi_transport_2026.html
    locator: '#chunk 3'
  verified: llm_cited
- requirement: It is a condition of support that collaborating partners and R&D providers
    actually participate in the project as described in the application; changing the project
    composition before receiving the grant letter can lead to withdrawal of the award.
  quote: Det er en betingelse for å få støtte at samarbeidspartnerne og FoU-leverandørene
    kommer til å delta i prosjektet slik som beskrevet i søknaden. Dersom dere endrer prosjektsammensetningen
    før dere får tilskuddsbrev fra oss, kan vi trekke tilbake tilsagnet om finansiering.
  source:
    file: nfr_energiforskning_innovasjonsprosjekt_energi_transport_2026.html
    locator: '#chunk 3'
  verified: llm_cited
- requirement: Collaborating partners must engage in genuine collaboration with the project-responsible
    party, sharing both risk and results of the project.
  quote: Samarbeidspartnere skal inngå i faktisk samarbeid med prosjektansvarlig, noe som
    blant annet innebærer at de deler både risikoen og resultatene som kommer ut av prosjektet.
  source:
    file: nfr_energiforskning_innovasjonsprosjekt_energi_transport_2026.html
    locator: '#chunk 3'
  verified: llm_cited
- requirement: R&D providers shall not contribute to financing the project and are paid at
    market price for commissioned work; if they are to share in rights to project results,
    the price must be adjusted accordingly.
  quote: FoU-leverandører skal ikke bidra til å finansiere prosjektet, og har derfor vanligvis
    ikke rettigheter til prosjektresultatene. De leverer et arbeid på oppdrag, og får betalt
    for dette arbeidet til markedspris.
  source:
    file: nfr_energiforskning_innovasjonsprosjekt_energi_transport_2026.html
    locator: '#chunk 3'
  verified: llm_cited
- requirement: Applicants must bear all costs arising between application submission and receipt
    of the grant letter.
  quote: Dere må selv dekke alle kostnader som måtte oppstår fra dere sender inn søknaden
    til dere får tildelingsbrevet fra oss.
  source:
    file: nfr_energiforskning_innovasjonsprosjekt_energi_transport_2026.html
    locator: '#chunk 5'
  verified: false
  verify_note: 'fragment not found verbatim: ''Dere må selv dekke alle kostnader som måtte
    oppstå'''
- requirement: If awarded state aid of EUR 100,000 or more, this will be published in the
    public aid register.
  quote: Får dere statsstøtte fra oss som tilsvarer 100 000 euro eller mer, vil vi gjøre det
    kjent i Registeret for offentlig støtte (lenken åpnes i nytt vindu).
  source:
    file: nfr_energiforskning_innovasjonsprosjekt_energi_transport_2026.html
    locator: '#chunk 5'
  verified: llm_cited
- requirement: The project leader and project-responsible party must have assessed and addressed
    research security considerations in the project.
  quote: Prosjektleder og prosjektansvarlig skal ha vurdert og håndtert hensynet til forskningssikkerhet
    i prosjektet.
  source:
    file: nfr_energiforskning_innovasjonsprosjekt_energi_transport_2026.html
    locator: '#chunk 5'
  verified: llm_cited
- requirement: Full and immediate open access is required for scientific articles resulting
    from the project.
  quote: Forskningsrådet stiller krav om full og umiddelbar åpen tilgang (open access) for
    vitenskapelige artikler, se Plan S - åpen tilgang til publikasjoner .
  source:
    file: nfr_energiforskning_innovasjonsprosjekt_energi_transport_2026.html
    locator: '#chunk 5'
  verified: llm_cited
- requirement: Projects handling data must prepare a data management plan in connection with
    the revised application.
  quote: For alle prosjekter som håndterer data, skal prosjektansvarlig utarbeide en datahåndteringsplan
    i forbindelse med revidert søknad.
  source:
    file: nfr_energiforskning_innovasjonsprosjekt_energi_transport_2026.html
    locator: '#chunk 5'
  verified: llm_cited
