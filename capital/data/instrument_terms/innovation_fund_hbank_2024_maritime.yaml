obligations:
- requirement: Financial close must be reached within 2.5 years after grant signature, or
    the grant may be terminated and the completion guarantee called.
  quote: 'Please be aware that financial close must be reached within 2.5 years after grant

    signature (required as deliverable for WP 1; see above). If this is not achieved within

    the required time-limit, we may terminate the grant agreement and call the completion

    guarantee (see art 32 and Annex 5).'
  source:
    file: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf
    locator: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf#p.24
  verified: llm_cited
- requirement: Entry into operation must be reached within 5 years after grant signature with
    capacity matching the bid, or the grant will be terminated and the guarantee called.
  quote: 'Please be aware that entry into operation must be reached within 5 years after grant

    signature and that the project must at that moment be able to demonstrate a

    nameplate capacity equal to the capacity expressed in the bid (required as deliverable

    for WP 2; see above).'
  source:
    file: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf
    locator: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf#p.24
  verified: llm_cited
- requirement: After entry into operation, the installation must operate for at least 10 years
    (unless the committed volume is reached earlier under production flexibility rules).
  quote: 'After entry into operation, the installation must operate for at least 10 years
    (unless

    the total volume committed to in Annex 1 of the Grant Agreement is reached earlier

    due to the production flexibility rules; see above).'
  source:
    file: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf
    locator: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf#p.24
  verified: llm_cited
- requirement: Produced volume must not fall on average below 30% of expected yearly average
    volume for three consecutive years, calculated on a rolling 3-year basis, or grant may
    be terminated/reduced.
  quote: 'The volume produced must be verified and certified (required as deliverable for
    WP

    3 -22; see above) and not fall on average below 30% of the expected yearly average

    volume as stated in the bid for three consecutive years.'
  source:
    file: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf
    locator: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf#p.24
  verified: llm_cited
- requirement: For the MARITIME topic, at least 60% of produced hydrogen volume must be supplied
    to maritime off-takers and verified/certified, or the grant may be reduced.
  quote: 'In addition, for topic INNOVFUND-2024-AUC-RFNBOH2-MARITIME, supply to an off-

    taker belonging to the maritime sector must be verified and certified (required as

    deliverable for the final WP; see above) and must be at least 60% of the volume of

    hydrogen produced during the implementation period.'
  source:
    file: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf
    locator: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf#p.24
  verified: llm_cited
- requirement: Beneficiaries must certify that hydrogen produced achieves at least 70% GHG
    savings under the RED Delegated Act, or the grant may be reduced.
  quote: 'The beneficiaries will need to provide certification that the total volume of hydrogen

    produced by the supported electrolyser capacity achieves at least 70% GHG savings according
    to the rules set out in the Delegated Act C(2023)1086

    supplementing the Renewable Energy Directive 2018/2001'
  source:
    file: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf
    locator: innovfund_2024_hydrogen_auction_general_maritime_call_document.pdf#p.24
  verified: llm_cited
- requirement: A completion guarantee letter of intent must be submitted at proposal submission
    and the actual guarantee provided within two months of the evaluation result letter, or
    the application may be considered withdrawn.
  quote: 'The completion guarantee must be provided within two months of receiving the evaluation

    result letter (invitation to grant preparation). If no guarantee is received within this

    time-limit, the granting authority may consider the application as withdrawn and decide

    to terminate grant preparation.'
