cumulation:
  text: For companies that are part of a corporate group, the de minimis aid ceiling applies
    as a general rule to the group as a whole.
  quote: For foretak som er del av et konsern, gjelder maksimalgrensen som hovedregel for
    konsernet som sådan.
  source:
    file: nfr_pes_horisont_europa_call_2025.html
    locator: nfr_pes_horisont_europa_call_2025.html#chunk 2
  verified: llm_cited
application:
  channel: Electronic application (e-søknad) submitted via Mitt nettsted at Forskningsrådet.
  typical_timeline: Apply as early as possible, at the latest four weeks before the EU deadline;
    decisions are usually communicated within four weeks of receipt.
  quote: Du må søke om støtte så tidlig som mulig – helst så snart et prosjektforslag begynner
    å ta form – og seinest fire uker før EU-fristen.
  source:
    file: nfr_pes_horisont_europa_call_2025.html
    locator: nfr_pes_horisont_europa_call_2025.html#chunk 1
  verified: llm_cited
