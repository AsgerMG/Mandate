  gate_family: G1_nexus
  requirement: The film must be certified by the Revenue Commissioner and the Minister for
    Arts, Sport and Tourism (or the Irish Film Board) as satisfying verifiable, national,
    cultural criteria.
  value: Certification of cultural criteria required
  intake_field: developmentStage
  quote: which have been certified by the Revenue Commissioner and the Minister for Arts,
    Sport and Tourism as satisfying certain verifiable, national, cultural criteria
  source:
