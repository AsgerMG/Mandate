    locator: p.90
  verified: false
  verify_note: 'fragment not found verbatim: ''The aid intensities for industrial research
    and ex'''
- id: g4
  gate_family: G2_size_ownership
  requirement: 'SME size determines the applicable aid-intensity bonus: +20 percentage points
    for small enterprises, +10 percentage points for medium-sized enterprises, on top of the
    base industrial research/experimental development intensity.'
  value: 'Small: +20pp; Medium: +10pp bonus'
  intake_field: fteBand
  quote: by 10 percentage points for medium-sized enterprises and by 20 percentage point for
    small enterprises;
  source:
    file: gber_651_2014_consolidated.pdf
    locator: p.90
  verified: false
  verify_note: The quote confirms the +10pp for medium and +20pp for small bonuses, but it
