- id: g5
  gate_family: G4_borrower_model
  requirement: 'The aided part of a research and development project must fall entirely within
    one or more defined R&D categories: fundamental research, industrial research, experimental
    development, or feasibility studies.'
  value: fundamental research / industrial research / experimental development / feasibility
    studies
  intake_field: developmentStage
  quote: 'The aided part of the research and development project shall completely fall within
    one or more of the following categories:

    (a) fundamental research;

    (b) industrial research;

    (c) experimental development;

    (d) feasibility studies.'
  source:
    file: gber_651_2014_consolidated.pdf
    locator: p.89
  verified: llm_2pass
- id: g6
  gate_family: G6_conditionality
  requirement: An additional 15 percentage point aid-intensity bonus applies if the project
    involves effective collaboration between undertakings (at least one SME, or cross-border)
    with no single undertaking bearing more than 70% of eligible costs, or other qualifying
    collaboration/dissemination conditions.
  value: +15pp bonus for qualifying collaboration (no single undertaking >70% of eligible
