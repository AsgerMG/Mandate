gates:
- id: g1
  gate_family: G3_financial
  requirement: Aid intensity for industrial research shall not exceed 50% of eligible costs,
    meaning the beneficiary must self-fund at least 50% of eligible costs (before bonuses).
  value: Max 50% aid / min 50% own-funding for industrial research
  intake_field: cofinancingBand
  quote: 'The aid intensity for each beneficiary shall not exceed:

    (a) 100 % of the eligible costs for fundamental research;

    (b) 50 % of the eligible costs for industrial research;

    (c) 25 % of the eligible costs for experimental development;

    (d) 50 % of the eligible costs for feasibility studies.'
  source:
    file: gber_651_2014_consolidated.pdf
    locator: p.90
  verified: llm_2pass
- id: g2
  gate_family: G3_financial
  requirement: Aid intensity for experimental development shall not exceed 25% of eligible
    costs, meaning the beneficiary must self-fund at least 75% of eligible costs (before bonuses).
  value: Max 25% aid / min 75% own-funding for experimental development
  intake_field: cofinancingBand
  quote: 'The aid intensity for each beneficiary shall not exceed:

    (a) 100 % of the eligible costs for fundamental research;

    (b) 50 % of the eligible costs for industrial research;

    (c) 25 % of the eligible costs for experimental development;

    (d) 50 % of the eligible costs for feasibility studies.'
  source:
    file: gber_651_2014_consolidated.pdf
    locator: p.90
  verified: llm_2pass
- id: g3
  gate_family: G3_financial
  requirement: The aid intensities for industrial research and experimental development may
    be increased up to a maximum of 80% of eligible costs via SME and collaboration/dissemination
    bonuses, reducing the minimum own-funding share accordingly.
  value: Max combined aid intensity 80% (min 20% own-funding) for industrial research/experimental
    development with bonuses
  intake_field: cofinancingBand
  quote: 'The aid intensities for industrial research and experimental development may be
    increased up to a maximum aid intensity of 80 % of the eligible costs in accordance with
    points (a) to (d), where points (b), (c) and (d) must not be combined with each other:'
  source:
