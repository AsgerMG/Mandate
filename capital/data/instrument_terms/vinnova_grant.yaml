cumulation:
  text: All minor (de minimis) support granted under the minor support ordinance, including
    to other parts of the recipient's group, must be aggregated over the rolling three-year
    period; support already granted under GBER is not counted toward this de minimis ceiling.
  quote: In order to calculate the maximum allowable support, all funding granted under the
    Ordinance on minor support must be added together. funding for other parts of the group
    must also be included in this calculation. However, if you have received support according
    to GBER, you should not count on this.
  source:
    file: vinnova_state_aid_rules.html
    locator: chunk 3
  verified: llm_cited
