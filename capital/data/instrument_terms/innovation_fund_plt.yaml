application:
  channel: Electronic submission via the EU Funding & Tenders Portal Electronic Submission
    System (one-stage submission, one-step evaluation); paper submissions not possible.
  typical_timeline: Call opens 4 December 2025; deadline for submission 23 April 2026; evaluation
    April-September 2026; results October-November 2026; grant agreement signature November
    2026-March 2027; time-to-grant estimated up to 11 months.
  quote: Proposals must be submitted electronically via the Funding & Tenders Portal Electronic
    Submission System (accessible via the Topic page in the Calls for proposals section).
    Paper submissions are NOT possible.
  source:
