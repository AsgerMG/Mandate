obligations:
- requirement: Applicants must confirm at submission that they have the mandate to act for
    all applicants and that all participants comply with the funding conditions; each beneficiary
    and affiliated entity must sign a declaration of honour before grant signature.
  quote: At proposal submission, you will have to confirm that you have the mandate to act
    for all applicants. Moreover, you will have to confirm that the information in the application
    is correct and complete and that all participants comply with the conditions for receiving
    EU funding
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: p.15
  verified: llm_cited
- requirement: Beneficiaries and affiliated entities must register in the Participant Register
    before submitting the proposal and be validated by the Central Validation Service.
  quote: Beneficiaries and affiliated entities must register in the Participant Register —
    before submitting the proposal — and will have to be validated by the Central Validation
    Service (REA Validation).
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: p.16
  verified: llm_cited
- requirement: Applicants must have the know-how, qualifications and resources (operational
    capacity) to successfully implement the project, including sufficient experience in comparable
    projects.
  quote: Applicants must have the know-how, qualifications and resources to successfully implement
    the projects and contribute their share (including sufficient experience in projects of
    comparable size and nature).
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: p.20
  verified: llm_cited
- requirement: Innovation Fund grants may only be combined with other EU-managed programme
    funding if the EU Synergies clause is enabled in both grant agreements and combined funding
    rates do not exceed 100%.
  quote: Innovation Fund grants may be combined with funding from another EU programme (directly
    managed by the EU Commission), if in both grants the EU Synergies actions’ clause is enabled
    in Article 6.3 of the Model Grant Agreement and the combined funding rates at grant level
    do not exceed 100%
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: p.41
  verified: llm_cited
- requirement: Grant applications must ensure a balanced project budget with sufficient other
    resources (own contributions, income, third-party financial contributions) to implement
    the project successfully.
  quote: Balanced project budget — Grant applications must ensure a balanced project budget
    and sufficient other resources to implement the project successfully (e.g. own contributions,
