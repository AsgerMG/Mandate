  text: Innovation Fund grants may be combined with other directly-managed EU programme funding
    if the Synergies clause is enabled in both grant agreements and combined funding rates
    do not exceed 100%; combination with EU operating grants is possible if costs are not
    double-declared.
  quote: Cumulation of funding — Innovation Fund grants may be combined with funding from
    another EU programme (directly managed by the EU Commission), if in both grants the EU
    Synergies actions’ clause is enabled in Article 6.3 of the Model Grant Agreement and the
    combined funding rates at grant level do not exceed 100%
  source:
    file: innovfund_2025_nzt_call_document_lsp_msp_ssp_mfg_plt.pdf
    locator: p.41
