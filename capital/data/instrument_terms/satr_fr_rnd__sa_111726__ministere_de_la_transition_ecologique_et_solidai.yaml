gates:
- id: g1-any-size-renewable-energy
  gate_family: G1_nexus
  requirement: Companies of any size may receive investment aid for the promotion of energy produced from
    renewable sources and renewable hydrogen (except electricity produced from renewable hydrogen), subject
    to sectoral exclusions.
  value: Any size, renewable energy/renewable hydrogen investment (excl. electricity from renewable H2)
  intake_field: none
  quote: Les entreprises quelle que soit leur taille peuvent bénéficier d’aides à l’investissement en
    faveur de la promotion de l’énergie produite à partir de sources renouvelables et de l’hydrogène renouvelable
    (à l’exception de l’électricité produite à partir d’hydrogène renouvelable)
  source:
