application:
  channel: Open, transparent and competitive calls for proposals published under Horizon Europe
    (DES ER/IR calls) and CEF (Digital Sky Demonstrators), submitted via the Funding & Tenders
    Portal.
  typical_timeline: Calls open with several months between publication and deadline, followed
    by evaluation, grant preparation, and signature; e.g. IR2/ER3 opened 1 April 2025 with
    deadline 16 September 2025, grants to be signed by mid-May 2026.
  quote: 'On 15 January 2025, the SESAR 3 JU published the IR2 call, which opened on 1 April,
    with a call

    deadline on 16 September. The call amount of € 230 million is divided between seven Work
    Areas'
  source:
    file: sesar_ju_qa_document_v1.pdf
    locator: sesar_ju_bawp_2026_2027.pdf#p.18
  verified: llm_cited
