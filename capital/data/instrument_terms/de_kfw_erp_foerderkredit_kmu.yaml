  intake_field: borrowerModel
  quote: "Natürliche Personen\n Juristische Personen, die sich mehrheitlich in Privatbesitz\
    \ befinden\n Rechtsfähige Personengesellschaften,\ndie in Ausübung oder zur Aufnahme einer\
