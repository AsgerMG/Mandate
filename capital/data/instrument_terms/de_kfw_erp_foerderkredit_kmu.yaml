  value: Unternehmen mit Sitz in Deutschland; Tochtergesellschaften; Joint Ventures mit deutscher
    Beteiligung >=25%
  intake_field: activityCountries
  quote: "Antragsberechtigt für Vorhaben im Ausland sind:\n Unternehmen mit Unternehmenssitz\
    \ in Deutschland\n Tochtergesellschaften deutscher Unternehmen mit Sitz im Ausland\n Joint\
