cumulation:
  text: Combination with other funding programmes (loans or grants) is generally possible
    within the applicable state aid ceilings; cumulation rules under Article 5 De-minimis
    Regulation and Article 8 GBER must be observed.
  quote: 'Grundsätzlich ist die Kombination einer Förderung aus diesem Programm mit anderen
    Fördermitteln (Kredite oder

    Zulagen/Zuschüsse) im Rahmen der zulässigen Beihilfeobergrenzen möglich.'
  source:
    file: kfw_merkblatt_365_erp_foerderkredit_kmu.pdf
    locator: kfw_merkblatt_365_erp_foerderkredit_kmu.pdf#p.2
  verified: llm_cited
application:
  channel: Application submitted through a financing partner (bank or savings bank) of the
    applicant's choice before project start.
  typical_timeline: For loans with liability exemption, KfW offers an accelerated Fast Track
    risk review typically within a maximum of 5 banking business days if Fast Track criteria
    are met and total KfW exposure is at most €750,000.
  quote: 'Wenn die Erfüllung der Fast Track Kriterien der KfW gemäß

    „Checkliste für die Unterlagen zur Risikoprüfung“ durch den Finanzierungspartner bestätigt
    wird, bietet die KfW eine

    beschleunigte Risikoprüfung in der Regel innerhalb von maximal 5 Bankarbeitstagen an'
  source:
    file: kfw_merkblatt_365_erp_foerderkredit_kmu.pdf
    locator: kfw_merkblatt_366_erp_foerderkredit_kmu_haftungsfreistellung.pdf#p.4
  verified: llm_cited
borrower_models:
- operating_company
ticket:
  min_eur: 25000
  max_eur: 25000000
