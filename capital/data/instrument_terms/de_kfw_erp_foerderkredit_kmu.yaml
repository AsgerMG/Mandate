  value: Unternehmenssitz in Deutschland oder im Ausland, für Vorhaben in Deutschland
  intake_field: entityCountries
  quote: "mit Unternehmenssitz in Deutschland\n mit Unternehmenssitz im Ausland\nfür Vorhaben\
