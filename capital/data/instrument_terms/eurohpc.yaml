- requirement: Beneficiaries under EuroHPC JU grants funded via H2020/HE are subject to ex-post
    audits performed by the Common Audit Service; DEP-funded projects are audited centrally
    by HADEA.
  quote: For EuroHPC JU projects funded under the H2020 and the HE programmes, ex-post audits
    are carried out since 2022 by the Common Audit Service of the European Commission, and
    as such will continue in 2026.
  source:
    file: eurohpc_ju_work_programme_2026.pdf
    locator: eurohpc_ju_work_programme_2026.pdf#p.22
  verified: llm_cited
- requirement: The peer-review platform contractor must ensure support and maintenance services
