- id: g4_prize_mechanism
  gate_family: G4_borrower_model
  requirement: The Quantum Computing action is structured as an inducement Prize awarded after
    a two-stage selection and independent validation process, not as a standard grant.
  value: Prize mechanism, two-stage selection with independent validation
  intake_field: borrowerModel
  quote: 'The call will be implemented in two stages: In a first step, applicants will be
    selected on the basis of a reference implementation, the anticipated quantum advantage,
    potential impact and other criteria. Successful applicants will be awarded access to EuroHPC
    quantum computers to develop and verify the proposed implementation.'
  source:
