- id: g5_use_of_funds_microprocessor
  gate_family: G5_use_of_funds
  requirement: Funds must be used for design, testing and development of high-end processors
    and their integration in pilot systems, targeting KPIs superior to non-EU solutions, ensuring
    IP remains in the EU.
  value: Design/testing/development of high-end EU processors; IP must remain in EU
  intake_field: none
  quote: A key aspect is to ensure that all the IP necessary to produce the solutions remains
    in the EU, effectively creating an independent European source of critical technology.
  source:
    file: eurohpc_ju_work_programme_2026.pdf
    locator: eurohpc_ju_work_programme_2026.pdf#p.15
  verified: llm_cited
