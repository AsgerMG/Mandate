- requirement: Results of the Quantum Computing prize must be made available as open source
    / public domain.
  quote: the results will be made available as open source / public domain
  source:
    file: eurohpc_ju_work_programme_2026.pdf
    locator: eurohpc_ju_work_programme_2026.pdf#p.17
