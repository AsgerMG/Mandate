- id: g6_synergy_no_double_funding
  gate_family: G6_conditionality
  requirement: Actions funded below 100% EU contribution are EU Synergy calls; grants/procurements
    may be linked with other EU funding provided there is no double funding of the same costs.
  value: No double funding permitted; linked actions managed jointly
  intake_field: conditionality
  quote: Grants and procurements can be linked with another grant funded from any other EU
    funding programme including the Recovery and Resilience Fund, provided that there is no
    double funding and that such support does not cover the same cost.
  source:
    file: eurohpc_ju_work_programme_2026.pdf
    locator: eurohpc_ju_work_programme_2026.pdf#p.5
  verified: llm_cited
