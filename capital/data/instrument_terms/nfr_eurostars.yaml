cumulation:
  text: Eurostars project support cannot be combined with other direct public support from
    Norway or the EU, though public loans (Innovasjon Norge) are allowed; it can be combined
    with indirect SkatteFUNN support, which is offset via tax settlement under state aid rules.
  quote: Det er ikke mulig å kombinere støtten til Eurostars-prosjektet med annen direkte
    offentlig støtte fra Norge eller EU. Imidlertid er det mulig å ha offentlige lån (Innovasjon
    Norge).
  source:
    file: nfr_eurostars_overview.html
    locator: nfr_eurostars_overview.html#chunk 1
  verified: llm_cited
application:
  channel: Applications must be created via the Eurostars international pages, submitted by
    the main partner on behalf of all consortium partners, after registering on the Eureka
    website.
  typical_timeline: Two application deadlines per year (spring and autumn); the 2026 call
    opens 9 July with deadline 10 September, and a separate March 2026 call had a deadline
    of 19 March 2026.
  quote: Søknader må opprettes via Eurostars internasjonale sider. Det er hovedpartner i prosjektet
    som sender inn søknaden på vegne av alle prosjektpartnere i konsortiet. For å få tilgang
    til søknadsskjemaet, må du registrere deg på nettsidene til Eureka.
  source:
    file: nfr_eurostars_overview.html
    locator: nfr_eurostars_overview.html#chunk 1
  verified: false
