cumulation:
  text: 'Strict prohibition on double funding: any action may receive only one grant from
    the EU budget (except EU Synergy grants), and the same costs may never be declared to
    two different EU actions.'
  quote: 'There is strict prohibition of double funding from the EU budget. Any given action

    may receive only ONE grant from the EU budget (except for EU Synergy grants) and same
    costs may under

    NO circumstances be declared to two different EU actions.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
application:
  channel: EU Funding & Tenders Portal electronic submission system
  typical_timeline: 'Around 5 months from submission deadline for evaluation outcome; around
