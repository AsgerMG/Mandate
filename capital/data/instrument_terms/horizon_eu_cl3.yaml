country: ''
capital_type: unknown
status: draft
gates:
- id: g1-country-eligibility
  gate_family: G1_nexus
  requirement: Applicants must be established in a Member State of the EU, an Associated Country,
    or another country listed as eligible for funding (or provided for in call conditions).
  value: EU Member States, Associated Countries, listed third countries
  intake_field: entityCountries
  quote: 'To be eligible for funding, applicants must be established in one of the following
    countries:'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russia-belarus-exclusion
  gate_family: G1_nexus
  requirement: Legal entities established in Russia, Belarus, or non-government controlled
    territories of Ukraine are not eligible to participate in any capacity.
  value: 'excluded: Russia, Belarus, non-government controlled Ukraine territories'
  intake_field: entityCountries
  quote: 'such legal entities are not eligible to participate in any capacity. This

    includes participation as beneficiaries, affiliated entities, associated partners, third
    parties

    giving in-kind contributions, subcontractors or recipients of financial support to third
    parties (if

    any)'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russia-ownership-exclusion
  gate_family: G1_nexus
  requirement: Legal entities established outside Russia whose proprietary rights are more
    than 50% owned by a Russia-established entity are not eligible to participate.
  value: '>50% Russian ownership excluded'
  intake_field: nonEuControl
  quote: 'legal entities established outside Russia whose

    proprietary rights are directly or indirectly owned for more than 50% by a legal person,
    entity

    or body established in Russia are also not eligible to participate in any capacity'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-hungary-restriction
  gate_family: G1_nexus
  requirement: Hungarian public interest trusts under Act IX of 2021 (and entities they maintain)
    cannot receive EU funding as beneficiaries, affiliated entities or other funded roles.
  value: Hungarian public interest trusts excluded from funded roles
  intake_field: entityCountries
  quote: 'such entities are not eligible to participate in any funded role

    (beneficiaries, affiliated entities, subcontractors, recipients of financial support to
    third parties,

    etc.)'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-china-restriction
  gate_family: G1_nexus
  requirement: For IA and RIA actions identified as affected, legal entities established in
    China are not eligible to participate in any capacity, subject to case-by-case exceptions.
  value: China excluded (IA/RIA specific actions)
  intake_field: entityCountries
  quote: 'this includes participation of legal entities established

    in China in any capacity (as beneficiaries, affiliated entities, associated partners,
    third parties

    giving in-kind contributions, subcontractors or recipients of financial support to third
    parties (if

    any))'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-miit-universities
  gate_family: G1_nexus
  requirement: Chinese universities administered by or under the supervision of the Ministry
    of Industry and Information Technology (MIIT) are not eligible to participate in any action.
  value: MIIT-linked Chinese universities excluded
  intake_field: entityCountries
  quote: 'universities (higher

    education establishments) established in China which are public bodies, that are administered

    by or fall under the supervision of the Ministry of Industry and Information Technology
    (MIIT)

    are not eligible to participate in any action under all parts of this Work Programme'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-highrisk-5g-suppliers
  gate_family: G1_nexus
  requirement: Entities assessed as high-risk suppliers of mobile network communication equipment
    (and entities they own/control) are not eligible to participate as beneficiaries, affiliated
    entities, or associated partners in actions subject to 5G-network restrictions.
  value: high-risk 5G suppliers excluded
  intake_field: entityCountries
  quote: 'Entities that are assessed as high-risk suppliers of mobile network communication
    equipment

    (and any entities they own or control) are not eligible to participate as beneficiaries,
    affiliated

    entities and associated partners.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.9
  verified: llm_cited
- id: g1-consortium-composition
  gate_family: G2_size_ownership
  requirement: Unless otherwise provided, the consortium must include at least three independent
    legal entities established in different countries, with at least one in a Member State
    and two others in different Member States or Associated Countries.
  value: 3 independent entities, 3 different countries, min 1 in MS
  intake_field: consortium
  quote: 'the consortium includes, as

    beneficiaries, three legal entities independent from each other and each established in
    a different

    country as follows'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.13
  verified: llm_cited
- id: g1-training-mobility-single
  gate_family: G1_nexus
  requirement: Applications for Training and mobility actions and Programme co-fund actions
    may be submitted by one or more legal entities provided one is established in a Member
    State or Associated Country.
  value: 1+ entities, at least one in MS/AC
  intake_field: consortium
  quote: 'Applications for ‘Training and mobility’ actions and for ‘Programme co-fund’ actions
    may be

    submitted by one or more legal entities, provided that one of those legal entities is
    established

    in a Member State or an Associated Country.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g4-exclusion-financial-situations
  gate_family: G4_borrower_model
  requirement: Applicants subject to EU administrative sanctions or in exclusion situations
    such as bankruptcy, winding-up, or court-administered affairs cannot participate.
  value: excluded if bankrupt/wound up/under administration
  intake_field: lossesOverHalfCapital
  quote: 'bankruptcy, winding up, affairs administered by the courts, arrangement with creditors,

    suspended business activities or other similar procedures (including procedures for

    persons with unlimited liability for the applicant’s debts)'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.22
  verified: llm_cited
- id: g5-eligible-activities-civil
  gate_family: G5_use_of_funds
  requirement: Funded projects must focus exclusively on civil applications and must not involve
    human cloning for reproductive purposes, heritable germline modification, or creation
    of embryos solely for research.
  value: civil applications only; specific biotech exclusions
  intake_field: none
  quote: 'Projects must focus exclusively on civil applications and must not:

    – aim at human cloning for reproductive purposes;'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g5-topic-correspondence
  gate_family: G5_use_of_funds
  requirement: Applications are only eligible if their content corresponds, wholly or in part,
    to the topic description under which they are submitted.
  value: content must match call topic
  intake_field: none
  quote: 'Applications will only be

    considered eligible if their content corresponds, wholly or in part, to the topic description
    for

    which it is submitted.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g1-admissibility-deadline-portal
  gate_family: G1_nexus
  requirement: Applications must be submitted electronically via the Funding & Tenders Portal
    before the call deadline; paper submissions are not possible.
  value: electronic submission via Portal before deadline
  intake_field: needBy
  quote: 'Applications must be submitted before the call deadline.

    Applications must be submitted electronically via the Funding & Tenders Portal electronic

    submission system (accessible via the topic page in the Search Funding & Tenders section).

    Paper submissions are NOT possible.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.4
  verified: llm_cited
- id: g2-operational-capacity
  gate_family: G2_size_ownership
  requirement: Applicants must have the know-how, qualifications and resources to successfully
    implement their tasks in the project, assessed via operational capacity criteria.
  value: operational capacity required (except public bodies, MS orgs, international orgs)
  intake_field: borrowerModel
  quote: 'Applicants must have the know-how, qualifications and resources to successfully
    implement

    their tasks in the project and contribute their share (including, when appropriate, sufficient

    experience in EU/transnational projects of comparable size).'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.22
  verified: llm_cited
- id: g6-gender-equality-plan
  gate_family: G6_conditionality
  requirement: Public bodies, research organisations and higher education establishments from
    Member States/Associated Countries applying as beneficiaries or affiliated entities must
    have a gender equality plan at grant signature and throughout the grant duration.
  value: gender equality plan required for public bodies/research orgs/HEIs
  intake_field: institutionalBacking
  quote: 'legal entities from Member States and Associated Countries that are

    public bodies, research organisations or higher education establishments (including private

    research organisations and private higher education establishments) applying as beneficiaries

    or affiliated entities must have at the moment of grant signature and during the duration
    of the

    grant a gender equality plan'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.18
  verified: llm_cited
obligations:
- requirement: Beneficiaries must not allow projects to generate a profit; surplus of revenues
    plus EU grant over costs is checked at project end.
  quote: 'Grants may NOT give a profit (i.e. surplus of revenues + EU grant over costs). This
    will

    be checked by the granting authority at the end of the project.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
- requirement: Beneficiaries must promote equal opportunities between men and women in implementing
    the action and aim for gender balance at all personnel levels.
  quote: 'Beneficiaries must take all measures to promote equal opportunities between men
    and women

    in implementing the action and, where applicable, in line with their gender equality plan.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.18
  verified: llm_cited
- requirement: Projects must comply with ethical principles, including research integrity,
    and applicants must complete an ethics self-assessment as part of the application.
  quote: 'Projects must comply with ethical principles (including the highest standards of
    research

    integrity) and applicable EU, international and national law.

    Applicants must have completed the ethics self-assessment as part of their application.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.16
  verified: llm_cited
- requirement: Beneficiaries must ensure their projects are not subject to national/third-country
    security requirements affecting implementation, and must notify security issues immediately.
  quote: 'beneficiaries must ensure that their projects are not subject to national/third-

    country security requirements that could affect implementation or put into question the
    award

    of the grants (e.g. technology restrictions, national security classification, etc.).
    Any potential

    security issues must be notified immediately to the granting authority.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.18
  verified: llm_cited
- requirement: Where financial support to third parties is allowed, projects must publish
    calls widely, keep them open at least 2 months, and publish outcomes without delay.
  quote: the calls must remain open for at least 2 months;
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.19
  verified: llm_cited
- requirement: Applications must include a plan for exploitation and dissemination of results,
    including communication activities, unless the call conditions state otherwise.
  quote: 'Applications must include a plan for the exploitation and dissemination of results
    including

    communication activities, unless provided otherwise in the specific call/topic conditions.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.4
  verified: llm_cited
- requirement: Participants must conclude a written consortium agreement to govern implementation,
    unless otherwise provided in call conditions.
  quote: 'participants must conclude a written consortium agreement to ensure the smooth and

    successful implementation of the action and to deal with exceptional or unforeseen

    circumstances, unless otherwise provided for in the specific call conditions.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.37
  verified: llm_cited
