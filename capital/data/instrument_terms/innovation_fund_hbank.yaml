obligations:
- requirement: Projects must certify and verify RFNBO/electrolytic low-carbon hydrogen production
    volumes; payments are made only against certified and verified production.
  quote: 'payments will only be made against certified and verified RFNBO and/or

    electrolytic low-carbon hydrogen production volumes in consistency with the objective

    of the topic that the project applied to.'
  source:
    file: innovfund_2025_hydrogen_auction_call_document.pdf
    locator: p.26
  verified: llm_cited
- requirement: Beneficiaries must certify that hydrogen produced achieves at least 70% GHG
    savings on average during the disbursement period.
  quote: 'The beneficiaries will need to provide certification that the total volume of hydrogen
    produced by the supported electrolyser capacity achieves at

    least 70% GHG savings according to the rules set out in the Delegated Act C(2023)1086

    supplementing the Renewable Energy Directive 2018/2001'
  source:
    file: innovfund_2025_hydrogen_auction_call_document.pdf
    locator: p.27
  verified: llm_cited
- requirement: If actual production falls on average below 30% of expected yearly average
    volume over a rolling three-year period, the grant may be terminated and reduced.
  quote: 'The volume produced must be verified and certified (required as deliverable for
    WP

    3-22; see above) and not fall on average below 30% of the total expected yearly

    average volume as stated in the bid for three consecutive years.'
  source:
    file: innovfund_2025_hydrogen_auction_call_document.pdf
    locator: p.27
  verified: llm_cited
- requirement: If financial close or entry into operation deadlines are missed, the grant
    agreement may be terminated and the completion guarantee called.
  quote: 'If this is not achieved within

    the required time-limit, we may terminate the grant agreement and call the completion

    guarantee (see art 32.3.1(j) and Annex 5).'
  source:
    file: innovfund_2025_hydrogen_auction_call_document.pdf
    locator: p.27
  verified: llm_cited
- requirement: After entry into operation, the installation must operate for at least 10 years
    unless the committed total volume is reached earlier.
  quote: 'After entry into operation, the installation must operate for at least 10 years
    (unless

    the total volume committed to in Annex 1 of the Grant Agreement is reached earlier

    due to the production flexibility rules; see above).'
  source:
    file: innovfund_2025_hydrogen_auction_call_document.pdf
    locator: p.27
  verified: llm_cited
- requirement: The grant must not be combined with excluded types of public support and must
    not lead to cross-subsidisation of other products.
  quote: 'the auction grant must not be combined with any of the types of excluded public

    support listed in in Annex 3'
  source:
    file: innovfund_2025_hydrogen_auction_call_document.pdf
    locator: p.29
  verified: llm_cited
