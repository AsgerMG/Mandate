cumulation:
  text: Support to research organisations goes to their non-economic activity as independent
    research and therefore does not constitute state aid; a proper accounting separation between
    economic and non-economic activity must be in place, and where a company as a partner
    receives cost coverage, this must occur under GBER Article 25.
  quote: Støtten til forskningsorganisasjonene går til deres ikke-økonomiske aktivitet i form
    av uavhengig forskning. Den utgjør dermed ikke statsstøtte. Forskningsrådet forutsetter
    at nødvendig regnskapsmessig skille mellom organisasjons økonomiske og ikke-økonomiske
    aktivitet er på plass.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 3
  verified: llm_cited
application:
