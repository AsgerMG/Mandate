  value: Sea transport must be main part of logistics/intermodal projects
  intake_field: activityCountries
  quote: Når det gjelder logistikk og intermodal transport, kan dere kun søke om prosjekter
    der sjøtransport er en hoveddel.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 1
  verified: llm_cited
- id: g15
  gate_family: G5_use_of_funds
  requirement: The project must not be contract research (oppdragsforskning).
  value: Project cannot be contract research
  intake_field: borrowerModel
  quote: Prosjektet skal ikke være oppdragsforskning.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 2
  verified: llm_cited
- id: g16
  gate_family: G6_conditionality
  requirement: Applicants must not use R&D suppliers (FoU-leverandører) in the project.
  value: Use of R&D suppliers is prohibited
  intake_field: conditionality
  quote: Dere skal ikke bruke FoU-leverandører i prosjektet.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 2
  verified: llm_cited
obligations:
- requirement: Applicants must describe how research security considerations regarding unwanted
    transfer of knowledge/technology have been assessed and handled.
  quote: Prosjektleder og prosjektansvarlig skal ha vurdert og håndtert hensynet til forskningssikkerhet
    i prosjektet.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 4
  verified: llm_cited
- requirement: Grant recipients in research organisations and public sector must have gender
    equality action plans (GEP) publicly available on their websites; this requirement does
    not apply to private industry, interest organisations or the voluntary sector.
  quote: Tilskuddsmottakere i forskningsorganisasjoner og offentlig sektor (prosjektansvarlige
    og samarbeidspartnere) ha handlingsplaner for likestilling (GEP) tilgjengelig på sine
    nettsider. Kravet gjelder ikke for privat næringsliv, interesseorganisasjoner eller frivillig
    sektor.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 4
  verified: llm_cited
- requirement: Full and immediate open access is required for scientific articles resulting
    from the project.
  quote: Forskningsrådet stiller krav om full og umiddelbar åpen tilgang (open access) for
    vitenskapelige artikler, se Plan S - åpen tilgang til publikasjoner .
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 4
  verified: llm_cited
- requirement: For projects handling data, the project-responsible party must prepare a data
    management plan in connection with the revised application.
  quote: For alle prosjekter som håndterer data, skal prosjektansvarlig utarbeide en datahåndteringsplan
    i forbindelse med revidert søknad.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 4
  verified: llm_cited
- requirement: The Research Council may reject applications where the applicant or partner
    has materially breached obligations in other Research Council-funded projects within the
    past two years.
  quote: Forskningsrådet kan avvise søknader der prosjektansvarlig eller samarbeidspartner
    de siste to årene før innsendt søknad vesentlig har misligholdt sine forpliktelser i andre
    prosjekter med støtte fra Forskningsrådet.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 3
  verified: llm_cited
- requirement: Applications may be rejected if the project leader has been found guilty by
    the Committee on Research Integrity or the Investigation Committee within the past two
    years.
  quote: Søknaden kan bli avvist dersom prosjektleder er felt i Felles redelighetsutvalg eller
    Granskningsutvalget de siste to årene før innsendt søknad.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 3
  verified: llm_cited
