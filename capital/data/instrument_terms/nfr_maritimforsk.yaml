  typical_timeline: Application deadline 10 June 2026; expected decision by the portfolio
    board in December 2026; earliest project start 1 January 2027, latest project start 1
    July 2027; project duration 24-48 months
  quote: Søknaden skal opprettes og sendes inn via Forskningsrådets søknadssystem.
  source:
