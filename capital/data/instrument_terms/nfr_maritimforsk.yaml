- id: g3
  gate_family: G1_nexus
  requirement: Foreign organisations equivalent to Norwegian research organisations may participate
    and receive funding; other foreign organisations may participate but cannot receive funding.
  value: Foreign non-research-equivalent partners cannot receive funding
  intake_field: entityCountries
  quote: Utenlandske organisasjoner tilsvarende norske forskningsorganisasjoner kan være med
    i prosjektet og motta støtte. Andre utenlandske organisasjoner kan være med i prosjektet,
    men de kan ikke motta støtte.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 2
  verified: llm_cited
- id: g4
  gate_family: G2_size_ownership
  requirement: At least two Norwegian collaboration partners (user partners) that are not
    research organisations are required, each with own costs in the project.
  value: Minimum 2 Norwegian non-research collaboration partners with own costs
  intake_field: consortium
  quote: Dere må ha minst to norske samarbeidspartnere (heretter kalt brukerpartnere) som
    ikke er forskningsorganisasjoner, og alle samarbeidspartnerne må ha egne kostnader i prosjektet.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 2
  verified: llm_cited
- id: g5
  gate_family: G2_size_ownership
  requirement: User partners must jointly contribute costs equal to at least 10.0% of the
    amount applied for from the Research Council (the co-participation requirement).
  value: Minimum 10.0% co-financing by user partners of requested grant amount
  intake_field: cofinancingBand
  quote: Brukerpartnerne må medvirke med kostnader som totalt tilsvarer minst 10,0 % av beløpet
    som dere søker oss om til prosjektet (heretter kalt medvirkningskravet).
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 2
  verified: llm_cited
- id: g6
  gate_family: G2_size_ownership
  requirement: Project-responsible party and collaboration partners must be independent of
    each other, i.e. neither can have controlling influence (e.g. majority ownership) over
    the other.
  value: No controlling influence/majority ownership between partners
  intake_field: nonEuControl
  quote: Prosjektansvarlig og samarbeidspartnere må være uavhengige av hverandre. Med dette
    menes at den ene ikke kan ha kontrollerende innflytelse over den andre.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 2
  verified: llm_cited
- id: g7
  gate_family: G2_size_ownership
  requirement: Universities, university colleges and institutes whose main task is research
    cannot act as the societal or industry actor role (i.e. cannot count as a user partner).
  value: Research-focused institutions excluded from user-partner role
  intake_field: borrowerModel
  quote: Universiteter, høyskoler og institutter som har som hovedoppgave å drive med forskning,
    kan ikke ha rollen som samfunns- eller næringsaktør.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 2
  verified: llm_cited
- id: g8
  gate_family: G2_size_ownership
  requirement: Technology transfer offices (TTOs) and Norwegian-registered foreign enterprises
    (NUF) do not count as a required collaboration partner.
  value: TTOs and NUF entities excluded from counting as required partner
  intake_field: borrowerModel
  quote: Teknologioverføringskontorer (TTO‑er) og norskregistrerte utenlandske foretak (NUF)
    teller ikke som påkrevd samarbeidspartner.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 2
  verified: llm_cited
- id: g9
  gate_family: G3_financial
  requirement: Grant support ranges from NOK 4 million to NOK 20 million per project.
  value: NOK 4,000,000 - 20,000,000 per project
  intake_field: ticketBand
  quote: Vi kan gi støtte på 4 – 20 millioner kroner per prosjekt i denne utlysningen.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 3
  verified: llm_cited
- id: g10
  gate_family: G3_financial
  requirement: Total available funds for this call are approximately NOK 110 million.
  value: Estimated NOK 110,000,000 available in the call
  intake_field: ticketBand
  quote: Antatt tilgjengelige midler Kr 110 000 000
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 1
  verified: llm_cited
- id: g11
  gate_family: G3_financial
  requirement: Support cannot be granted to companies that have not fulfilled repayment obligations
    following an ESA/EU Commission decision declaring aid unlawful and incompatible with the
    internal market, nor to undertakings in difficulty under EEA law.
  value: Excludes companies with unpaid illegal-aid recovery orders or undertakings in difficulty
  intake_field: lossesOverHalfCapital
  quote: Støtte kan ikke gis til foretak som ikke har oppfylt krav om tilbakebetaling etter
    en forutgående beslutning fra ESA/EU-kommisjonsbeslutning der støtten er erklært ulovlig
    og uforenlig med det indre marked. Støtte kan heller ikke gis til foretak i vanskeligheter
    i EØS-rettslig forstand.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 3
  verified: llm_cited
- id: g12
  gate_family: G4_borrower_model
  requirement: Support is granted as a project grant under the General Block Exemption Regulation
    Article 25, notified to ESA under reference GBER XX/202X/R&D&I.
  value: Grant funding under GBER Art. 25 (R&D&I aid), notified to ESA
  intake_field: borrowerModel
  quote: Utlysningen er meldt som støtteordning til EFTA Surveillance Authority (ESA) og har
    referanse GBER XX/202X/R&D&I. Om et foretak skal få dekket deler av sine prosjektkostnader
    som samarbeidspartner i prosjektet, må dette skje i henhold til Gruppeunntaksforordningens
    art. 25 (Kommisjonsforordning (EU) nr. 651/2014).
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 3
  verified: llm_cited
- id: g13
  gate_family: G5_use_of_funds
  requirement: Funding may only be applied for research activities characterised as basic
    research or industrial research; the call does not fund experimental development, operational
    activities, or commercialisation/marketing measures.
  value: Eligible only for basic/industrial research, excludes experimental development and
    commercialisation
  intake_field: developmentStage
  quote: Dere kan kun søke om støtte til forskningsaktiviteter som kan karakteriseres som
    grunnforskning eller industriell forskning (for sektorer uten næringsliv kan industriell
    forskning forstås som anvendt forskning). Utlysningen gir ikke støtte til eksperimentell
    utvikling, driftsaktiviteter eller tiltak for kommersialisering, markedsføring eller annen
    utnyttelse av forskningsresultater.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
    locator: nfr_maritimforsk_samarbeidsprosjekt_2026.html#chunk 3
  verified: llm_cited
- id: g14
  gate_family: G5_use_of_funds
  requirement: Regarding logistics and intermodal transport, only projects where sea transport
