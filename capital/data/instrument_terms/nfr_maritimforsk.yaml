- id: g2
  gate_family: G1_nexus
  requirement: Companies acting as collaboration partners must be registered in the Norwegian
    business register and have economic activity in Norway.
  value: Norwegian-registered company with economic activity in Norway
  intake_field: entityCountries
  quote: Bedrifter som skal være samarbeidspartnere må være registrert i det norske foretaksregisteret
    og ha økonomisk aktivitet i Norge.
  source:
    file: nfr_maritimforsk_samarbeidsprosjekt_2026.html
