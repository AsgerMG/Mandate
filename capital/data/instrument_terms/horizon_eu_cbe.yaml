id: horizon_eu_cbe
name: horizon_eu_cbe
administering_body: see source document
country: ''
capital_type: unknown
status: draft
gates:
- id: g1-established-country
  gate_family: G1_nexus
  requirement: Applicants must be established in a Member State, Associated Country, or eligible
    third country to receive EU funding (with exceptions where call conditions or granting
    authority essentiality applies).
  value: Member States/Associated Countries/listed third countries
  intake_field: entityCountries
  quote: 'To be eligible for funding, applicants must be established in one of the following
    countries:'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russia-belarus-exclusion
  gate_family: G1_nexus
  requirement: Legal entities established in Russia, Belarus, or non-government controlled
    territories of Ukraine are not eligible to participate in any capacity.
  value: 'excluded: Russia, Belarus, non-government controlled Ukraine territories'
  intake_field: entityCountries
  quote: such legal entities are not eligible to participate in any capacity
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russia-ownership-exclusion
  gate_family: G2_size_ownership
  requirement: Entities established outside Russia whose proprietary rights are directly or
    indirectly owned for more than 50% by a Russia-established person/entity/body are not
    eligible to participate in any capacity.
  value: '>50% Russian ownership excluded'
  intake_field: nonEuControl
  quote: legal entities established outside Russia whose proprietary rights are directly or
    indirectly owned for more than 50% by a legal person, entity or body established in Russia
    are also not eligible to participate in any capacity
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-hungary-trusts
  gate_family: G1_nexus
  requirement: Hungarian public interest trusts established under Hungarian Act IX of 2021,
    or entities they maintain, are not eligible to participate in any funded role while Council
    measures remain in force.
  value: 'excluded: Hungarian public interest trusts under Act IX/2021'
  intake_field: entityCountries
  quote: such entities are not eligible to participate in any funded role (beneficiaries,
    affiliated entities, subcontractors, recipients of financial support to third parties,
    etc.)
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-china-restrictions
  gate_family: G1_nexus
  requirement: Legal entities established in China are not eligible to participate in any
    capacity in IA and RIA actions covered by the restriction, absent case-by-case exceptions.
  value: 'excluded: China-established entities (IA/RIA scope)'
  intake_field: entityCountries
  quote: this includes participation of legal entities established in China in any capacity
    (as beneficiaries, affiliated entities, associated partners, third parties giving in-kind
    contributions, subcontractors or recipients of financial support to third parties (if
    any))
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-miit-universities
  gate_family: G1_nexus
  requirement: Chinese public universities administered by or under the supervision of the
    Ministry of Industry and Information Technology (MIIT) are not eligible to participate
    in any action under the work programme.
  value: 'excluded: MIIT-supervised Chinese universities'
  intake_field: entityCountries
  quote: universities (higher education establishments) established in China which are public
    bodies, that are administered by or fall under the supervision of the Ministry of Industry
    and Information Technology (MIIT) are not eligible to participate in any action under
    all parts of this Work Programme
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-high-risk-5g-suppliers
  gate_family: G1_nexus
  requirement: Entities assessed as high-risk suppliers of mobile network communication equipment
    (and entities they own or control) are not eligible to participate as beneficiaries, affiliated
    entities or associated partners in actions concerning European communication networks.
  value: 'excluded: high-risk 5G/communication network suppliers'
  intake_field: nonEuControl
  quote: Entities that are assessed as high-risk suppliers of mobile network communication
    equipment (and any entities they own or control) are not eligible to participate as beneficiaries,
    affiliated entities and associated partners.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.9
  verified: llm_cited
- id: g1-strategic-restrictions
  gate_family: G1_nexus
  requirement: For actions related to EU strategic assets, interests, autonomy or security,
    specific call conditions may limit participation to entities established only in EU Member
    States or Member States plus specific listed countries, and may exclude entities controlled
    by non-eligible third countries.
  value: restricted to EU/listed countries per call, control exclusions possible
  intake_field: nonEuControl
  quote: the specific call/topic conditions may limit participation to legal entities established
    only in EU Member States or in EU Member States and specific associated or non-associated
    third countries
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.9
  verified: llm_cited
- id: g1-consortium-composition
  gate_family: G1_nexus
  requirement: Unless otherwise provided, a consortium must include, as beneficiaries, three
    independent legal entities each established in a different country, with at least one
    in a Member State and at least two others in different Member States or Associated Countries.
  value: 3 independent entities, 3 different countries, min. 1 Member State
  intake_field: consortium
  quote: at least one independent legal entity established in a Member State; and − at least
    two other independent legal entities, each established in different Member States or Associated
    Countries
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g1-mono-beneficiary-actions
  gate_family: G1_nexus
  requirement: Applications for Training and mobility actions and Programme co-fund actions
    may be submitted by one or more legal entities provided one is established in a Member
    State or Associated Country.
  value: one entity in Member State/Associated Country required
  intake_field: consortium
  quote: Applications for ‘Training and mobility’ actions and for ‘Programme co-fund’ actions
    may be submitted by one or more legal entities, provided that one of those legal entities
    is established in a Member State or an Associated Country.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g1-legal-entity-status
  gate_family: G1_nexus
  requirement: Applicants must be a legal entity (natural or legal person recognised under
    national, EU, or international law) or an entity without legal personality meeting equivalent
    guarantee requirements.
  value: legal entity status required
  intake_field: borrowerModel
  quote: A ‘legal entity’ means any natural or legal person created and recognised as such
    under national law, EU law or international law, which has legal personality and which
    may, acting in its own name, exercise rights and be subject to obligations, or an entity
    without legal personality
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.5
  verified: llm_cited
- id: g6-exclusion-situations
  gate_family: G6_conditionality
  requirement: Applicants subject to EU administrative sanctions or in exclusion situations
    such as bankruptcy, winding up, or arrangement with creditors cannot participate.
  value: excluded if bankrupt/sanctioned/in exclusion situation
  intake_field: none
  quote: bankruptcy, winding up, affairs administered by the courts, arrangement with creditors,
    suspended business activities or other similar procedures (including procedures for persons
    with unlimited liability for the applicant’s debts)
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.22
  verified: llm_cited
- id: g5-civil-applications-only
  gate_family: G5_use_of_funds
  requirement: Projects must focus exclusively on civil applications and must not aim at human
    cloning, heritable germline modification (except gonad cancer research), or creation of
    human embryos solely for research or stem cell procurement.
  value: civil applications only; no human cloning/germline modification/embryo creation for
    research
  intake_field: none
  quote: 'Projects must focus exclusively on civil applications and must not: – aim at human
    cloning for reproductive purposes;'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g5-completed-projects-excluded
  gate_family: G5_use_of_funds
  requirement: Applications for projects that have already been completed will be rejected;
    applications for already-started projects assessed case-by-case with no reimbursement
    for pre-application costs.
  value: completed projects ineligible; started projects case-by-case
  intake_field: developmentStage
  quote: Applications for projects that have already been completed will be rejected. Applications
    for projects that have already started will be assessed on a case-by-case basis (in such
    cases, no costs can normally be reimbursed for activities that took place before the application
    was submitted).
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.37
  verified: llm_cited
obligations:
- requirement: Beneficiaries must publish open calls for financial support to third parties
    on the EU Funding & Tenders Portal and beneficiaries' websites, keep them open at least
    2 months, and publish outcomes promptly with a clear European dimension.
  quote: all calls for third parties and all calls that are implemented by third parties must
    be published on the EU Funding & Tenders Portal, and on the beneficiaries’ websites
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.19
  verified: llm_cited
- requirement: Beneficiaries must ensure gender balance measures and, for public bodies/research
    organisations/higher education establishments, maintain a gender equality plan meeting
    minimum requirements at grant signature and throughout the grant duration.
  quote: legal entities from Member States and Associated Countries that are public bodies,
    research organisations or higher education establishments (including private research
    organisations and private higher education establishments) applying as beneficiaries or
    affiliated entities must have at the moment of grant signature and during the duration
    of the grant a gender equality plan
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.18
  verified: llm_cited
- requirement: Beneficiaries must comply with ethical principles and complete an ethics self-assessment
    as part of the application; ethics review may be required before funding is authorised.
  quote: Applicants must have completed the ethics self-assessment as part of their application.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.16
  verified: llm_cited
- requirement: Grants may not generate a profit for beneficiaries, checked by the granting
    authority at the end of the project.
  quote: Grants may NOT give a profit (i.e. surplus of revenues + EU grant over costs). This
    will be checked by the granting authority at the end of the project.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
- requirement: Applicants must confirm at submission and again by declaration of honour before
    signature that all participants comply with conditions for receiving EU funding.
  quote: they will have to confirm that the information in the application is correct and
    complete and that all participants comply with the conditions for receiving EU funding
    (especially eligibility, financial and operational capacity, exclusion, etc.)
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.28
  verified: llm_cited
verify_by: '2027-07-21'
notes: Extracted by ETL/terms/extract_terms_bulk.py (14/14 gates, 5/5 obligations passed mechanical
  check -> llm_cited).
cumulation:
  text: 'Double funding from the EU budget is strictly prohibited: any action may receive
    only one grant from the EU budget (except EU Synergy grants), and the same costs may never
    be declared to two different EU actions; combination with EU operating grants is possible
    only if cost items are kept clearly separate and not declared twice.'
  quote: There is strict prohibition of double funding from the EU budget. Any given action
    may receive only ONE grant from the EU budget (except for EU Synergy grants) and same
    costs may under NO circumstances be declared to two different EU actions.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
application:
  channel: EU Funding & Tenders Portal electronic submission system
  typical_timeline: Around 5 months from submission deadline for evaluation outcome; around
    8 months for grant agreement signature (two-stage calls differ).
  quote: 'information on the outcome of the evaluation: around 5 months from the deadline
    for submission; – indicative date for the signing of grant agreements: around 8 months
    from the deadline for submission.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.31
  verified: llm_cited
