cumulation:
  text: Aid intensity ceilings are set per category of participant and type of activity (industrial
    research vs experimental development), reflecting cumulative rules under GBER Article
    25 including collaboration bonuses.
  quote: 'Současně platí pro každého z účastníků jako nepřekročitelný limit pro intenzitu
    podpory jeho části

    způsobilých nákladů projektu procento stanovené v závislosti na kategorii subjektů, do
    níž účastník patří,

    na charakteru činnosti (průmyslový výzkum / experimentální vývoj) a na přiznání či nepřiznání
    bonifikace

    za účinnou spolupráci'
  source:
    file: cz_mpo_twist_program_call_2025.pdf
    locator: cz_mpo_twist_program_call_2025.pdf#p.15
  verified: llm_cited
