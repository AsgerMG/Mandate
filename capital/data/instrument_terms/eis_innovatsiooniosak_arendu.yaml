application:
  channel: Application submitted via the E-toetus online environment to EIS, following partner
    selection and quote collection; EIS evaluates within 10 working days.
  typical_timeline: EIS hindab esitatud taotlust kuni 10 tööpäeva.
  quote: Taotlus tuleb esitada E-toetuse kaudu. EIS hindab esitatud taotlust kuni 10 tööpäeva.
    Positiivse otsuse korral väljastab innovatsiooniosaku ja projekt võib alata.
  source:
    file: eis_innovatsiooniosak_arendu_terms_eis.html
    locator: chunk 2
