gates:
- id: G1-01
  gate_family: G1_nexus
  requirement: The project must involve companies established in and be co-financed by participating
    Member States (Belgium, Finland, France, Germany, Italy, Poland, Sweden) that notify the
    aid under Article 107(3)(b) TFEU.
  value: Belgium, Finland, France, Germany, Italy, Poland, Sweden
  intake_field: entityCountries
  quote: The public support measures of Belgium, Finland, France, Germany, Italy Poland and
    Sweden will be financed with funds stemming from the respective State budgets.
  source:
