  value: Aid must be necessary/incremental, not covering normal business risk
  intake_field: conditionality
  quote: the aid must not subsidise the costs of a project that an undertaking would anyhow
    incur and must not compensate for the normal business risk of an economic activity.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.66
  verified: llm_cited
obligations:
- requirement: Aid beneficiaries above the EUR 50 million threshold are subject to a claw-back
    mechanism based on ex post figures approved annually by an independent auditor, requiring
    separate analytical accounting.
  quote: The basis for the claw-back mechanism will be ex post figures, which have been subject
    to annual approval by an independent auditor. For this purpose, separate analytical accounting
    will be required from the aid beneficiaries in the relevant Member State.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.46
  verified: llm_cited
- requirement: A letter of credit from a reputable, investment-grade rated financial institution
    must cover the repayment obligation at the End Date, from the first test-run.
  quote: A letter of credit (by a reputable financial institution having investment grade
    rating from a first-rank rating agency) should cover the repayment obligation at the End
    Date by the aid beneficiary, from the first test-run (that is, mid-2026).
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.82
  verified: llm_cited
- requirement: Member States must report to the Commission the implementation/application
    of the claw-back mechanism within one month after each test-run/application.
  quote: The Member States are required to report to the Commission the implementation of
    the claw-back mechanism one month after each application.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.46
  verified: llm_cited
- requirement: Member States must provide the Commission with an annual report on the progress
    and results of the IPCEI Batteries, the work streams, and companies, including spillover
    actions.
  quote: The Member States must provide the Commission with an annual report, containing the
    progress and results of the IPCEI Batteries, the WS and the companies.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.79
  verified: llm_cited
- requirement: Beneficiaries holding IP-protected results must license them to other European
    actors at FRAND conditions and encourage dissemination of results.
  quote: If SEEL will hold rights to IP-protected results, these will be licensed to other
    European actors at FRAND conditions.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.39
  verified: llm_cited
- requirement: Products resulting from the FID phase that do not meet customer requirements
    shall be returned, and customers may return products even if they meet ex ante requirements
    but are unsuitable for their needs.
  quote: Products resulted from the FID phase that will not meet the customers' requirement
    shall be returned. In addition, customers also have the right to return those products
    even if they satisfy ex ante requirements as long as they are not suitable for their needs.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.41
  verified: llm_cited
