  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.66
  verified: llm_cited
- id: G6-02
  gate_family: G6_conditionality
  requirement: Aid must not subsidise costs the undertaking would anyhow incur and must not
