cumulation:
  text: The claw-back mechanism accounts for the actual State aid disbursements and NPV of
    the project, with a Surplus split via an allocation Share between the State and the beneficiary,
    ensuring aid amounts remain tied to project performance and are clawed back if returns
    exceed WACC-based expectations.
  quote: The Surplus, if it is positive, will be multiplied by an allocation ratio "Share
    ", equal to the lesser between 60% or the net disbursed State aid from 2019 to year "i"
    divided by the verified eligible costs from 2019 to year "i"
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.82
  verified: false
application:
  channel: National funding authorities via Member State open calls for projects (e.g., Belgium,
    Finland, France, Germany, Italy, Poland, Sweden), followed by joint notification to the
    European Commission under Article 108(3) TFEU for State aid clearance.
  typical_timeline: National calls launched in early-to-mid 2019 (e.g. 20 February, 9 January,
    22 February, 16 April 2019) followed by Commission decision in the same year (2019 decision
    date).
  quote: Belgium has published an open and transparent call for projects on 20 February 2019.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.40
  verified: llm_cited
