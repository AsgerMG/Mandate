    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.46
  verified: llm_cited
- id: G1-02
  gate_family: G1_nexus
  requirement: Only the specific companies listed as Direct Participants (selected via national
    open and transparent calls) are eligible aid beneficiaries under the notified IPCEI Batteries
    measures.
  value: Listed Direct Participants only
  intake_field: consortium
  quote: The Member States only grant support to the beneficiaries listed section 2.2.6 and
    the funding is not available to all undertakings in a comparable situation.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.47
  verified: llm_cited
- id: G1-03
  gate_family: G1_nexus
  requirement: Selection of participating companies must occur through an open and non-discriminatory
    national procedure (call for projects or open call/expression of interest) organised by
    the Member State.
  value: Open and transparent/non-discriminatory national selection required
  intake_field: consortium
  quote: Belgium has published an open and transparent call for projects on 20 February 2019.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.40
  verified: llm_cited
- id: G2-01
  gate_family: G2_size_ownership
  requirement: The project must qualify as an 'integrated project' i.e. a group of single
    projects by different undertakings inserted in a common structure, roadmap or programme
    aiming at the same objective.
  value: Integrated project of multiple undertakings across value chain levels
  intake_field: consortium
  quote: the Commission may consider eligible an "integrated project", that is to say, a group
    of single projects inserted in a common structure, roadmap or programme aiming at the
    same objective and based on a coherent systemic approach.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.48
  verified: llm_cited
- id: G2-02
  gate_family: G2_size_ownership
  requirement: Individual components/projects of the integrated project must be complementary
    and necessary for achievement of the important European objective, not merely standalone
    commercial activity.
  value: Necessity and complementarity required for each participant's project
  intake_field: consortium
  quote: The individual components of the integrated project may relate to separate levels
    of the supply chain but must be complementary and necessary for the achievement of the
    important European objective.
  source:
    file: ipcei_batteries_first_sa54794_decision_2019.pdf
    locator: ipcei_batteries_first_sa54794_decision_2019.pdf#p.48
  verified: llm_cited
