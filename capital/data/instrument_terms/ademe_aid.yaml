cumulation:
  text: To ensure notification thresholds and maximum aid intensities are respected, the total
    amount of State aid granted for the activity/project must be taken into account regardless
    of funding source (local, regional, national, EU); centrally-managed EU funding not controlled
    by the Member State is excluded from this calculation provided total public funding does
    not exceed the most favourable EU financing rate for the same eligible costs.
  quote: Afin de s’assurer que les seuils de notification individuels et les intensités d’aide
    maximales sont respectés, il convient de tenir compte du montant total d'aides d’Etat
    accordées en faveur de l'activité ou du projet considéré, que ces aides proviennent de
    sources locales, régionales, nationales ou européennes.
  source:
    file: ademe_regime_exempte_sa59358.pdf
    locator: ademe_regime_exempte_sa59358.pdf#p.11
  verified: llm_cited
application:
  channel: Written application (letter or electronic) or submission of a candidature dossier
    to a call for projects/expressions of interest to ADEME, followed by a financing decision
    or convention.
  typical_timeline: Payment must occur within sixty days from receipt of the complete payment
    request; beneficiary has six months after the contractual end of the operation to submit
    financial elements for payment of balance.
  quote: La demande d’aide financière à l’ADEME est formalisée par l’envoi d’un courrier (papier
    ou électronique) ou par le dépôt d’un dossier de candidature.
  source:
    file: ademe_regime_exempte_sa59358.pdf
    locator: ademe_regles_generales_attribution_aides_2014.pdf#p.8
  verified: llm_cited
