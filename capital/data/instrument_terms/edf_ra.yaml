cumulation:
  text: Financial intermediaries and final beneficiaries under the InvestEU defence equity
    facility must be established in the EU or EDF Associated Countries and must not be controlled
    by non-associated third-country entities, with limitations on technology transfer to non-EU/non-associated
    entities.
  quote: both financial intermediaries and final beneficiaries will have to be established
    in the EU or EDF Associated Countries, and must not be controlled by entities from non-associated
    third countries
  source:
    file: edf_work_programme_2025_partII.pdf
    locator: edf_work_programme_2025_partII.pdf#p.38
  verified: llm_cited
application:
  channel: Competitive calls for proposals published by the European Commission, evaluated
    via consortium submissions; some actions implemented under indirect management by the
    European Defence Agency via Contribution Agreements.
  typical_timeline: Annual work programme calls launched yearly (2025/2026); some calls (EDF-DA-EXP)
    have shortened submission and evaluation timeframes while EDF-DA-ACC uses standard timeframe
    with faster evaluation.
  quote: Grants will be awarded to consortia after the evaluation of the proposals submitted
    following the publication of calls for proposals.
  source:
    file: edf_work_programme_2025_partII.pdf
    locator: edf_work_programme_2025_partII.pdf#p.41
  verified: llm_cited
