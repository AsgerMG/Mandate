obligations:
- requirement: Financial support to third parties (FSTP) is capped at a maximum of EUR 60,000
    per third party and must not exceed 5% of the requested EU contribution under the topic.
  quote: 'The maximum amount to be granted to each third party is EUR 60 000.

    • FSTP in the proposals must not exceed 5% of the requested EU contribution under the
    call topic concerned.'
  source:
    file: edf_work_programme_2025_partII.pdf
    locator: edf_work_programme_2026.pdf#p.40
  verified: llm_cited
- requirement: 'No-profit rule: potential revenue generated by development actions after EU
    financing is not taken into consideration in the grant calculation.'
  quote: 'No profit rule: To ensure the continuity of the development actions after the period
    of EU financing provided for in the grant, potential revenue to be generated by these
    actions will not be taken into consideration in accordance with point (a) of Article 195(3)
    of the Financial Regulation.'
  source:
    file: edf_work_programme_2025_partII.pdf
    locator: edf_work_programme_2026.pdf#p.40
  verified: llm_cited
- requirement: Where Member States or EDF Associated Countries have co-financed a consortium,
    all legal entities of the selected consortium must provide those states rights to use
    the action's results for defence purposes.
  quote: all legal entities of the selected consortium are expected to provide such Member
    States or EDF associated countries with rights to use or have used the results generated
    during the action for their defence purposes
  source:
    file: edf_work_programme_2025_partII.pdf
    locator: edf_work_programme_2026.pdf#p.40
  verified: llm_cited
- requirement: Indirect eligible costs must be determined by applying a flat rate of 25% of
    total direct eligible costs, excluding subcontracting and third-party support costs.
  quote: Indirect eligible costs shall be determined by applying a flat rate of 25% of the
    total direct eligible costs, excluding direct eligible costs for subcontracting and financial
    support to third parties and any unit costs or lump sums that include indirect costs.
  source:
    file: edf_work_programme_2025_partII.pdf
    locator: edf_work_programme_2025_partII.pdf#p.41
  verified: llm_cited
- requirement: The overall increase in baseline funding rate via bonuses cannot exceed 35%
    of total eligible costs of the activity.
  quote: The overall increase in the baseline-funding rate following the application of the
    increase of funding rates listed in Table 2 cannot exceed 35% of the total eligible costs
    of the activity.
  source:
    file: edf_work_programme_2025_partII.pdf
