obligations:
- requirement: The application file must include company details, size classification, organisational
    chart, last 2 years' annual accounts, project description with dates, economic potential,
    eligible cost list, aid amount requested, business plan and financing plan showing own
    funds.
  quote: le nom et la description de l’entreprise ; la taille de l’entreprise, conformément
    à l’annexe I du règlement (UE) n° 651/2014  ; l’organigramme de l’entreprise ; les comptes
    annuels clôturés des 2 derniers exercices fiscaux de l’entreprise requérante
  source:
    file: satr_lu_rnd_guichet_aides_rdi.html
    locator: chunk 2
  verified: llm_cited
- requirement: For collaboration bonus eligibility, research and knowledge-dissemination organisations
    must bear at least 10% of eligible costs and have the right to publish their own research
    results.
  quote: 'Ces organismes doivent : supporter au moins 10 % des coûts admissibles ;  et avoir
    le droit de publier les résultats de leurs propres recherches.'
  source:
    file: satr_lu_rnd_guichet_aides_rdi.html
    locator: chunk 3
  verified: llm_cited
