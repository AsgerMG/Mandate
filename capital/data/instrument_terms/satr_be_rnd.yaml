    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 6, Art. 34
  verified: llm_cited
- id: g3-plafond-conseil-innovation
  gate_family: G3_financial
  requirement: Innovation advisory service subsidies for a given SME are capped at EUR 200,000
