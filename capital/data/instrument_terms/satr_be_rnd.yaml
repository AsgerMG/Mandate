  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 9, Art. 57
  verified: llm_cited
- id: g4-avance-recuperable
  gate_family: G4_borrower_model
  requirement: For industrial research/experimental development aid to enterprises, funding
    may take the form of a recoverable advance repaid based on commercial success against
