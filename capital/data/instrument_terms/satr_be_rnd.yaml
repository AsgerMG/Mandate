    locator: be_wallonie_agw_rdi_application.html#chunk 6, Art. 44
  verified: llm_cited
- id: g3-intensite-recherche-industrielle-centres
  gate_family: G3_financial
  requirement: Subsidy intensity for industrial research/experimental development projects
