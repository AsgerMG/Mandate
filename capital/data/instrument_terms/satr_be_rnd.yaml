- id: g2-jei-definition
  gate_family: G2_size_ownership
  requirement: Young innovative company subsidy requires the beneficiary to qualify as a 'jeune
    entreprise innovante' at the time of grant, verified by independent experts or external
    accountants.
  value: jeune entreprise innovante status required
  intake_field: foundedYear
  quote: Le Gouvernement peut accorder une subvention à une entreprise qui est une jeune entreprise
    innovante à la date de l'octroi de cette subvention
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 7, Art. 40
  verified: llm_cited
- id: g2-once-only-jei
  gate_family: G2_size_ownership
  requirement: A young innovative company may benefit from this type of subsidy only once.
  value: one-time only per company
  intake_field: none
  quote: Une jeune entreprise innovante ne peut bénéficier qu'une seule fois d'une subvention
    que vise la présente section.
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 7, Art. 44
  verified: llm_cited
- id: g2-difficulty-exclusion
  gate_family: G2_size_ownership
  requirement: No aid under the decree may be granted to a firm in difficulty within the meaning
    of EU State aid rescue and restructuring guidelines.
  value: firm in difficulty excluded
  intake_field: lossesOverHalfCapital
  quote: Aucune des aides que vise le présent décret ne peut être accordée à une entreprise
    en difficulté au sens des lignes directrices de l'Union européenne relatives aux aides
    d'État au sauvetage et à la restructuration d'entreprises en difficulté.
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 15, Art. 116
  verified: llm_cited
- id: g3-intensite-jei
  gate_family: G3_financial
  requirement: Subsidy intensity for young innovative companies can reach up to 100% of eligible
