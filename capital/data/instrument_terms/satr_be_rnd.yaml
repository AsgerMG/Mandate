  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 6, Art. 28
  verified: llm_cited
- id: g4-dispense-remboursement
  gate_family: G4_borrower_model
  requirement: Full waiver of repayment of the recoverable advance is possible if the enterprise
