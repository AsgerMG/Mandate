  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 10, Art. 68
  verified: llm_cited
- id: g3-intensite-etude-faisabilite
  gate_family: G3_financial
  requirement: Feasibility study subsidy intensity varies from 40% to 75% depending on enterprise
