  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 6, Art. 31
  verified: llm_cited
- id: g5-effet-incitatif
  gate_family: G5_use_of_funds
  requirement: Aid may only be granted for projects that have not started before the aid application
    was submitted, to ensure incentive effect.
  value: project must not have started before application
  intake_field: developmentStage
  quote: Si le projet pour lequel une aide est sollicitée n'a pas commencé avant l'introduction
    de la demande, l'effet incitatif est automatiquement présent pour les mesures d'aides
    suivantes
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_agw_rdi_application.html#chunk 6, Art. 44
  verified: llm_cited
- id: g5-depenses-jei
  gate_family: G5_use_of_funds
  requirement: The young innovative company subsidy may cover expenses of any nature.
  value: any type of expense eligible
  intake_field: none
  quote: La subvention peut couvrir des dépenses de toute nature.
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 7, Art. 43
  verified: llm_cited
- id: g5-depenses-recherche-industrielle
  gate_family: G5_use_of_funds
  requirement: Eligible expenses for industrial research/experimental development subsidies
    cover personnel, instruments/materials, contract research, and overheads directly linked
    to project realisation.
  value: personnel, equipment, contract research, overheads
  intake_field: none
  quote: les dépenses de personnel relatives aux chercheurs, techniciens et autres personnels
    d'appui, dans la mesure où ils sont affectés à la réalisation du projet
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 9, Art. 62
  verified: llm_cited
- id: g6-cumul-interdit
  gate_family: G6_conditionality
  requirement: No eligible expense under the decree may be covered by more than one aid under
    the decree.
  value: no double funding of same expense within decree
  intake_field: conditionality
  quote: Aucune dépense admissible que vise le présent décret ne peut être couverte par plus
    d'une aide que vise le présent décret.
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 14, Art. 112
  verified: llm_cited
- id: g6-cumul-autre-aide-regionale
  gate_family: G6_conditionality
  requirement: Except for popularisation subsidies, no eligible expense can be covered simultaneously
    by decree aid and another Walloon Region aid or another Belgian public entity's aid.
  value: no cumulation with other Belgian public aid on same expense
  intake_field: conditionality
  quote: aucune dépense admissible que vise le présent décret ne peut être couverte à la fois
    par une aide que vise le présent décret et par une aide de la Région wallonne autre que
    celles que vise le présent décret
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 15, Art. 113
  verified: llm_cited
- id: g6-post-jei-restrictions
  gate_family: G6_conditionality
  requirement: For three years after receiving a young innovative company subsidy, the Government
    may only grant that company other decree aids, EU-approved/exempted R&D aids, or capital-investment
    aid.
  value: restricted follow-on aid types for 3 years post-JEI subsidy
  intake_field: conditionality
  quote: Pendant les trois années qui suivent la date d'octroi à une jeune entreprise innovante
    d'une subvention que vise la présente section, le Gouvernement peut seulement lui accorder
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 7, Art. 45
  verified: llm_cited
obligations:
- requirement: The beneficiary must submit activity reports, expenditure statements, and scientific/technical
    reports during project implementation.
  quote: des rapports d'activités, accompagnées du relevé des dépenses afférentes à la période
    à laquelle ils se rapportent
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_agw_rdi_application.html#chunk 9, Art. 71
  verified: llm_cited
- requirement: The convention governing aid must cover repayment terms, eligible expenses,
    confidentiality obligations, IP arrangements, and control modalities.
  quote: les obligations de secret et de confidentialité
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_agw_rdi_application.html#chunk 7, Art. 54
  verified: llm_cited
- requirement: An enterprise exploiting project results must make periodic repayments to the
    Walloon Region with interest at the EU reference rate.
  quote: Dans tous les cas, les remboursements sont augmentés d'un intérêt dont le taux est
    égal au taux de référence fixé par la Commission européenne.
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 6, Art. 28
  verified: llm_cited
