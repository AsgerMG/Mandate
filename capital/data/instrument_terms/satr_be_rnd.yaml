  value: recoverable advance (avance récupérable) with success-based repayment
  intake_field: borrowerModel
  quote: Le montant global à rembourser est fonction de la réussite du projet par rapport
    à l'issue favorable définie, notamment en termes d'objectifs commerciaux, dans les dispositions
