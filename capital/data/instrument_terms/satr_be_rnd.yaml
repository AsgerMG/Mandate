  value: up to 100%
  intake_field: turnoverBand
  quote: L'intensité de la subvention, exprimée en pourcentage des dépenses admissibles avant
    impôts ou autres prélèvements, peut atteindre 100.
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 7, Art. 42
  verified: llm_cited
- id: g3-plafond-jei
  gate_family: G3_financial
  requirement: The maximum amount of the young innovative company subsidy is EUR 500,000.
  value: EUR 500,000 max
  intake_field: ticketBand
  quote: Son montant s'élève au maximum à 500.000 euros.
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 7, Art. 43
  verified: llm_cited
- id: g3-plafond-de-minimis-effet-incitatif
  gate_family: G3_financial
