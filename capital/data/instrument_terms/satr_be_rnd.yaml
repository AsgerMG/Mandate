- id: g3-intensite-brevets
  gate_family: G3_financial
  requirement: Subsidy intensity for patent-related expenses can reach up to 100% for universities/high
    schools and approved research centres.
  value: up to 100%
  intake_field: cofinancingBand
  quote: L'intensité de la subvention, exprimée en pourcentage des dépenses admissibles avant
