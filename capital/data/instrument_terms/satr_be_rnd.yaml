- id: g2-taille-pe-me
  gate_family: G2_size_ownership
  requirement: Aid for technical feasibility studies is restricted to small enterprises, medium
    enterprises, or small non-autonomous enterprises.
  value: small/medium enterprise or small non-autonomous enterprise
  intake_field: fteBand
  quote: introduite par une petite entreprise, par une moyenne entreprise ou par une entreprise
