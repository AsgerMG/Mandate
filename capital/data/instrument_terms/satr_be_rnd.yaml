    Region.
  value: waiver conditional on written justification and rights transfer
  intake_field: borrowerModel
  quote: elle motive sa renonciation, dans un écrit adressé au Gouvernement, en exposant l'échec
    du projet au regard des objectifs techniques et commerciaux définis dans les dispositions
    contractuelles, relatives au projet, qui la lient à la Région wallonne
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 6, Art. 27
  verified: llm_cited
- id: g4-no-real-rights
