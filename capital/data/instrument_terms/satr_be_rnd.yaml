cumulation:
  text: Cumulation with aid from foreign, international or supranational public entities is
    permitted, but the total aid is taken into account for respecting the maximum intensity
    ceiling set by the decree.
  quote: Toute dépense admissible que vise le présent décret peut être couverte à la fois
    par une aide que vise le présent décret et par une ou plusieurs autres aides accordées
    par une entité publique étrangère, internationale ou supranationale. Dans ce cas, l'ensemble
    des aides sont prises en considération pour le respect de l'intensité maximale que vise
    le présent décret
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_decret_rdi_2008_wallex.html#chunk 15, Art. 115
  verified: llm_cited
application:
  channel: Applications submitted to the Walloon Administration either via calls for projects
    (appels à projets) or directly outside calls, with a working language of French or German.
  typical_timeline: Total time from acknowledgment of receipt to notification of the reasoned
    proposal to the Minister may not exceed five months (or three months for the standard
    procedure); jury must convene within six months after the project deadline for calls.
  quote: Le délai total entre la date de l'accusé de réception du projet et l'information
    au promoteur de la proposition motivée qui est adressée au Ministre ne peut dépasser trois
    mois.
  source:
    file: be_wallonie_decret_rdi_2008_wallex.html
    locator: be_wallonie_agw_rdi_application.html#chunk 8, Art. 57
  verified: llm_cited
