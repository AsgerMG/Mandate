- id: g1-target-group
  gate_family: G1_nexus
  requirement: The target group is micro, small, medium and large enterprises, including state capital
    companies and research/knowledge-dissemination organisations, developing products, services and technologies
    in smart-specialisation areas.
  value: Micro/small/medium/large enterprises and R&D orgs in smart-specialisation areas
  intake_field: borrowerModel
  quote: Investīcijas mērķa grupa ir sīkie (mikro), mazie, vidējie un lielie komersanti, tai skaitā valsts
    kapitālsabiedrības un pētniecības un zināšanu izplatīšanas organizācijas, kas attīsta produktus, pakalpojumus
    un tehnoloģijas viedās specializācijas jomās.
