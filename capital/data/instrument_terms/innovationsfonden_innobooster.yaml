obligations:
- requirement: Grant recipient must accept grant requirements electronically within three
    months of the grant letter as a precondition for receiving funding.
  quote: You will receive a grant letter via E-grant and, at the same time, be asked to accept
    the grant require-ments electronically within three months.
  source:
    file: innovationsfonden_innobooster_guidelines_2021.pdf
    locator: p.19
  verified: false
  verify_note: 'fragment not found verbatim: ''You will receive a grant letter via E-grant
    and, a'''
- requirement: Accounts must be submitted every three months throughout the project.
  quote: Accounts must be submitted every three months.
  source:
    file: innovationsfonden_innobooster_guidelines_2021.pdf
    locator: p.19
  verified: llm_cited
- requirement: Grant recipients must submit a mid-term progress report as a PowerPoint presentation
    via E-grant halfway through the project.
  quote: All grant receivers will halfway through the project period also be asked to submit
    a progress report which in a structured and concise form accounts for the status of the
    project, remaining activities and any changes or new perspectives vis-à-vis the project
    goal at the time in question.
  source:
    file: innovationsfonden_innobooster_guidelines_2021.pdf
    locator: p.19
  verified: llm_cited
- requirement: Applicant must inform Innovation Fund Denmark of any significant changes affecting
    the project, and requests for changes must be approved before implementation.
  quote: You must inform Innovation Fund Denmark of any significant changes affecting the
    overall Innobooster project as soon as possible via e.g.Innobooster@innofond.dk or E-grant.
  source:
    file: innovationsfonden_innobooster_guidelines_2021.pdf
    locator: p.20
  verified: llm_cited
- requirement: At project end, recipient must submit final accounts, an evaluation, and a
    short final report within one month of project end.
  quote: At the end of the project, you must – aside from the final accounts – complete an
    evaluation of the pro-cess and produce a short final report. These documents must be submitted
    no later than one month after the end of the project period.
  source:
    file: innovationsfonden_innobooster_guidelines_2021.pdf
    locator: p.20
  verified: false
  verify_note: 'fragment not found verbatim: ''At the end of the project, you must – aside
    from t'''
- requirement: Innovation Fund Denmark retains 15 per cent of the grant until final documentation
    is approved.
  quote: We always retain 15 per cent of your grant until this stage regardless of your expenditure
    level up until the last accounting period.
  source:
    file: innovationsfonden_innobooster_guidelines_2021.pdf
    locator: p.20
  verified: llm_cited
- requirement: Applicant is responsible for the accuracy of all information and attachments
    submitted in the application and must inform the Fund of significant changes including
    funding received from other parties.
  quote: The applicant is under obligation to inform Innovation Fund Denmark of any significant
    changes to the submitted information, including if the company has received funding for
    the project or parts hereof from other parties.
  source:
    file: innovationsfonden_innobooster_guidelines_2021.pdf
    locator: p.23
  verified: llm_cited
