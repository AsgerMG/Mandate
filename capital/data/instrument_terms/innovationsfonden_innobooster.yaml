cumulation:
  text: De minimis aid received by the company from all sources over the current and prior
    two financial years must be aggregated and must not exceed the EUR 200,000 ceiling (or
    lower sector-specific ceilings for agriculture/fisheries); accumulated Innobooster investments
    across grants are also assessed together for evaluation purposes.
  quote: In addition, any other de minimis aid received by the company from other schemes
    within a three-year period must be included in the maximum aid amount.
  source:
    file: innovationsfonden_innobooster_guidelines_2021.pdf
    locator: p.9
  verified: llm_cited
application:
  channel: Online application via the E-grant electronic application system, choosing between
    the two Innobooster investment pools (DKK 50,000-1.5 mill. or DKK 1.5-5 mill.)
  typical_timeline: Applications processed on a rolling/ongoing basis; possible application
    pauses in December/January; processing time varies and is published on the Fund's website;
    may include a clarification interview or panel pitch which extends processing time.
  quote: You must complete and submit your application online via the electronic application
    system E-grant.
  source:
    file: innovationsfonden_innobooster_guidelines_2021.pdf
    locator: p.12
  verified: llm_cited
