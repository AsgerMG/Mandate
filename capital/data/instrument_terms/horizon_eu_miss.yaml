    two different EU actions, though combination with EU operating grants is possible if costs
    are clearly separated.'
  quote: 'There is strict prohibition of double funding from the EU budget. Any given action

    may receive only ONE grant from the EU budget (except for EU Synergy grants) and same
    costs

    may under NO circumstances be declared to two different EU actions.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
application:
  channel: EU Funding & Tenders Portal electronic submission system
  typical_timeline: 'Evaluation outcome around 5 months from submission deadline; grant agreement
    signature around 8 months from submission deadline (for two-stage calls: ~3 months for
    stage 1 result, ~5 months for stage 2 result, ~8 months from stage 2 deadline for signature).'
  quote: 'information on the outcome of the evaluation: around 5 months from the deadline
    for

    submission;

    – indicative date for the signing of grant agreements: around 8 months from the deadline

    for submission.'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.31
