obligations:
- requirement: Participants must conclude a consortium agreement in line with the Chips JU
    Model Grant Agreement.
  quote: 'participants are required to conclude a

    consortium agreement.'
  source:
    file: chips_ju_mawp_2023_2027_main.pdf
    locator: chips_ju_mawp_general_annexes.pdf#p.16
  verified: llm_cited
- requirement: Beneficiaries must ensure their projects are not subject to national/third-country
    security requirements that could affect implementation, and must notify the granting authority
    immediately of potential security issues.
  quote: 'Beneficiaries must ensure that their projects are not subject to national/third-country
    security

    requirements that could affect implementation or put into question the award of the grant'
  source:
    file: chips_ju_mawp_2023_2027_main.pdf
    locator: chips_ju_mawp_general_annexes.pdf#p.12
  verified: llm_cited
- requirement: Each beneficiary and affiliated entity must sign a declaration of honour confirming
    compliance with EU funding conditions before grant signature.
  quote: 'Before signing the grant, each beneficiary and affiliated entity will have to confirm
    this again by signing a

    declaration of honour (DoH).'
  source:
    file: chips_ju_mawp_2023_2027_main.pdf
    locator: chips_ju_mawp_general_annexes.pdf#p.9
  verified: llm_cited
- requirement: For foreign-controlled entities, guarantees must demonstrate that results of
    the action remain within the beneficiary and are not subject to control or restrictions
    by non-eligible third countries during and after the action for a specified period, and
    that export restrictions apply for at least 4 years for EU/Associated Country entities
    controlled from a third country.
  quote: 'the results of the action shall remain within the beneficiary and shall not be subject
    to

    control or restrictions by non-eligible third countries or other non-eligible third country

    entities during the action and for a specified period after its completion.'
  source:
