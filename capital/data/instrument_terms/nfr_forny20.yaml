obligations:
- requirement: TTOs must report to FORNY on aggregated results from their research institutions
    across a range of indicators relevant to the programme (e.g. capital raised, finished
    products, licensing contracts, patents sought), since individual projects do not report
    directly.
  quote: I FORNY rapporterer ikke prosjektene selv på resultater, men hver TTO sender inn
    samlede resultater fra sine forskningsinstitusjoner på en rekke indikatorer som er relevante
    for programmet.
  source:
    file: nfr_forny20_programplan_2019.pdf
    locator: nfr_forny20_programplan_2019.pdf#p.11
  verified: llm_cited
- requirement: Applications are assessed exclusively by external experts with relevant experience
    related to each specific application.
  quote: I vurderingen av søknadene bruker Forskningsrådet utelukkende eksterne eksperter
    som har relevant erfaring knyttet til hver enkelt søknad.
  source:
    file: nfr_forny20_programplan_2019.pdf
    locator: nfr_forny20_programplan_2019.pdf#p.8
  verified: llm_cited
