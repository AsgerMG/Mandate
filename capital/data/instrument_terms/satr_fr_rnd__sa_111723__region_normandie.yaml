- id: g1-consortium-sme
  gate_family: G1_nexus
  requirement: At least one SME must be among the partner enterprises, together with one or more research
    and knowledge-dissemination organisations.
  value: Min 1 SME + 1 research/knowledge org among partners
  intake_field: consortium
  quote: Au moins une PME parmi les entreprises partenaires, avec un ou plusieurs organismes de recherche
    et de diffusion des connaissances.
  source:
    file: https://les-aides.fr/aide/ZxZf3w/region-normandie/soutien-a-l-innovation-en-collaboration.html
