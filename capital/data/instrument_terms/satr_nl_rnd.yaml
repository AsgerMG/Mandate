cumulation:
  text: Contributions from municipalities, provinces, water boards, public bodies under the
    Joint Regulations Act, or other administrative bodies are treated as public co-financing
    and are disregarded when calculating the maximum amount that may be granted per application
    under this title.
  quote: Bijdragen van gemeenten, provincies, waterschappen, openbare lichamen als bedoeld
    in artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen, of andere bestuursorganen,
    worden aangemerkt als publieke cofinanciering, en blijven bij de toepassing van artikel
    6, eerste lid, van het besluit buiten beschouwing voor zover het de berekening betreft
    van het maximumbedrag dat krachtens deze titel per aanvraag kan worden verstrekt.
  source:
    file: nl_rnes_wetten_overheid_2023.html
    locator: nl_rnes_wetten_overheid_2023.html#chunk 41
  verified: false
application:
