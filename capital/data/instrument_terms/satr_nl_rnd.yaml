    title of the Regeling nationale EZK- en LNV-subsidies, subject to allocation method and,
    where applicable, advisory committee review.
  typical_timeline: 8 to 22 weeks after receipt of application or after the closing date of
    the application period, depending on allocation method and presence of public co-financing.
  quote: Onze Minister geeft een beschikking op een aanvraag om subsidie binnen de in onderstaande
    tabel aangegeven termijn of, indien geen subsidieplafond is vastgesteld, een bij ministeriële
    regeling bepaalde termijn.
