cumulation:
  text: Aid under the scheme can be cumulated with other state aid only if concerning other
    identifiable eligible costs; it cannot be cumulated with any other state aid or de minimis
    aid concerning the same, wholly or partially overlapping eligible costs; and when checking
    maximum intensity and notification ceilings, total state aid per undertaking and project
    is considered regardless of funding source (local, regional, national, or EU).
  quote: Pomoc poskytnutá podľa tejto schémy sa môže kumulovať s akoukoľvek inou štátnou pomocou,
    pokiaľ sa dané pomoci týkajú iných identifikovateľných oprávnených výdavkov.
  source:
    file: satr_sk_rnd_component9_scheme.pdf
    locator: satr_sk_rnd_component9_scheme.pdf#p.16
  verified: llm_cited
application:
  channel: Applications are submitted in response to calls (výzva) published by the provider
    (Úrad vlády SR) on www.vaia.gov.sk, in accordance with the scheme, and assessed by the
    provider or implementer (Výskumná agentúra or Ministerstvo hospodárstva SR).
  typical_timeline: The scheme's validity and effect end on 30 June 2026; the PPM contract
    or amendment must take effect by that date.
  quote: Poskytovateľ zverejní výzvu na webovom sídle www.vaia.gov.sk. Výzva obsahuje odkaz
    na úplné znenie tejto schémy, zverejnené v Obchodnom vestníku.
  source:
    file: satr_sk_rnd_component9_scheme.pdf
    locator: satr_sk_rnd_component9_scheme.pdf#p.16
  verified: llm_cited
