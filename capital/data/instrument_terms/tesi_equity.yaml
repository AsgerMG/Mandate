  verified: llm_cited
- requirement: Portfolio companies are expected to engage with responsible investment and
    sustainability practices promoted through Tesi's active ownership.
  quote: We share best practices throughout the market and strive to promote sustainable practices
    in our investment targets through active ownership.
  source:
    file: tesi_equity_our_approach.html
