obligations:
- requirement: Tesi aims to maximize its impact on society and returns on its investments,
    requiring at least half of capital in a round to be private.
  quote: We aim to maximize our impact on the society and returns for our investments. The
    share of private capital must be at least half, and we aim for returns on our investments.
  source:
