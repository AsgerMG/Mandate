application:
  channel: Applications for fund management teams were submitted via an open call for expression
    of interest published on the EIF website; underlying businesses apply directly to the
    selected intermediary fund managers, not to HDB/EquiFund directly.
  typical_timeline: The call for fund managers ran from 28.12.2016 with a submission deadline
    of 1 March 2017; ongoing business investments occur continuously through the selected
    fund managers.
  quote: Η διαδικασία επιλογής διεξήχθη μέσω ανοιχτής πρόσκλησης για εκδήλωση ενδιαφέροντος,
    η οποία αναρτήθηκε στην ιστοσελίδα του ΕΤαΕ στις 28.12.2016
