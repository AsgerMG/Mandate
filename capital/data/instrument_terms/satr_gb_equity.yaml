    aid amount allowed for that instrument, reducing the residual amount available under other
    instruments.
  value: Mixed instrument proportional cap allocation
  intake_field: none
  quote: 'A beneficiary can receive support through a mix of the aid instruments referred
    to in

    point 3 of GBER Article 23, provided that the proportion of the amount granted

    through one aid instrument, calculated on the basis of the maximum aid amount

