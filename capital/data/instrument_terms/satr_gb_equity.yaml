- id: g4-private-participation-derogation
  gate_family: G4_borrower_model
  requirement: For SMEs not fulfilling point 5 conditions, risk finance measures providing
    equity, quasi-equity or loan investments must leverage private financing achieving an
    aggregate private participation rate of at least 60%.
  value: Minimum 60% aggregate private participation rate
  intake_field: borrowerModel
  quote: 'for risk finance measures providing equity, quasi-equity or loan investments to

    eligible undertakings, the measure shall leverage additional financing from

    independent private investors at the level of the financial intermediaries or the SMEs,

    so as to achieve an aggregate private participation rate reaching at least 60 % of the

    risk finance provided to the SMEs.'
  source:
