- id: g4-guarantee-rate-cap
  gate_family: G4_borrower_model
  requirement: For guarantees, the guarantee rate is limited to 80% and total losses assumed
    by a Member State are capped at 25% of the underlying guaranteed portfolio; first loss
    assumed by the public investor in asymmetric loss-sharing is capped at 25% of total investment.
  value: Guarantee rate ≤80%; public first-loss cap 25%
  intake_field: borrowerModel
  quote: 'in the case of asymmetric loss-sharing between public and private investors, the

    first loss assumed by the public investor shall be capped at 25 % of the total

    investment;

    (d) in the case of guarantees falling under point 2(c), the guarantee rate shall be

    limited to 80 % and total losses assumed by a Member State shall be capped at a

    maximum of 25 % of the underlying guaranteed portfolio.'
  source:
