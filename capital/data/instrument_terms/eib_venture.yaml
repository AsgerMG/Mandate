cumulation:
  text: EIB venture debt is generally accompanied by co-financing from other sources, predominantly
    the promoter company itself and external corporates, with the EIB financing mobilizing
    additional funds at a ratio of at least 1.4-fold.
  quote: On average, for every euro loaned by the EIB, another EUR 1.37 flows into the financed
    venture debt projects from other sources.
  source:
    file: eib_venture_debt_impact_assessment.pdf
    locator: eib_venture_debt_impact_assessment.pdf#p.15
  verified: llm_cited
application:
  channel: Applicants sign up for an EIB contact account and apply directly to the EIB Venture
    Debt team.
  typical_timeline: Median time to disbursement following signature is approximately 3 months.
  quote: Sign up for a contact account to send all inquiries directly to our Venture Debt
    team. Once signed up, your company can get in touch with us, make a general enquiry or
    apply for venture debt financing.
  source:
    file: eib_venture_debt_impact_assessment.pdf
    locator: eib_venture_debt_page.html#chunk 2
  verified: llm_cited
