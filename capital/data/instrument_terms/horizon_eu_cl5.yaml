gates:
- id: g1-entity-establishment
  gate_family: G1_nexus
  requirement: Applicants must be established in a Member State, Associated Country, or eligible
    third country to be eligible for EU funding.
  value: Member States, outermost regions, and listed third countries
  intake_field: entityCountries
  quote: 'To be eligible for funding, applicants must be established in one of the following
    countries:'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russia-belarus-exclusion
  gate_family: G1_nexus
  requirement: Legal entities established in Russia, Belarus, or non-government controlled
    territories of Ukraine are not eligible to participate in any capacity.
  value: 'Excluded: Russia, Belarus, non-government controlled Ukraine territories'
  intake_field: entityCountries
  quote: such legal entities are not eligible to participate in any capacity. This includes
    participation as beneficiaries, affiliated entities, associated partners, third parties
    giving in-kind contributions, subcontractors or recipients of financial support to third
    parties (if any).
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russia-ownership-exclusion
  gate_family: G1_nexus
  requirement: Legal entities established outside Russia that are more than 50% owned, directly
    or indirectly, by a Russia-established person/entity are not eligible to participate.
  value: '>50% Russian ownership excluded'
  intake_field: nonEuControl
  quote: legal entities established outside Russia whose proprietary rights are directly or
    indirectly owned for more than 50% by a legal person, entity or body established in Russia
    are also not eligible to participate in any capacity.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-hungary-trust-exclusion
  gate_family: G1_nexus
  requirement: Hungarian public interest trusts established under Hungarian Act IX of 2021
    (or entities they maintain) are not eligible for any funded role due to rule-of-law measures.
  value: 'Excluded: Hungarian public interest trusts under Act IX/2021'
  intake_field: entityCountries
  quote: such entities are not eligible to participate in any funded role (beneficiaries,
    affiliated entities, subcontractors, recipients of financial support to third parties,
    etc.).
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-china-miit-university-exclusion
  gate_family: G1_nexus
  requirement: Chinese universities administered by or under supervision of the Ministry of
    Industry and Information Technology (MIIT) are not eligible to participate in any action.
  value: 'Excluded: MIIT-administered Chinese universities'
  intake_field: entityCountries
  quote: universities (higher education establishments) established in China which are public
    bodies, that are administered by or fall under the supervision of the Ministry of Industry
    and Information Technology (MIIT) are not eligible to participate in any action under
    all parts of this Work Programme.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-china-ia-ria-exclusion
  gate_family: G1_nexus
  requirement: For IA and RIA actions covered by the restriction, legal entities established
    in China are excluded from participation in any capacity.
  value: 'Excluded: Chinese entities in specified IA/RIA actions'
  intake_field: entityCountries
  quote: this includes participation of legal entities established in China in any capacity
    (as beneficiaries, affiliated entities, associated partners, third parties giving in-kind
    contributions, subcontractors or recipients of financial support to third parties (if
    any)).
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-5g-highrisk-supplier-exclusion
  gate_family: G1_nexus
  requirement: Entities assessed as high-risk suppliers of mobile network communication equipment
    (and entities they own/control) are not eligible in actions concerning European communication
    network technologies.
  value: 'Excluded: high-risk 5G/communications suppliers'
  intake_field: entityCountries
  quote: Entities that are assessed as high-risk suppliers of mobile network communication
    equipment (and any entities they own or control) are not eligible to participate as beneficiaries,
    affiliated entities and associated partners.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.9
  verified: llm_cited
- id: g1-strategic-restriction
  gate_family: G1_nexus
  requirement: For actions related to EU strategic assets, interests, autonomy or security,
    participation may be limited to legal entities established in EU Member States (and specified
    associated/non-associated countries) as defined per call.
  value: Restricted to EU Member States / specified countries per call
  intake_field: entityCountries
  quote: the specific call/topic conditions may limit participation to legal entities established
    only in EU Member States or in EU Member States and specific associated or non-associated
    third countries.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.9
  verified: llm_cited
- id: g2-consortium-composition
  gate_family: G2_size_ownership
  requirement: Unless otherwise stated, a consortium must include at least three independent
    legal entities each established in a different Member State/Associated Country, with at
    least one in a Member State.
  value: Minimum 3 independent entities, 3 different countries, ≥1 in a Member State
  intake_field: consortium
  quote: 'the consortium includes, as beneficiaries, three legal entities independent from
    each other and each established in a different country as follows:'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.13
  verified: llm_cited
- id: g2-affiliated-entity-independence
  gate_family: G2_size_ownership
  requirement: Affiliated entities do not count toward the minimum consortium eligibility
    criteria since they do not sign the grant agreement.
  value: Affiliated entities excluded from consortium minimum count
  intake_field: consortium
  quote: As affiliated entities do not sign the grant agreement, they do not count towards
    the minimum eligibility criteria for consortium composition (if any).
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g2-pcp-ppi-public-procurer-count
  gate_family: G2_size_ownership
  requirement: PCP/PPI actions require at least three independent legal entities as beneficiaries,
    of which a minimum of two must be independent public procurers established in different
    Member States/Associated Countries with at least one in a Member State.
  value: Min. 3 entities incl. 2 public procurers, different countries
  intake_field: consortium
  quote: out of which a minimum of two beneficiaries must be independent legal entities that
    are public procurers, each established in a different Member State or Associated Country
    and with at least one of them established in a Member State.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: false
  verify_note: 'fragment not found verbatim: ''out of which a minimum of two beneficiaries
    must b'''
- id: g4-grant-mechanism
  gate_family: G4_borrower_model
  requirement: Horizon Europe CL5 funding is delivered as a grant (or other forms such as
    prizes, PCP/PPI procurement, operating grants), not a loan or equity instrument.
  value: Grant / non-repayable funding instrument
  intake_field: borrowerModel
  quote: To become a beneficiary, legal entities must be eligible for funding.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g4-lumpsum-option
  gate_family: G4_borrower_model
  requirement: Grants may be awarded on a lump sum basis, requiring a detailed budget table
    complying with actual cost eligibility rules as the basis for the lump sum amount.
  value: Lump sum grant possible, subject to budget table
  intake_field: borrowerModel
  quote: For lump sum grant proposals, the estimated budget must be described in a detailed
    budget table. This will be used as a basis for justifying and/or fixing the lump sum amount.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.28
  verified: llm_cited
- id: g5-civil-applications-only
  gate_family: G5_use_of_funds
  requirement: Projects must focus exclusively on civil applications and must not pursue human
    cloning, heritable genetic modification, or creation of human embryos solely for research.
  value: Civil applications only; prohibited activities excluded
  intake_field: none
  quote: 'Projects must focus exclusively on civil applications and must not: – aim at human
    cloning for reproductive purposes;'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g5-eligible-activities-topic-match
  gate_family: G5_use_of_funds
  requirement: Funded activities must correspond, wholly or in part, to the topic description
    under which the application is submitted.
  value: Activity must match call/topic description
  intake_field: none
  quote: Applications will only be considered eligible if their content corresponds, wholly
    or in part, to the topic description for which it is submitted.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.13
  verified: llm_cited
- id: g5-no-profit-rule
  gate_family: G5_use_of_funds
  requirement: Grants may not generate a profit, i.e., a surplus of revenues plus EU grant
    over costs, checked at project end.
  value: No profit allowed from grant funding
  intake_field: none
  quote: Grants may NOT give a profit (i.e. surplus of revenues + EU grant over costs). This
    will be checked by the granting authority at the end of the project.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
- id: g6-exclusion-situations
  gate_family: G6_conditionality
  requirement: Applicants subject to EU administrative sanctions or exclusion situations (e.g.
    bankruptcy, winding up) cannot participate.
  value: Excluded if under EU sanctions or insolvency-type situations
  intake_field: none
  quote: bankruptcy, winding up, affairs administered by the courts, arrangement with creditors,
    suspended business activities or other similar procedures (including procedures for persons
    with unlimited liability for the applicant's debts);
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.22
  verified: llm_cited
- id: g6-no-double-funding
  gate_family: G6_conditionality
  requirement: An action may receive only one grant from the EU budget (except Synergy grants),
    and the same costs may not be declared to two different EU actions.
  value: No double funding of same costs/action
  intake_field: cofinancingBand
  quote: Any given action may receive only ONE grant from the EU budget (except for EU Synergy
    grants) and same costs may under NO circumstances be declared to two different EU actions.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
- id: g6-completed-projects-rejected
  gate_family: G6_conditionality
  requirement: Applications for projects that have already been completed will be rejected;
    ongoing projects are assessed case-by-case with no retroactive cost reimbursement.
  value: Completed projects ineligible; started projects assessed case-by-case
  intake_field: developmentStage
  quote: Applications for projects that have already been completed will be rejected. Applications
    for projects that have already started will be assessed on a case-by-case basis (in such
    cases, no costs can normally be reimbursed for activities that took place before the application
    was submitted).
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.37
  verified: llm_cited
- id: g6-gender-equality-plan
  gate_family: G6_conditionality
  requirement: Public bodies, research organisations and higher education establishments from
    Member States/Associated Countries must have a gender equality plan meeting minimum requirements
    at grant signature and throughout the grant duration to be eligible.
  value: Mandatory gender equality plan for public/research/HEI applicants
  intake_field: institutionalBacking
  quote: legal entities from Member States and Associated Countries that are public bodies,
    research organisations or higher education establishments (including private research
    organisations and private higher education establishments) applying as beneficiaries or
    affiliated entities must have at the moment of grant signature and during the duration
    of the grant a gender equality plan
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.18
  verified: llm_cited
obligations:
- requirement: Applicants must include a plan for exploitation and dissemination of results,
    including communication activities, with certain elements depending on expected commercial
    exploitation.
  quote: Applications must include a plan for the exploitation and dissemination of results
    including communication activities, unless provided otherwise in the specific call/topic
    conditions.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.4
  verified: llm_cited
- requirement: Beneficiaries must take all measures to promote equal opportunities between
    men and women in implementing the action.
