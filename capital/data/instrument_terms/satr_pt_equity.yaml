obligations:
- requirement: Beneficiaries under 'Inovação Produtiva' must maintain jobs created at the
    operation's location for a minimum of three years from hiring, and must not reduce the
    total number of employees during operation execution.
  quote: a manutenção dos postos de trabalho, criados nos termos previstos no n.º 5 do artigo
    anterior, na localização da operação, durante um período mínimo de três anos a contar
    da data da respetiva contratação, não podendo ainda o beneficiário, durante a execução
    da operação, reduzir o número total de trabalhadores ao serviço da empresa
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.13
  verified: llm_cited
- requirement: Beneficiaries under 'Qualificação e Internacionalização das PME' must maintain
    supported jobs for three years from operation completion, though technical staff may be
    replaced with equally qualified personnel.
  quote: a manutenção no beneficiário dos postos de trabalho apoiados, durante três anos a
    partir da data da conclusão da operação, podendo os quadros técnicos contratados ser substituídos,
    desde que por outros com qualificação mínima equivalente
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.16
  verified: llm_cited
- requirement: For diversification of an existing establishment, eligible costs must exceed
    by at least 200% the book value of reused assets as recorded in the fiscal year preceding
    the start of works.
  quote: os custos elegíveis devem exceder em, pelo menos, 200 % o valor contabilístico dos
    ativos que são reutilizados, tal como registado no exercício fiscal que precede o início
    dos trabalhos
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.10
  verified: false
  verify_note: 'fragment not found verbatim: ''os custos elegíveis devem exceder em, pelo
    menos, '''
- requirement: Beneficiaries must comply with the 'do no significant harm' principle requirements
    for construction, remodeling or expansion works and equipment acquisition, including best
