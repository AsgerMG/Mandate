  value: grant or hybrid grant+loan (Financial Instrument)
  intake_field: borrowerModel
  quote: Os incentivos a conceder na tipologia de intervenção «Inovação Produtiva» podem assumir
    a forma de subvenção ou um formato híbrido, integrando uma subvenção e uma componente
