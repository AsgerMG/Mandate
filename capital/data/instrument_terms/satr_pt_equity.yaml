  verified: llm_cited
- id: g2-beneficiary-sme-innovprod
  gate_family: G2_size_ownership
  requirement: Beneficiaries of the 'Inovação Produtiva' intervention must be SMEs (large
    enterprises only eligible for JTF-financed operations under approved Territorial Just
    Transition Plans).
  value: PME (SME); large enterprises only via FTJ/PTTJ
  intake_field: fteBand
  quote: São beneficiárias da tipologia de intervenção «Inovação Produtiva» as PME.
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.10
  verified: llm_cited
- id: g2-beneficiary-qualif
  gate_family: G2_size_ownership
  requirement: Beneficiaries applying individually under 'Qualificação e Internacionalização
    das PME' must be SMEs.
  value: PME (SME)
  intake_field: fteBand
  quote: Nas candidaturas apresentadas individualmente são beneficiárias as PME.
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.15
  verified: llm_cited
- id: g2-not-in-difficulty
  gate_family: G2_size_ownership
  requirement: Applicant must not be an 'undertaking in difficulty' as defined by EU State
    aid rules.
  value: must not be an undertaking in difficulty
  intake_field: lossesOverHalfCapital
  quote: Não ser uma empresa em dificuldade, de acordo com a definição prevista no ponto 18
    do artigo 2.º do Regulamento (UE) n.º 651/2014, da Comissão, de 17 de junho, na sua redação
    atual
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.5
  verified: llm_cited
- id: g2-sme-certification
  gate_family: G2_size_ownership
  requirement: Applicant must present, when applicable, Electronic Certification proving SME
    status at the time of approval.
  value: Electronic SME Certification required where applicable
  intake_field: ownerOver25
  quote: Apresentar, quando aplicável, Certificação Eletrónica que comprove o estatuto PME,
    nos termos previstos no Decreto -Lei n.º 372/2007, de 6 de novembro, na sua redação atual,
    no momento da aprovação
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.5
  verified: llm_cited
- id: g3-balanced-financial-situation
  gate_family: G3_financial
  requirement: 'Applicant must present a balanced economic-financial situation and demonstrate
    financing capacity per Annex III (financial autonomy ratios: ≥0.20 for large enterprises,
    ≥0.15 for SMEs/Small Mid Caps, or positive net equity/financing capacity for non-business
    R&I entities).'
  value: financial autonomy ratio ≥0.15 (SME) / ≥0.20 (large) or equivalent
  intake_field: balanceBand
  quote: Apresentar uma situação económico -financeira equilibrada e demonstrar ter capacidade
    de financiamento da operação, nos termos definidos no anexo III, que constitui parte integrante
    do presente Regulamento
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.5
  verified: llm_cited
- id: g3-min-own-financing-25pct
  gate_family: G3_financial
  requirement: For 'Inovação Produtiva' operations, at least 25% of eligible costs must be
    financed through own or third-party resources excluding any State financial support.
  value: ≥25% of eligible costs from own/external resources, excluding state aid
  intake_field: cofinancingBand
  quote: Assegurar o financiamento de pelo menos 25 % dos custos elegíveis através de recursos
    próprios ou alheios, sem que incluam qualquer financiamento estatal, conforme previsto
    no n.º 14 do artigo 14.º do Regulamento (UE) n.º 651/2014, da Comissão, de 17 de junho,
    na sua redação atual
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.9
  verified: llm_cited
- id: g3-alt-own-capital-20pct
  gate_family: G3_financial
  requirement: SMEs with less than one year of activity, or SMEs with high technology intensity
    operations, must alternatively demonstrate own-capital financing capacity equal to or
    greater than 20% of eligible expenses.
  value: ≥20% own capital financing for young/high-tech SMEs
  intake_field: foundedYear
  quote: devem demonstrar capacidade de financiamento da operação com capitais próprios igual
    ou superior a 20 % das despesas elegíveis
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.19
  verified: llm_cited
- id: g3-financing-rate-cap-innovprod
  gate_family: G3_financial
  requirement: The financing rate for 'Investimento Empresarial Produtivo' eligible expenses
    is capped at a maximum of 75%, combining base rate and bonuses, and must not exceed regional
    aid map ceilings.
  value: max 75% financing rate
  intake_field: ticketBand
  quote: até ao limite máximo de 75 %
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.11
  verified: llm_cited
- id: g3-financing-rate-qualif
  gate_family: G3_financial
  requirement: The financing rate for 'Qualificação e Internacionalização das PME' operations
    is up to 50%, with certain exceptions up to 70% or 75%.
  value: up to 50% (up to 70%/75% in specific cases)
  intake_field: ticketBand
  quote: A taxa de financiamento das operações no âmbito da tipologia de intervenção «Qualificação
    e Internacionalização das PME» é de até 50 %, sem prejuízo do estabelecido nos números
