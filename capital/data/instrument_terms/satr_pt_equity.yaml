    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.11
  verified: llm_cited
- id: g4-form-of-support-qualif
  gate_family: G4_borrower_model
  requirement: Incentives under 'Qualificação e Internacionalização das PME' are grants only,
