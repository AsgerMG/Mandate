    simplificados (OCS), nos termos a definir em aviso para apresentação de candidaturas.
  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.15
  verified: false
