  source:
    file: pt_portaria_103a_2023_compete2030_id_regulation.pdf
    locator: pt_portaria_103a_2023_compete2030_id_regulation.pdf#p.15
  verified: llm_cited
- id: g4-form-of-support-innovprod
  gate_family: G4_borrower_model
  requirement: Incentives under 'Inovação Produtiva' may take the form of a grant or a hybrid
    format combining a grant with a loan component, the latter potentially provided through
