gates:
- id: g1-territory
  gate_family: G1_nexus
  requirement: Operations must be located in mainland Portugal (Portugal continental).
  value: mainland Portugal only
  intake_field: activityCountries
  quote: O disposto no presente Regulamento tem aplicação em todo o território de Portugal
    continental
  source:
