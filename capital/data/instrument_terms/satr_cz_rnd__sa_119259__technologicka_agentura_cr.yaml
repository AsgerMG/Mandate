  intake_field: cofinancingBand
  quote: 'Uchazeči o podporu na projekt podle Zákona mohou být podniky – právnické i fyzické osoby, které
    podle Přílohy 1 Nařízení Komise vykonávají hospodářskou činnost. Dalšími účastníky projektu mohou
    být:

    − podniky (viz definice uvedená výše),

    − výzkumné organizace – organizační složky státu nebo organizační jednotky ministerstev zabývající
    se výzkumnou činností nebo právnické osoby, které splňují definici organizace pro výzkum a šíření
    znalostí podle Nařízení Komise a podle Rámce.

    Příjemcem podpory může být podnik, který řeší projekt samostatně, anebo řeší projekt ve spolupráci
    s dalšími podniky a/nebo ve spolupráci s VO (formou kolaborativního výzkumu v souladu s Rámcem). Podmínkou
    bude doložení dvouleté ekonomické (/účetní) historie uchazeče při podání žádosti o poskytnutí účelové
    podpory.


    Podprogram 2 „Nováčci“:

    Uchazeči o podporu na projekt podle Zákona mohou být podniky – právnické i fyzické osoby, které podle
    Přílohy 1 Nařízení Komise vykonávají hospodářskou činnost. Příjemcem podpory může být podnik, který
    řeší projekt ve spolupráci s VO (musí jít o kolaborativní, nikoliv smluvní výzkum). Přitom musí prokázat,
    že v posledních pěti letech nebyl příjemcem podpory ze státního nebo jiných veřejných rozpočtů na
    své či nakupované činnosti výzkumu a vývoje v objemu, který by v úhrnu přesáhl 1 mil. Kč. Doložení
    dvouleté ekonomické (/účetní) historie uchazeče nebude vyžadováno.'
