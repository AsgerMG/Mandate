obligations:
- requirement: Beneficiaries must inform EU-Rail up to four years after the end of the action
    if results can reasonably be expected to contribute to European or international standards.
  quote: 'Beneficiaries must inform EU-Rail (up to four years after the

    end of the action) if the results can be reasonably expected to contribute to

    European or international standards.'
  source:
    file: europes_rail_wp2026_full.pdf
    locator: europes_rail_wp2026_amendment1.pdf#p.157
  verified: llm_cited
- requirement: Grant agreements will set annual deliverables on in-kind contributions and
    mandatory reporting requirements for applicants who are Private Members of EU-Rail.
  quote: 'the grant agreements will set, in principle, annual deliverable on in-

    kind contributions for the projects selected under this topic, as well as mandatory

    reporting requirements, for those applicants who are Private Members of EU-Rail.'
  source:
    file: europes_rail_wp2026_full.pdf
    locator: europes_rail_wp2026_amendment1.pdf#p.157
  verified: llm_cited
- requirement: Proposals must include dissemination and communication activities aligned with
    EU-Rail Communication and Dissemination Guidelines and coherent with overall EU-Rail Programme
    objectives.
  quote: 'the proposal shall

    consider that the project will be part of the overall EU-Rail Programme and to

    ensure coherence across the programme and alignment with Europe’s Rail

    objectives will have to follow the Europe’s Rail Communication and

    Dissemination Guidelines for Europe’s Rail Funded Projects'
  source:
    file: europes_rail_wp2026_full.pdf
    locator: europes_rail_wp2026_amendment1.pdf#p.165
  verified: llm_cited
- requirement: Actions must plan, design, coordinate and contribute to the EU-Rail Programme
    Communication and Dissemination activities in agreement with the JU, as an additional
    exploitation/dissemination obligation starting from the proposal phase.
  quote: 'the actions must

    plan, design, coordinate and contribute to the EU-Rail Programme Communication and Dissemination

    activities, aligned with the Stakeholder Relations and Dissemination/structure and in
    agreement with

    the JU.'
  source:
    file: europes_rail_wp2026_full.pdf
    locator: europes_rail_wp2026_amendment1.pdf#p.57
  verified: llm_cited
- requirement: The JU reserves the right to object to transfers or licensing of results up
    to four years after the end of the action.
  quote: 'the JU reserves the right to object to transfers or

    licensing up to four years after the end of the

    action, in accordance with the conditions set in the Horizon Europe Model Grant Agreement'
  source:
    file: europes_rail_wp2026_full.pdf
    locator: europes_rail_wp2026_amendment1.pdf#p.57
  verified: llm_cited
- requirement: Private Members and their constituent or affiliated entities established in
    third countries may be required by the JU to take appropriate measures to safeguard Union
    and JU security or public order interests.
  quote: 'the JU should be able to request private members to take appropriate

    measures. Such measures could include the appropriate handling of confidential information
    or

    limitation of certain entities in specific operational activities of the private Member'
  source:
    file: europes_rail_wp2026_full.pdf
