application:
  channel: The applicant must submit the application electronically through the online
    form available on the granting body's (CDTI) electronic headquarters (sede electrónica),
    together with all documentation specified in the specific call for proposals (convocatoria).
  typical_timeline: Applications are submitted within the form and deadline set by
    each call; if requirements are missing, the applicant has 10 working days to correct
    (subsanar); the resolution of the procedure is issued and notified within a maximum
    of six months from the day following publication of the extract of the call in
    the BOE, after which lack of express resolution means the request is deemed rejected
    by administrative silence.
  url: ''
  quote: 'Las solicitudes se presentarán mediante el formulario electrónico

    correspondiente, disponible en la sede electrónica del órgano convocante, junto
    con la

    documentación que se especifique en la convocatoria como parte integrante de la

    solicitud.'
  source:
    file: cdti_bases_reguladoras_orden_cnu_161_2025.pdf
    locator: p.15
