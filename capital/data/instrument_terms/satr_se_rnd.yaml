cumulation:
  text: Funding from Klimatklivet may be combined with other state co-financing only as long
    as the combined aid does not exceed the thresholds set out in GBER or the de minimis regulation;
    de minimis aid to a single undertaking or group is aggregated and capped at €300,000 over
    a rolling three-year period.
  quote: Medel från Klimatklivet kan kombineras med annan statlig medfinansiering så länge
    man totalt sett inte överskrider tröskelvärdena i gruppundantagsförordningen respektive
    de minimis-förordningen.
  source:
    file: satr_se_rnd_klimatklivet_forutsattningar.html
    locator: satr_se_rnd_klimatklivet_regler.html#chunk 1
  verified: llm_cited
application:
  channel: Applications for Klimatklivet are submitted to Naturvårdsverket (Swedish Environmental
    Protection Agency), with regional support from Länsstyrelsen; Energimyndigheten and Formas
    grants are administered directly by those agencies with decisions communicated via 'Mina
    sidor'.
  typical_timeline: Not specified in source text beyond payment being monthly in twelfths
    and final reporting deadlines of three months after the disposal period ends.
  quote: Det är Naturvårdsverket som fattar beslut och ansvarar för utbetalningar.
  source:
    file: satr_se_rnd_klimatklivet_forutsattningar.html
    locator: satr_se_rnd_klimatklivet_regler.html#chunk 1
  verified: llm_cited
