    split between JU funding and partner financing.
  value: Must leverage co-funding from contributing partners
  intake_field: cofinancingBand
  quote: proposals submitted are expected to leverage financial and/or in-kind contribution
    from contributing partners.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.65
  verified: llm_cited
- id: g6-scientific-project-leader
  gate_family: G6_conditionality
  requirement: If the coordinator is not established in an SSA country, designation of a scientific
    project leader established in an SSA EDCTP Association member country is mandatory, with
    a dedicated work package and budget.
  value: Mandatory SSA scientific project leader if coordinator non-SSA
  intake_field: conditionality
  quote: If the coordinator is not established in a country in SSA (please see previous paragraph),
    the designation of a scientific project leader established in a SSA country member of
    the EDCTP Association with the roles as described below is mandatory.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.59
  verified: llm_cited
- id: g6-affordable-access-plan
  gate_family: G6_conditionality
  requirement: Grantees must include an appropriate and proportionate access plan in their
    Plan for Exploitation and Dissemination of Results, ensuring products/services are affordable,
    available and accessible at fair and reasonable conditions.
  value: Mandatory affordable access plan deliverable
  intake_field: conditionality
  quote: Participants must include in their Plan for the exploitation and dissemination of
    results105 an appropriate and proportionate access plan that demonstrates their strategies
    to ensure that the products and services that they develop based or partly based on the
    results of clinical studies undertaken by their project are affordable, available and
    accessible to the public (market and end-users) at fair and reasonable conditions.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.102
  verified: llm_cited
obligations:
- requirement: Participants must use best efforts for up to four years after action end to
    ensure resulting health technologies/services are broadly available and accessible at
    fair and reasonable conditions, and use the Horizon Results Platform if results unexploited
    after one year.
  quote: Participants must – up to four years after the end of the action (see Data Sheet,
    Point 1) – use their best efforts to ensure that resulting health technologies and services
    will be broadly available and accessible, as soon as possible and at fair and reasonable
    conditions.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.102
  verified: llm_cited
- requirement: If participants cannot exploit results themselves, they must, if requested,
    grant non-exclusive licences under fair and reasonable conditions to entities committing
    to broad exploitation.
  quote: the participants must (if requested by the granting authority) grant non-exclusive
    licences - under fair and reasonable conditions - to their results to legal entities that
    commit to rapidly and broadly exploiting the resulting health technologies and services
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.102-103
  verified: llm_cited
- requirement: Any transfer of ownership or licensing of results must pass on the additional
    exploitation obligations to the receiving legal entities.
  quote: In case of transfer of the ownership or licensing of results, participants must pass
    on such additional exploitation obligations to the legal entities exploiting the results.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.103
  verified: llm_cited
- requirement: For up to four years after the action, the funding body must be informed annually
    about product development and exploitation status via an annual report due on each grant
    agreement anniversary.
  quote: For up to four years after the action (see Data Sheet, Point 1), the funding body
    must be informed every year about the status of the development of the product and any
    other exploitation of the results through an annual report that is due on each anniversary
    of the end of the grant agreement.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.103
  verified: llm_cited
- requirement: Studies must be registered in a WHO-registry-criteria-compliant registry before
    enrolment of the first subject, and summary results must be posted in the applicable registry
    regardless of study outcome.
  quote: Studies must be registered in a registry meeting WHO Registry criteria37 before recruitment
    of the first subject.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.52
  verified: llm_cited
- requirement: Proposals must comply with all ethics requirements and will undergo ethics
    screening by independent experts if funded.
  quote: Proposals must comply with all ethics requirements arising out of the research, in
    line with Article 112 of the Council Regulation 2021/208556.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.56
  verified: llm_cited
- requirement: The JU retains the right to object to a transfer of ownership or exclusive
    licensing of results for up to four years after the action ends.
  quote: Global Health EDCTP3 may, up to four (4) years after the end of the action, object
    to a transfer of ownership or to the exclusive licensing of results, as set out in the
    specific provision of Annex 5
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.59
  verified: llm_cited
- requirement: Contributing partners' contributions must correspond to amounts committed in
    a letter of endorsement submitted before the second-stage application deadline.
  quote: The contributions from contributing partners should correspond to the amounts they
    have committed in the letter of endorsement requesting to become a contributing partner
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.66
  verified: llm_cited
