- id: g5-clinical-trial-ssa-scope
  gate_family: G5_use_of_funds
  requirement: Proposals must include one or more clinical trials conducted in sub-Saharan
    Africa, supported by regulatory approval/access strategy or policy uptake plans.
  value: Clinical trial(s) must be conducted in SSA
  intake_field: none
  quote: Proposals should include one or more clinical trial(s) to be conducted in SSA. The
    clinical trial(s) must be supported by an appropriate regulatory approval and access strategy
    and/or include plans for uptake into policy and practice at national or international
    level.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.52
  verified: llm_cited
- id: g5-preclinical-out-of-scope
  gate_family: G5_use_of_funds
  requirement: Preclinical studies are generally out of scope for these topics, though preparatory
    activities enabling in-scope clinical studies are permitted.
  value: Preclinical studies excluded; enabling prep activities allowed
  intake_field: none
  quote: Preclinical studies are considered out of scope of the topic.
  source:
    file: gh_edctp3_work_programme_2026.pdf
    locator: gh_edctp3_work_programme_2026.pdf#p.71
  verified: llm_cited
- id: g5-contributing-partner-leverage
