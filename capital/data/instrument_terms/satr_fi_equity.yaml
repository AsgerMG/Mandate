    funded by non-combinable public funding schemes are ineligible.
  quote: The combined total funding that the project receives from the Funding Agency and
    other providers of public funding may not exceed the project's maximum limit for public
    funding.
  source:
    file: fi_business_finland_rd_funding_terms_2026.pdf
    locator: fi_business_finland_rd_funding_terms_2026.pdf#p.13
  verified: llm_cited
application:
  channel: Online service / funding decision confirmation via Business Finland with required
    forms (Y1, Y3, Y4, Y5) and auditor's report submission
  typical_timeline: Funding decision confirmation, interim reporting, and final report with
    auditor's report; loan drawdown within six months of payment decision letter; right of
    inspection for ten years post final payment
  quote: The beneficiary must confirm receipt of the funding decision and these funding terms
    and conditions in accordance with the instructions.
  source:
    file: fi_business_finland_rd_funding_terms_2026.pdf
    locator: fi_business_finland_rd_funding_terms_2026.pdf#p.2
  verified: llm_cited
