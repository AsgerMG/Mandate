- requirement: Certain public bodies, research organisations and higher education establishments
    must have a gender equality plan meeting minimum requirements at the moment of grant signature
    and throughout the grant duration.
  quote: legal entities from Member States and Associated Countries that are public bodies,
    research organisations or higher education establishments (including private research
    organisations and private higher education establishments) applying as beneficiaries or
    affiliated entities must have at the moment of grant signature and during the duration
    of the grant a gender equality plan
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.18
  verified: llm_cited
- requirement: Participants must conclude a written consortium agreement to govern the implementation
