cumulation:
  text: An action may receive only one EU-budget grant (except EU Synergy grants); the same
    costs may never be declared to two different EU actions, though combination with EU operating
    grants is possible if cost items are kept clearly separated and not declared twice.
  quote: There is strict prohibition of double funding from the EU budget. Any given action
    may receive only ONE grant from the EU budget (except for EU Synergy grants) and same
    costs may under NO circumstances be declared to two different EU actions.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
