gates:
- id: g1-establishment
  gate_family: G1_nexus
  requirement: Applicants must be established in an eligible country (EU Member States including
    outermost regions, Associated Countries, or listed low/middle-income countries), unless
    call conditions provide otherwise or participation is essential.
  value: Member States of the EU, Associated Countries, or listed third countries
  intake_field: entityCountries
  quote: 'To be eligible for funding, applicants must be established in one of the following
    countries:'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russia-belarus-exclusion
  gate_family: G1_nexus
  requirement: Legal entities established in Russia, Belarus, or non-government controlled
    territories of Ukraine are not eligible to participate in any capacity, absent a case-by-case
    exception.
  value: excluded
  intake_field: entityCountries
  quote: such legal entities are not eligible to participate in any capacity
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-russian-owned-entities
  gate_family: G1_nexus
  requirement: Legal entities established outside Russia that are more than 50% owned by a
    Russia-established person/entity are not eligible to participate in any capacity.
  value: excluded if >50% Russian-owned
  intake_field: nonEuControl
  quote: legal entities established outside Russia whose proprietary rights are directly or
    indirectly owned for more than 50% by a legal person, entity or body established in Russia
    are also not eligible to participate in any capacity
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-hungary-trusts
  gate_family: G1_nexus
  requirement: Hungarian public interest trusts established under Hungarian Act IX of 2021
    (or entities they maintain) are not eligible to participate in any funded role while Council
    measures remain in force.
  value: excluded from funded roles
  intake_field: entityCountries
  quote: such entities are not eligible to participate in any funded role (beneficiaries,
    affiliated entities, subcontractors, recipients of financial support to third parties,
    etc.)
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.11
  verified: llm_cited
- id: g1-consortium-composition
  gate_family: G1_nexus
  requirement: 'Unless call conditions provide otherwise, the consortium must include at least
    three independent legal entities established in three different countries: one in a Member
    State and two others each in different Member States or Associated Countries.'
  value: 3 independent entities, 3 different countries, 1 in MS
  intake_field: consortium
  quote: the consortium includes, as beneficiaries, three legal entities independent from
    each other and each established in a different country
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.13
  verified: llm_cited
- id: g1-eligible-activities-topic
  gate_family: G1_nexus
  requirement: Applications will only be considered eligible if their content corresponds,
    wholly or in part, to the topic description for which it is submitted.
  value: must match topic description
  intake_field: none
  quote: Applications will only be considered eligible if their content corresponds, wholly
    or in part, to the topic description for which it is submitted.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g1-civil-applications-only
  gate_family: G1_nexus
  requirement: Projects must focus exclusively on civil applications and are barred from certain
    human cloning/embryo research activities.
  value: civil applications only, ethics-restricted research excluded
  intake_field: none
  quote: 'Projects must focus exclusively on civil applications and must not:'
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.14
  verified: llm_cited
- id: g1-china-entities
  gate_family: G1_nexus
  requirement: For IA and RIA actions covered, legal entities established in China are not
    eligible to participate in any capacity, absent case-by-case exceptions.
  value: excluded (China, IA/RIA actions)
  intake_field: entityCountries
  quote: this includes participation of legal entities established in China in any capacity
    (as beneficiaries, affiliated entities, associated partners, third parties giving in-kind
    contributions, subcontractors or recipients of financial support to third parties (if
    any))
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-miit-universities
  gate_family: G1_nexus
  requirement: Chinese universities administered by or under supervision of the Ministry of
    Industry and Information Technology (MIIT) are not eligible to participate in any action
    under the Work Programme.
  value: excluded
  intake_field: entityCountries
  quote: universities (higher education establishments) established in China which are public
    bodies, that are administered by or fall under the supervision of the Ministry of Industry
    and Information Technology (MIIT) are not eligible to participate in any action under
    all parts of this Work Programme
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.8
  verified: llm_cited
- id: g1-5g-high-risk-suppliers
  gate_family: G1_nexus
  requirement: Entities assessed as high-risk suppliers of mobile network communication equipment
    (and entities they own/control) are not eligible to participate as beneficiaries, affiliated
    entities or associated partners in actions related to European communication networks.
  value: excluded (high-risk 5G suppliers)
  intake_field: entityCountries
  quote: Entities that are assessed as high-risk suppliers of mobile network communication
    equipment (and any entities they own or control) are not eligible to participate as beneficiaries,
    affiliated entities and associated partners.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.9
  verified: llm_cited
- id: g2-operational-capacity
  gate_family: G2_size_ownership
  requirement: Applicants must have the know-how, qualifications and resources (operational
    capacity) to implement their tasks in the project, assessed via the Implementation award
    criterion.
  value: operational capacity threshold must be met
  intake_field: none
  quote: Applicants must have the know-how, qualifications and resources to successfully implement
    their tasks in the project and contribute their share
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.22
  verified: llm_cited
- id: g2-exclusion-situations
  gate_family: G2_size_ownership
  requirement: Applicants subject to EU administrative sanctions or in exclusion situations
    (e.g. bankruptcy, winding up) cannot participate.
  value: excluded if bankrupt/sanctioned
  intake_field: none
  quote: bankruptcy, winding up, affairs administered by the courts, arrangement with creditors,
    suspended business activities or other similar procedures
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.22
  verified: llm_cited
- id: g4-grant-mechanics-lumpsum
  gate_family: G4_borrower_model
  requirement: Funding is provided as EU grants (including lump sum grants), not loans; lump
    sum grants require a detailed budget table used to justify the lump sum amount.
  value: grant / lump-sum grant mechanics
  intake_field: borrowerModel
  quote: For lump sum grant proposals, the estimated budget must be described in a detailed
    budget table.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.28
  verified: llm_cited
- id: g6-no-profit-rule
  gate_family: G6_conditionality
  requirement: Grants may not generate a profit (surplus of revenues plus EU grant over costs),
    checked at project end.
  value: no-profit rule applies
  intake_field: none
  quote: Grants may NOT give a profit (i.e. surplus of revenues + EU grant over costs).
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
- id: g6-no-double-funding
  gate_family: G6_conditionality
  requirement: An action may receive only one grant from the EU budget and the same costs
    may not be declared to two different EU actions (no double funding), except for EU Synergy
    grants.
  value: single EU grant per action; no cost double-counting
  intake_field: none
  quote: Any given action may receive only ONE grant from the EU budget (except for EU Synergy
    grants) and same costs may under NO circumstances be declared to two different EU actions.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.38
  verified: llm_cited
