  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.37
  verified: llm_cited
- requirement: Each participant must confirm compliance with EU funding conditions by signing
    a declaration of honour before grant signature.
  quote: Before signing the grant, each participant will have to confirm this again by signing
    a declaration of honour.
  source:
    file: horizon_eu_general_annexes_2026_2027.pdf
    locator: horizon_eu_general_annexes_2026_2027.pdf#p.28
  verified: llm_cited
