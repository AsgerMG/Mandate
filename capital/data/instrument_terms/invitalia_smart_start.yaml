cumulation:
  text: Benefits under this decree cannot be cumulated with other aid (including de minimis)
    granted to the same beneficiary for the same eligible expenses, except for the SME Guarantee
    Fund guarantee on bank financing covering the unaided portion of the business plan.
  quote: Le agevolazioni di cui al presente decreto non sono cumulabili con altre agevolazioni
    concesse al soggetto beneficiario, anche a titolo di de minimis, laddove riferite alle
    stesse spese ammissibili, fatta salva, nel rispetto dell’articolo 8 del Regolamento di
    esenzione, la garanzia rilasciata dal Fondo di garanzia per le piccole e medie imprese
  source:
    file: invitalia_smart_start_regolamento_dm2014.pdf
    locator: invitalia_smart_start_regolamento_dm2014.pdf#p.15
  verified: llm_cited
application:
  channel: Applications are submitted to the Soggetto gestore (managing entity, Invitalia)
    accompanied by the business plan, according to modalities and terms specified in a ministerial
    directorial circular.
  typical_timeline: Applications are processed in chronological order of submission/completion
    so decisions can be issued within 60 days of the application or its completion.
  quote: Le domande di agevolazione, complete dei dati previsti dal modulo di richiesta, sono
    istruite, nel rispetto dell’ordine cronologico di presentazione o di completamento, in
    tempo utile perché possano essere deliberate entro 60 giorni dalla data di presentazione
    della richiesta o di completamento della stessa
  source:
    file: invitalia_smart_start_regolamento_dm2014.pdf
    locator: invitalia_smart_start_regolamento_dm2014.pdf#p.13
  verified: llm_cited
