obligations:
- requirement: Company must ensure at least EUR 50,000 per year in R&D investment during the
    post-monitoring period.
  quote: ieguldījumu apjoms pētniecībā un attīstībā ir vismaz 50 000 euro gadā
  source:
    file: altum_mvu_ia_3_1_1_7_un_13_1_1_inovativu_produktu_izstradei.html
    locator: chunk 2
  verified: llm_cited
- requirement: Turnover growth must be at least twice the amount of the eligible costs of
    the investment project.
  quote: apgrozījuma pieaugums vismaz divas reizes pārsniedz investīciju projekta attiecināmo
    izmaksu apmēru
  source:
    file: altum_mvu_ia_3_1_1_7_un_13_1_1_inovativu_produktu_izstradei.html
    locator: chunk 2
  verified: llm_cited
- requirement: For every EUR 250,000 of granted capital rebate, one new job must be created,
    with at least two new jobs created in total, or existing jobs retained with at least a
    30% wage increase and average gross monthly wage at least 60% above the national average
    for the previous year.
  quote: uz katriem piešķirtās kapitāla atlaides 250 000 EUR radīta viena jauna darba vieta
    un kopā radītas vismaz divas jaunas darba vietas VAI saglabātas esošās darba vietas, nodrošinot
    saglabātajām darba vietām atalgojuma pieaugumu vismaz par 30%, kā arī mēneša vidējā bruto
    darba samaksa saglabātajās darba vietās ir vismaz par 60% lielāka nekā mēneša vidējā bruto
    darba samaksa tautsaimniecībā iepriekšējā gadā
  source:
    file: altum_mvu_ia_3_1_1_7_un_13_1_1_inovativu_produktu_izstradei.html
    locator: chunk 2
  verified: llm_cited
- requirement: New jobs must be maintained for at least two years with wages at least 60%
    above the national average.
  quote: jaunās darba vietas tiek saglabātas vismaz divus gadus, un tiek nodrošināta mēneša
    vidējā bruto darba samaksa, kas ir vismaz par 60% lielāka nekā mēneša vidējā bruto darba
    samaksa tautsaimniecībā iepriekšējā gadā
  source:
    file: altum_mvu_ia_3_1_1_7_un_13_1_1_inovativu_produktu_izstradei.html
    locator: chunk 2
  verified: llm_cited
- requirement: At the end of each post-monitoring year, the aid recipient must submit to the
    Ministry of Economics documents substantiating the indicators, including auditor reports;
    the Ministry decides on fulfilment and the decision must be submitted to ALTUM.
  quote: Beidzoties katram pēcuzraudzības perioda gadam, atbalsta saņēmējam jāiesniedz Ekonomikas
    ministrijā rādītājus pamatojošos dokumentus, tai skaitā revidenta pārskatus. Ekonomikas
    ministrija pārbauda rādītāju sasniegšanu, un pieņem lēmumu par to izpildi vai neizpildi.
    Lēmums par rādītāju izpildi komersantam jāiesniedz ALTUM.
  source:
    file: altum_mvu_ia_3_1_1_7_un_13_1_1_inovativu_produktu_izstradei.html
    locator: chunk 2
  verified: llm_cited
- requirement: ALTUM applies the capital rebate for the relevant year in the amount of one
    third of the total granted capital rebate, based on the Ministry's decision, repeating
    this in the following two years.
  quote: ALTUM, pamatojoties tostarp uz Ekonomikas ministrijas pieņemto lēmumu, piemēro kapitāla
    atlaidi par attiecīgo gadu vienas trešdaļas apmērā no kopējā piešķirtā kapitāla atlaides
    apmēra
  source:
    file: altum_mvu_ia_3_1_1_7_un_13_1_1_inovativu_produktu_izstradei.html
    locator: chunk 2
  verified: llm_cited
