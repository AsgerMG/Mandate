gates:
- id: g1-excl-legal-monopoly
  gate_family: G1_nexus
  requirement: Companies holding a statutory absolute monopoly within Flanders (or a substantial part
    of it) are not eligible for support for their projects, unless the project falls outside the monopoly's
    implementation area.
  value: 'Excluded: statutory monopoly holders (unless project outside monopoly area)'
  intake_field: borrowerModel
  quote: Ondernemingen die op grond van een wettelijke bepaling beschikken over een absoluut monopolie
    binnen het grondgebied van het Vlaamse Gewest of binnen een wezenlijk deel daarvan, komen niet in
    aanmerking voor steun voor hun projecten, tenzij het project waarvoor zij steun aanvragen buiten het
    implementatiegebied van dit monopolie valt.
  source:
    file: https://www.vlaio.be/nl/subsidies-financiering/oo-bedrijfsproject
