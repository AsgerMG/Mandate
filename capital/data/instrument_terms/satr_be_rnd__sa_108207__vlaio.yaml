- id: g3-base-aid-rate
  gate_family: G3_financial
  requirement: Research projects (onderzoeksprojecten) receive a base aid percentage of 50%.
  value: 'Base aid rate: 50% for research projects'
  intake_field: none
  quote: Aan onderzoeksprojecten wordt een basissteunpercentage van 50% toegekend.
  source:
