- id: g1-any-size-flanders
  gate_family: G1_nexus
  requirement: Both SMEs and large companies are eligible, from SME to multinational (including non-profits),
    provided they are established in the Flemish Region.
  value: Any size incl. non-profits, must be established in Flanders
  intake_field: entityCountries
  quote: Zowel kmo's als grote ondernemingen komen voor de subsidie in aanmerking, en elke onderneming
