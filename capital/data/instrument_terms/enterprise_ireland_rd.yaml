application:
  channel: Direct application to Enterprise Ireland (or via Údarás na Gaeltachta/Local Enterprise
    Office) using online application forms and company guidelines.
  typical_timeline: Applications accepted anytime; approvals under €150,000 via delegated
    MAC powers, above that via Investment Committee; projects must start within 6 months of
    approval.
  quote: 'Applications for funding can be submitted anytime. Application forms and company
    guidelines are

    available on the Enterprise Ireland website.'
  source:
    file: enterprise_ireland_rdi_fund_reference_doc.pdf
    locator: enterprise_ireland_tor_rd_2024.pdf#p.13
  verified: llm_cited
