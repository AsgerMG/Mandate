gates:
- id: G1-01
  gate_family: G1_nexus
  requirement: Applicant must be an existing or potential client of Enterprise Ireland, Údarás
    na Gaeltachta, or a Local Enterprise Office (subject to prevailing agency policies), unless
    exempt under the Housing for All Offer.
  value: EI/Údarás/LEO client status required
  intake_field: bankRelationship
  quote: Eligible companies are limited to Enterprise Ireland 1, Údarás na Gaeltachta or any
    of the Local Enterprise Offices subject to the prevailing policies of those agencies.
  source:
    file: enterprise_ireland_rdi_fund_reference_doc.pdf
    locator: enterprise_ireland_tor_rd_2024.pdf#p.6
  verified: llm_cited
- id: G1-02
  gate_family: G1_nexus
  requirement: Company must operate in the manufacturing or internationally traded services
    sector and be currently trading internationally or expected to trade internationally in
    the short term.
  value: Manufacturing or internationally traded services, internationally trading
  intake_field: activityCountries
  quote: Companies must operate in the Manufacturing or internationally traded services areas
    of business to be eligible for this support and be either currently trading internationally
    or trading internationally within the short term.
  source:
    file: enterprise_ireland_rdi_fund_reference_doc.pdf
    locator: enterprise_ireland_tor_rd_2024.pdf#p.6
  verified: llm_cited
- id: G1-03
  gate_family: G1_nexus
  requirement: The majority of the project must be carried out in Ireland, with cost analysis
    distinguishing costs incurred in the State from costs incurred outside the State.
  value: Majority of project in Ireland
  intake_field: activityCountries
  quote: 'The majority of the project must be carried out in Ireland and the assessment criteria
    will

    require an analysis of costs incurred in the State and costs incurred outside the State.'
  source:
    file: enterprise_ireland_rdi_fund_reference_doc.pdf
    locator: enterprise_ireland_tor_rd_2024.pdf#p.5
  verified: llm_cited
- id: G1-04
  gate_family: G1_nexus
  requirement: Where a company sources more than 50% of its materials for the RD&I project
    in another State and/or more than 50% of subcontract RD&I work is carried out in another
    State, this breaches legal/policy requirements and is ineligible.
  value: Max 50% materials/subcontract work abroad
  intake_field: activityCountries
  quote: 'where a company sources more than 50% of its materials for the RD&I project in

    another State and/or more than 50% of the subcontract RD&I work is carried out in another

    State then that would breach the legal and policy requirements in respect of building
    RD&I

    capability and capacity in the State and in the applicant company.'
  source:
    file: enterprise_ireland_rdi_fund_reference_doc.pdf
    locator: enterprise_ireland_tor_rd_2024.pdf#p.5
  verified: llm_cited
- id: G2-01
  gate_family: G2_size_ownership
  requirement: 'SME status is defined per Annex 1 of Commission Regulation (EU) No 651/2014:
    fewer than 250 employees and either annual turnover not exceeding €50 million or annual
    balance sheet total not exceeding €43 million.'
  value: <250 FTE and (turnover ≤€50m or balance sheet ≤€43m)
  intake_field: fteBand
  quote: 'The category of micro, small and medium-sized enterprises (‘SMEs’) is made up of
    enterprises

    which employ fewer than 250 persons and which have an annual turnover not exceeding EUR
    50 million,

    and/or an annual balance sheet total not exceeding EUR 43 million.'
  source:
    file: enterprise_ireland_rdi_fund_reference_doc.pdf
    locator: enterprise_ireland_tor_rd_2024.pdf#p.15
  verified: llm_cited
- id: G2-02
  gate_family: G2_size_ownership
  requirement: Small enterprise is defined as employing fewer than 50 persons and having annual
    turnover and/or balance sheet total not exceeding €10 million.
  value: <50 FTE and (turnover ≤€10m or balance sheet ≤€10m)
  intake_field: fteBand
  quote: 'a small enterprise is defined as an enterprise which employs fewer than

    50 persons and whose annual turnover and/or annual balance sheet total does not exceed
    EUR 10

    million.'
  source:
    file: enterprise_ireland_rdi_fund_reference_doc.pdf
    locator: enterprise_ireland_tor_rd_2024.pdf#p.15
  verified: llm_cited
- id: G2-03
  gate_family: G2_size_ownership
  requirement: A company exceeding medium enterprise thresholds is automatically classed as
