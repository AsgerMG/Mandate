cumulation:
  text: Aid with identifiable eligible costs may be cumulated with other State aid on different
    eligible costs, or on overlapping costs only if the combined intensity/amount ceilings
    under GBER are not exceeded; aid without identifiable eligible costs may be cumulated
    up to the highest applicable financing ceiling; cumulation with de minimis aid on the
    same costs is barred if it would exceed the scheme's ceilings.
  quote: 'Les aides aux coûts admissibles identifiables octroyées sur la base du présent régime
    sont cumulables avec : - toute autre aide d’Etat dès lors qu’elle porte sur des coûts
    admissibles identifiables différents'
  source:
    file: satr_fr_equity_regime_cadre_sa111729.pdf
    locator: satr_fr_equity_regime_cadre_sa111729.pdf#p.18
  verified: llm_cited
application:
  channel: Aid may be granted on a rolling basis (au fil de l'eau) or through calls for projects/expressions
    of interest/tenders/competitions referencing the scheme number SA.111729.
  typical_timeline: Not specified; scheme in force 1 January 2024 to 31 December 2026 (extendable
    subject to Commission decision).
  quote: Le présent régime peut être utilisé pour octroyer des aides au fil de l’eau. Il peut
    être également utilisé dans le cadre d’appels à projets (AAP), d’appels à manifestation
    d’intérêts (AMI), d’appels d’offres (AO), ou de concours
  source:
    file: satr_fr_equity_regime_cadre_sa111729.pdf
    locator: satr_fr_equity_regime_cadre_sa111729.pdf#p.2
  verified: llm_cited
