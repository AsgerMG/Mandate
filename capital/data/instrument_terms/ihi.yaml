- id: G1-06
  gate_family: G1_nexus
  requirement: In two-stage calls, the pre-identified industry consortium (legal entities
    identified by IHI JU as participating in a specific topic) is not eligible for funding
    and cannot apply at the first stage; they must merge with the winning consortium at second
    stage.
  value: Pre-identified industry consortium excluded from first-stage application and funding
  intake_field: consortium
  quote: The applicants which are IHI JU members other than the Union, or their constituent
    entities and affiliated entities, and contributing partners and that are pre-identified
    in the topics – under the section ‘Industry consortium’ – of a call for proposals shall
    not apply at the first stage of the call.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.7
  verified: llm_cited
- id: G2-01
  gate_family: G2_size_ownership
  requirement: For-profit legal entities with an annual turnover of EUR 500 million or more,
    or entities controlling/controlled by such entities, participating in a two-stage call
    alongside a pre-identified entity, are not eligible for funding.
  value: Turnover threshold EUR 500,000,000; excludes large for-profit entities and their
    controlled/controlling entities in two-stage calls
  intake_field: turnoverBand
  quote: a) they are for-profit legal entities with an annual turnover of EUR 500 million
    or more; b) they are under the direct or indirect control of a legal entity described
    in point (a), or under the same direct or indirect control as a legal entity described
    in point (a); c) they are directly or indirectly controlling a legal entity referred to
    in point (a).
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.7
  verified: llm_cited
- id: G2-02
  gate_family: G2_size_ownership
  requirement: EU funding primarily targets universities, research organisations, patient
    organisations, SMEs, and mid-sized companies with turnover below EUR 500 million; larger
    companies may be eligible depending on the call type.
  value: Turnover below EUR 500,000,000 typical eligibility threshold
  intake_field: turnoverBand
  quote: In practice, EU funding primarily supports the participation in projects of organisations
    like universities, research organisations, patient organisations, small and medium-sized
    enterprises (SMEs), and mid-sized companies (companies with a turnover below EUR 500 million).
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_guide_for_applicants.pdf#p.20
  verified: llm_cited
- id: G3-01
  gate_family: G3_financial
  requirement: The maximum IHI JU financial contribution for topic HORIZON-JU-IHI-2026-12-SINGLE-STAGE-05
    is EUR 9,800,000, with an indicative minimum contribution of EUR 4,900,000 recommended
    to appropriately address outcomes.
  value: Max EUR 9,800,000; indicative min EUR 4,900,000
  intake_field: ticketBand
  quote: Applicant consortia will be competing for the maximum financial contribution from
    IHI JU of up to EUR 9 800 000. IHI JU estimates that an IHI JU financial contribution
    of at least EUR 4 900 000 would allow a proposal to address the outcomes appropriately
    and achieve the expected impacts.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.35
  verified: llm_cited
- id: G3-02
  gate_family: G3_financial
  requirement: The funding rate for all beneficiaries and all activities is 100% of eligible
    costs, with indirect costs calculated at a flat rate of 25%.
  value: Funding rate 100%; indirect cost flat rate 25%
  intake_field: none
  quote: 'The funding rates in IHI JU grants: For all beneficiaries and all activities, the
    funding rate is 100 % of the eligible costs, while for indirect costs a flat rate of 25%
    applies.'
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_guide_for_applicants.pdf#p.35
  verified: llm_cited
- id: G3-03
  gate_family: G3_financial
  requirement: Applicant consortia must ensure at least 45% of the action's eligible costs
    (and costs for related additional activities) are provided by industry contributions (IKOP,
    FC, IKAA) from private members/contributing partners; this is a strict eligibility criterion
    for evaluation.
  value: Minimum 45% industry co-financing threshold
  intake_field: cofinancingBand
  quote: Applicant consortia must ensure that at least 45% of the action’s eligible costs
    and costs for the action related additional activities are provided by in-kind contributions
    to operational activities (‘IKOP’), financial contributions (‘FC’s), or in-kind contributions
    to additional activities (‘IKAA’).
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.35
  verified: llm_cited
- id: G3-04
  gate_family: G3_financial
  requirement: At project level, the maximum share of non-EU IKOP counted toward the 45% threshold
    is capped at 20% for IHI JU Call 12.
  value: Non-EU IKOP capped at 20% at project level for Call 12
  intake_field: cofinancingBand
  quote: 'at project level, the maximum amount of non-EU IKOP is set to: o Twenty percent
    (20%) for IHI JU Call 12.'
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.6
  verified: llm_cited
- id: G3-05
  gate_family: G3_financial
  requirement: IKAA contributed by constituent/affiliated entities of private members must
    not exceed 40% of their total in-kind contribution (IKAA+IKOP) at overall IHI JU programme
    level; recommended (not compulsory) cap for individual proposals.
  value: IKAA capped at 40% at programme level
  intake_field: cofinancingBand
  quote: The total IKAA provided by the constituent and affiliated entities of the private
    members should not exceed 40 % of the constituent and affiliated entities of the private
    members’ total in-kind contribution (IKAA + IKOP) at overall IHI JU programme level.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_guide_for_applicants.pdf#p.49
  verified: llm_cited
- id: G4-01
  gate_family: G4_borrower_model
  requirement: IHI JU funding is provided as a grant (Research and Innovation Action), not
    a loan or equity instrument.
  value: Grant instrument (RIA)
  intake_field: borrowerModel
  quote: Applicant consortia will be competing for Research and Innovation Action (RIA)
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.4
  verified: llm_cited
- id: G4-02
  gate_family: G4_borrower_model
  requirement: IKOP and FCs may be contributed by constituent/affiliated entities of private
    members and/or contributing partners; IKAA may only be contributed by constituent/affiliated
    entities of private members, not by contributing partners.
  value: Contribution-type restrictions by participant category
  intake_field: borrowerModel
  quote: IKOP and FCs may be contributed by the constituent and/or affiliated entities of
    both the private members38 and/or the contributing partners, if relevant. IKAA may be
    contributed by constituent and/or affiliated entities of the private members only. Contributing
    partners and their affiliated entities cannot contribute IKAA.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.31
  verified: llm_cited
- id: G5-01
  gate_family: G5_use_of_funds
  requirement: Proposals must propose a project duration matching the proposed project's activities
    and expected outcomes/impacts.
  value: Indicative duration must match project scope
  intake_field: none
  quote: Applicants should propose a project duration that matches the proposed project’s
    activities and expected outcomes and impacts.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.31
  verified: llm_cited
- id: G5-02
  gate_family: G5_use_of_funds
  requirement: Costs for in-kind contributions and subcontracted or third-party costs must
    comply with the cost-eligibility criteria in Article 6 of the Model Grant Agreement.
  value: Eligible costs subject to MGA Article 6 criteria
  intake_field: none
  quote: The eligibility conditions for such costs are set out in Article 6 of the MGA.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_guide_for_applicants.pdf#p.32
  verified: llm_cited
- id: G6-01
  gate_family: G6_conditionality
  requirement: Contacts/discussions about a given topic between potential applicant consortia
