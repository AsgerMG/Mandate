cumulation:
  text: At the overall IHI JU programme level, non-EU IKOP contributed by private members
    and contributing partners must not exceed 20% of in-kind operational contributions, and
    IKAA must not exceed 40% of in-kind contributions from private members, across the whole
    programme (not just per project).
  quote: pursuant to Article 119(4) of Council Regulation (EU) 2021/2085, at the level of
    the IHI JU programme, non-EU IKOP must not exceed 20% of in-kind contributions to operational
    costs provided by private members which are IHI JU members, their constituent or affiliated
    entities, and contributing partners. Furthermore, at the level of the IHI JU programme,
    IKAA shall not constitute more than 40% of in-kind contributions provided by private members
    which are IHI JU members.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.6
  verified: llm_cited
application:
  channel: Electronic Submission System of the EU Funding & Tenders Portal (SEDIA), submitted
    online by the coordinator via the relevant topic's Submission Service section before the
    call deadline.
  typical_timeline: 'Single-stage: max 5 months from submission deadline for evaluation outcome,
    max 8 months from submission deadline for grant agreement signature. Two-stage: max 5
    months from first-stage deadline for first-stage outcome, max 5 months from second-stage
    deadline for second-stage outcome, max 8 months from second-stage deadline for grant agreement
    signature.'
  quote: Proposals in response to a topic of an IHI JU call for proposals must be submitted
    online, before the call deadline, by the coordinator via the Submission Service section
    of the relevant topic page available under Funding & Tender opportunities – Single Electronic
    Data Interchange Area (SEDIA). No other means of submission will be accepted.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.11
  verified: llm_cited
