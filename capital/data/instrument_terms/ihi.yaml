    mus'''
- id: G6-03
  gate_family: G6_conditionality
  requirement: Non-EU legal entities providing in-kind contributions that are not eligible
    for funding or not established in a generally eligible country may exceptionally sign
    the grant agreement only if their participation is deemed essential and they participate
    without requesting funding.
  value: Exceptional non-EU signatory conditional on essentiality and no funding request
  intake_field: conditionality
  quote: Their participation is considered essential for implementing the action by the granting
    authority; and o They participate without requesting any funding.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.7
  verified: llm_cited
obligations:
- requirement: Members of the applicant consortia must avoid any actions that could jeopardise
    confidentiality of the IHI JU evaluation procedure.
  quote: The members of the applicant consortia shall avoid taking any actions that could
    jeopardise confidentiality.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.11
  verified: llm_cited
- requirement: Specific dissemination and exploitation obligations described under 'Specific
    conditions on availability, accessibility and affordability' apply to selected actions.
  quote: The specific obligations described in the conditions of the calls and call management
    rules under ‘Specific conditions on availability, accessibility and affordability’ apply.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_call12_calltext.pdf#p.31
  verified: llm_cited
- requirement: The coordinator of a full proposal must submit a Declaration confirming that
    the required 45% industry contribution will be provided.
  quote: 'The coordinator of a (full) proposal must submit a Declaration to confirm that the
    required 45% contributions will be provided (see section 3.2.2.2 Annex: Declaration of
    in-kind contribution commitment)'
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_guide_for_applicants.pdf#p.48
  verified: llm_cited
- requirement: Beneficiaries/designated beneficiaries must ensure that contractual obligations
    regarding proper implementation, conflict of interest, confidentiality, ethics, visibility,
    specific rules, information and record-keeping also apply to associated partners and subcontractors.
  quote: The consortium/designated beneficiary must ensure that their contractual obligations
    under Articles 11 (proper implementation), 12 (conflict of interests), 13 (confidentiality
    and security), 14 (ethics), 17.2 (visibility), 18 (specific rules for carrying out action),
    19 (information) and 20 (record keeping) also apply to the associated partners.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_guide_for_applicants.pdf#p.31
  verified: llm_cited
- requirement: In single-stage calls, a duly executed and signed contributing partner application
    letter must be submitted to and received by the IHI JU Programme Office within the proposal
    submission deadline for contributions to count towards the 45% threshold.
  quote: In single-stage calls, so that contributions from contributing partners can be counted
    towards the 45% threshold, a duly executed and signed contributing partner application
    letter must be submitted to and received by the IHI JU Programme Office within the proposals’
    submission deadline.
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_guide_for_applicants.pdf#p.26
  verified: llm_cited
