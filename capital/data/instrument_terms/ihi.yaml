- id: G1-01
  gate_family: G1_nexus
  requirement: Independent legal entities are eligible for EU funding if established in an
    eligible country (EU Member States including outermost regions and OCTs, Horizon Europe
    associated countries, or low- and middle-income countries).
  value: EU/Horizon Europe associated/LMIC establishment required
  intake_field: entityCountries
  quote: 'Any independent legal entity is eligible for EU funding if established in one of
    the eligible countries7, i.e.: • the Member States of the European Union, including their
    outermost regions and the Overseas Countries and Territories (OCTs); • Horizon Europe
    associated countries8; • low- and middle-income countries identified in the Horizon Europe
    Programme.'
  source:
    file: ihi_call12_calltext.pdf
    locator: ihi_guide_for_applicants.pdf#p.20
  verified: llm_cited
