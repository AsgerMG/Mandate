# The capital brain's ETL (capital/): its unit tests and schema checks.
#
# Slimmed on 2026-11-10 (Phase 0). The web app it used to build has its own
# gate (web-ci.yml), the retired one-pager brief's checks are archived (tag
# archive/2026-11-pre-pivot), and the checks that judge the LIVE corpus rather
# than the code in a push moved to the nightly (capital-nightly.yml): a push
# cannot fix a corpus value, so a red there blocked every branch for a reason no
# branch could address. This job holds no credential of ours: a throwaway
# Postgres and the repository, nothing else.
name: capital CI

on:
  pull_request:
    paths:
      - 'capital/**'
      - '!capital/project-mgmt/**'
      - '!capital/**/*.md'
      - 'mandate/vocabulary/**'
      - '.github/workflows/capital-ci.yml'
  push:
    branches: [main]
    # project-mgmt/ and markdown do not run CI: no check here reads them.
    paths:
      - 'capital/**'
      - '!capital/project-mgmt/**'
      - '!capital/**/*.md'
      - 'mandate/vocabulary/**'
      - '.github/workflows/capital-ci.yml'

concurrency:
  group: capital-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl:
    name: ETL tests + schema drift
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capital
    # A THROWAWAY Postgres in the production image, for the checks that must run
    # on the real engine (PLATFORM.md: tests never run against SQLite). It holds
    # no corpus and no credentials of ours; every check that uses it builds what
    # it reads and refuses to run against a configured DATABASE_URL.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CAPITAL_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The ETL's own requirements, because the store checks below import the
      # code they check (store.py needs psycopg; the classifier's import chain
      # needs pdfplumber). The checks that read committed files only still need
      # none of it.
      - name: Install the ETL's requirements
        run: pip install -q -r requirements.txt

      # Compile-checks every ETL module. Cheap, and it catches the class of
      # error that otherwise only surfaces mid-pipeline on a long run.
      - name: Byte-compile the ETL
        if: always()
        run: python3 -m compileall -q ETL website/build

      # The SQL schema must match what the code expects. A drifted schema file
      # is worse than none: it reads as authoritative while being wrong.
      - name: Postgres schema is committed
        if: always()
        run: test -f ETL/schema/postgres_schema.sql

      # Country name resolution lives in exactly one place. Copies drift in
      # coverage and an unresolvable name writes a NULL country rather than
      # raising, so the drift is silent.
      - name: One country map
        if: always()
        run: python3 ETL/schema/check_single_country_map.py

      # Every family whose row name is a mechanical re-casing of its own id has
      # been answered for, and an unanswered one raises rather than guessing.
      - name: Name evidence is declared
        if: always()
        run: python3 ETL/events/load/test_name_evidence_declarations.py

      - name: Country resolution
        if: always()
        run: python3 ETL/lib/test_europe_scope.py

      # Market tiers: which countries and sources the weekly refresh pulls,
      # and that a frozen OUT country does not turn the decay guard red.
      - name: Market tiers
        if: always()
        run: python3 ETL/terms/test_market_tiers.py

      # Which fund an award is credited to decides what the answer key can
      # name, and a wrong credit reads as recall rather than as an error. Runs
      # on an in-memory corpus, so it needs no database.
      - name: Award attribution
        if: always()
        run: python3 ETL/terms/test_attribution.py

      # A spec can be syntactically valid, pass the vocabulary check, and still
      # mean the opposite of its source document.
      # "Encoded rule sanity" (check_spec_sanity.py) moved to the frontend job:
      # it reads web/public/data/instrument_terms.json, which only that job
      # generates from the corpus.

      # The gate that refuses to publish a corpus that got worse. It failed a
      # run in which every axis GAINED instruments, and it could not see a loss
      # that came with a shrinking corpus at all. Both are asserted from the
      # committed baselines, so neither can come back.
      - name: Coverage gate separates loss from dilution
        if: always()
        run: python3 ETL/terms/test_coverage_gate.py

      # A failed ADEME fetch is a partial only when the row holds no window an
      # earlier run read; a catalogue that is down is a partial regardless.
      # Run 114 recorded a whole week partial over one refused connection.
      - name: A covered fetch failure does not make the week partial
        if: always()
        run: python3 ETL/terms/test_ademe_windows_outcome.py

      # Spain's open calls are discovered from the register over a window as
      # long as a call stays open, not the cadence: run 116 lost a third of ES
      # offerable because a 60-day window could not see across a 93-day gap.
      - name: BDNS discovery covers the life of a call
        if: always()
        run: python3 ETL/terms/test_bdns_discovery.py

      # A membership test between two disjoint vocabularies is dead code, and
      # dead code in the middle of the split is invisible: it does not fail, it
      # just stops splitting. `split_families()` returned channel labels while
      # the caller compared rollup ids, so the SATR scheme split was off for all
      # 22 countries for ten days and the only symptom was a placement rate in
      # another module. Credential-free fixture, milliseconds, so it runs here
      # where the corpus cannot.
      - name: The split's target set is in the caller's value space
        if: always()
        run: python3 ETL/events/load/test_split_value_space.py

      # `funding_instruments` has two provenances: rows aggregated from events,
      # and rows other scripts insert additively for funds that have paid out
      # nothing we hold (open calls, hand-curated frameworks). The rebuild read
      # "not in my output" as "disappeared" and deleted 90 of the second kind
      # plus 629 gates encoded from their own published eligibility text. The
      # 20%-of-curated guard did not fire; 629 of 7,471 is 8%.
      - name: A rebuild deletes only the instrument rows it authored
        if: always()
        run: python3 ETL/events/load/test_external_instrument_ownership.py

      # Four steps that guarded the laptop<->volume db.sqlite sync (the overwrite
      # guard and its refusal, the corpus ledger's checksums, the vault's shrink
      # drill) were removed on 2026-11-06 with the tooling they guarded: there
      # is one store now. The tooling and its record are in ETL/archive/.

      # The same class again, one column over and far more expensive: the split
      # keyed a child on `name` while the ETL renamed 430 of 453 children to the
      # Commission's registered scheme title. Placement read 11.5% instead of
      # 41.9% and seven countries instead of 22, and it looked like decay rather
      # than a dead join for a week.
      - name: The split's key is not a name something else rewrites
        if: always()
        run: python3 ETL/terms/test_split_key_is_not_a_name.py

      # An AI company was published a Bavarian film and television scheme at row
      # 4 of its memo. Not the ranker -- the embedding scored it 843rd of 1,088.
      # The scheme's sector_mix read 69% software_data_ai because its recipients,
      # every one of them registered as a motion-picture producer, carried
      # software_data_ai. A grant is evidence about the PROGRAMME, never about
      # its recipient. Credential-free, instant, no corpus.
      - name: A technology sector is claimed only where evidence licenses it
        if: always()
        run: python3 ETL/events/transform/test_sector_evidence.py

      # The corpus census runs inside the ETL image, which has requirements.txt
      # and nothing else. It reached production importing pandas three modules
      # down and recorded a ModuleNotFoundError instead of the corpus figures --
      # invisibly, because it records a failed block rather than crashing.
      - name: The census can run in the ETL image
        if: always()
        run: python3 ETL/schema/check_census_imports.py

      # ...and so must every other step the weekly cron runs. wsCZ committed
      # data/reference/activity_codebook.json on 2026-08-10; classify_taxonomy.py
      # reads it at module level; data/ is the Railway volume and git ignores it
      # whole, so the file has never existed where the cron runs. The 2026-08-16
      # run raised FileNotFoundError before its first statement and railway_cron
      # exited, skipping six steps and all four guards. Three days of no refresh,
      # and nothing said so. Hermetic: imports under an audit hook.
      - name: The cron can read, in the image, what it reads at import
        if: always()
        run: python3 ETL/schema/check_cron_image_inputs.py

      # A verdict must be inseparable from the bar it was computed against.
      # Census #11 published "eligibility 898, down from a high of 913" while
      # this repo's coverage_baseline.json says 937 -- fe75156a raised thirteen
      # fields the morning after the running image was built. The fingerprint
      # hashed only .py, so nothing said which bar produced that verdict, and
      # DRIFTED fired by luck. Hermetic: a synthetic tree in a temp directory.
      - name: A verdict carries the bar it was graded against
        if: always()
        run: python3 ETL/schema/test_verdict_bar_fingerprinted.py

      - name: Cross-language constants
        if: always()
        run: python3 ETL/schema/check_cross_language_constants.py

      # Every table has ONE declared authoritative store, the count still owned
      # by SQLite may only fall, and no module may rebuild a Postgres-owned
      # table out of a SQLite connection. That last rule is what stops
      # "Postgres is the source of truth" from being a sentence the code
      # contradicts: moving a table's declaration fails until its write path
      # has actually moved.
      # Every migration id resolves to exactly one function and one file.
      # MIGRATIONS is a hand-written dict, and two functions with the same name
      # are collapsed by Python without a word -- so the dict stays well-formed
      # while one migration silently ceases to exist. That happened four times
      # in one week, twice while it was being fixed and twice more while the
      # fixes were being merged. `--ids` reads committed source only, so it
      # needs no corpus and no credentials, which is what CI has.
      - name: Every migration id is reachable
        if: always()
        run: python3 ETL/events/load/migrations/apply.py --ids

      # The store must be rebuildable from committed DDL alone: corpus_schema.sql,
      # postgres_schema.sql and every forward migration, replayed into an empty
      # schema of the throwaway Postgres. On the day it was first replayed,
      # postgres_schema.sql could not rebuild a single table (`ARRAY`, a vector
      # with no type, a column declared twice) after three months committed.
      - name: The schema can be rebuilt from its own migrations
        if: always()
        run: python3 ETL/schema/check_schema_replay.py

      - name: One store of record per table
        if: always()
        run: python3 ETL/schema/check_store_of_record.py

      # The corpus-marks guard itself cannot run here -- CI holds no credentials
      # for the store -- so it runs in ETL/refresh.py and on the weekly cron and
      # publishes a verdict. But its SELF-TEST can: on the throwaway Postgres,
      # with its search path narrowed to pg_temp, it walks a TEMP marks table
      # through absent, empty, clean, opened-and-never-closed, partial and failed
      # and asserts the guard fails on exactly the unresolved ones. Without this
      # the only proof that the publishing guard can go red is that somebody
      # once typed the flag.
      - name: The unfinished-run guard can still fail
        if: always()
        run: python3 ETL/schema/check_corpus_marks.py --self-test
        env:
          DATABASE_URL: ${{ env.CAPITAL_TEST_DATABASE_URL }}

      # On 2026-10-18 the weekly cron's classify steps overwrote 164 curated
      # sector labels in the vault. This runs those steps twice on a seeded
      # store and fails if any curated label moves.
      - name: No re-run can displace a curated sector label
        if: always()
        run: python3 ETL/events/transform/test_sector_label_precedence.py

      # The LLM jobs run as Message Batches (mandate/llm/batch.py): a batch
      # collected a week late writes exactly what the live loop wrote, through
      # the same precedence rule, and nothing in flight is paid for twice.
      - name: Batched sector labels write what the live loop wrote, late or not
        if: always()
        run: python3 ETL/events/transform/test_taxonomy_batch.py
      - name: Batched pertinence keeps the cache's shape and never pays twice
        if: always()
        run: python3 ETL/terms/test_pertinence_batch.py

      # Committed DDL must account for every column in every store. The
      # BETWEEN-STORES half needs the corpus and DATABASE_URL, which CI has
      # neither of by design, so it runs on the weekly cron and publishes a
      # verdict; this is the half that reads committed files only. It found a
      # git conflict marker sitting inside ETL/schema/postgres_schema.sql --
      # the file the step above asserts the EXISTENCE of.
      - name: Committed DDL accounts for every column
        if: always()
        run: python3 ETL/schema/check_store_schema.py

      # What we TRACK and what we OFFER are two populations. That check has
      # MOVED to the weekly Railway cron and is deliberately not here, because
      # here it could never run: data/db.sqlite is gitignored, so on every run
      # it has ever had it printed "skipping" and returned 0. It now executes
      # against the volume-resident corpus and publishes a verdict the frontend
      # job asserts on without credentials.
      #
      # This is the check on that arrangement: every registered guard has
      # exactly one publisher, every publisher is registered, each verdict is
      # bound to its own implementation — and no workflow holds a credential of
      # ours, which is the reason the arrangement exists at all.
      - name: Every guard has a publisher, and no workflow has a secret
        if: always()
        run: python3 ETL/schema/check_guard_registry.py

