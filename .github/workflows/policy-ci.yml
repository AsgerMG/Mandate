# The policy brain had no CI at all: its 520 tests ran when someone remembered.
# Scoped to policy/ so a capital push never spends this, and vice versa.
name: policy CI

on:
  pull_request:
    paths:
      - 'policy/**'
      - '!policy/**/*.md'
      - '!policy/project-management/**'
      - '.github/workflows/policy-ci.yml'
      - 'mandate/**'
  push:
    branches: [main]
    paths:
      - 'policy/**'
      - '!policy/**/*.md'
      - '!policy/project-management/**'
      - '.github/workflows/policy-ci.yml'
      - 'mandate/**'

concurrency:
  group: policy-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: tests on a real Postgres, in the production schema layout
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: policy/uv.lock
      # 3.12 exactly: pgserver, the ephemeral Postgres the tests run against,
      # ships cp312 wheels only, and uv would otherwise pick the newest Python.
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev --python 3.12
      # No DATABASE_URL: tests/conftest.py stands up its own pgserver with
      # pgvector, in schema `policy`, exactly as production lays it out.
      - name: Tests
        run: uv run --frozen pytest -q

