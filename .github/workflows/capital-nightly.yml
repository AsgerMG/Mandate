# The report tier, nightly. Non-blocking: it never fails a branch and never
# stops a merge. data/guard_registry.json `suite_tiers` is the source of truth
# for which checks are here: every check whose tier is `report` (the failure is
# real but no founder experiences it: it grades a measurement, the suite's own
# bookkeeping, or an encoder-health ratchet). The `founder` tier runs in
# capital-ci.yml on every push, where a red stops the build.
#
# Each step may fail; the job does not. The last step writes one table of
# what was red to the run summary, which is where the owner reads it.
name: capital nightly report

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capital-nightly
  cancel-in-progress: true

jobs:
  report:
    name: report-tier checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: npm ci

      # The one credential, proved read-only before any other step holds it
      # (ETL/schema/check_guard_registry.py rule 7), then the site data every
      # check below reads, generated from the corpus as the CI job does.
      - name: The corpus credential is read-only
        working-directory: capital
        env:
          CAPITAL_RO_DATABASE_URL: ${{ secrets.CAPITAL_RO_DATABASE_URL }}
        run: |
          pip install --quiet 'psycopg[binary]==3.3.4'
          python3 ETL/schema/check_readonly_credential.py
      - name: Site data from the corpus
        env:
          CAPITAL_RO_DATABASE_URL: ${{ secrets.CAPITAL_RO_DATABASE_URL }}
        run: python3 ../capital/website/build/build_site_data.py --prebuild

      # ── report tier ──────────────────────────────────────────────────────
      - id: red_debt
        name: a red check is owned
        continue-on-error: true
        run: npx tsx scripts/check_red_debt.ts && npx vitest run scripts/check_red_debt.test.ts
      - id: check_reachability
        name: a rule's check can actually run
        continue-on-error: true
        run: npx tsx scripts/check_check_reachability.ts
      - id: published_figures
        name: published figures
        continue-on-error: true
        run: npx tsx scripts/check_published_figures.ts
      - id: env_loader
        name: one env loader
        continue-on-error: true
        run: npx tsx scripts/check_env_loader.ts
      - id: stage_declaration
        name: a harness declares the stages it does not run
        continue-on-error: true
        run: npx tsx scripts/check_stage_declaration.ts
      - id: store_columns
        name: both stores select the same columns
        continue-on-error: true
        run: npx tsx scripts/check_store_columns.ts
      - id: comparator_admits
        name: a filter can admit someone
        continue-on-error: true
        run: npx tsx scripts/check_comparator_admits.ts
      - id: open_question_class
        name: open questions still cover the corpus
        continue-on-error: true
        run: npx tsx scripts/check_open_question_class.ts
      - id: winner_not_blocked
        name: a winner is never screened out
        continue-on-error: true
        run: npx tsx scripts/check_winner_not_blocked.ts
      - id: harness_intake
        name: harness answers as the founder
        continue-on-error: true
        run: npx tsx scripts/check_harness_intake.ts
      - id: peer_prior_canary
        name: peer prior canary
        continue-on-error: true
        run: npx tsx scripts/check_peer_prior_canary.ts
      - id: extracted_quotes
        name: quotations match documents
        continue-on-error: true
        run: npx tsx scripts/check_extracted_quotes.ts
      - id: artifact_reachability
        name: every committed artifact can be rebuilt
        continue-on-error: true
        working-directory: capital
        run: python3 ETL/schema/check_artifact_reachability.py
      # Not tiered: it asks the DEPLOYMENT (its code-only verdict route, no
      # model call) which corpus it is ranking on. A property of production,
      # not of a branch, so it belongs on a clock.
      - id: prod_corpus
        name: the deployment ranks on the corpus of record
        continue-on-error: true
        run: npx tsx scripts/check_prod_corpus.ts

      - name: Report
        if: always()
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          steps = json.loads(os.environ["OUTCOMES"])
          rows = [(k, v.get("outcome")) for k, v in steps.items()]
          red = [k for k, o in rows if o == "failure"]
          print("## capital nightly report\n")
          print(f"{len(rows) - len(red)} of {len(rows)} report-tier checks green; red: {', '.join(red) or 'none'}\n")
          print("| check | outcome |\n|---|---|")
          for k, o in rows:
              print(f"| {k} | {o} |")
          PY
