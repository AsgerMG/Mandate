# Is the weekly refresh still running, and is the site still serving what it
# produced?
#
# ── Why this runs on a clock and not on a push ─────────────────────────────
# The ETL runs on a clock and the drift starts the moment it does, so a
# push-triggered guard has a drift window equal to the time until somebody next
# pushes: measured over this repo's own history that is a median of 1.4 days but
# it is UNBOUNDED, and the quiet weeks when nobody pushes are exactly the weeks
# nobody is looking. `python3 ETL/lib/drift_window.py` re-derives both numbers
# from the git log.
#
# So this runs on the same clock as the ETL, a few hours behind it.
#
# ── What changed, and why it matters more than the schedule ────────────────
# This workflow used to hold `secrets.DATABASE_URL` and connect to the
# production Postgres — the store that holds every award, company and fund we
# have. That made a compromised workflow, a compromised action, or a
# pull_request_target mistake into a data breach rather than a source leak, and
# it bought only a scheduled check.
#
# It no longer holds any credential. The guards that need the corpus run where
# the corpus already is — inside the weekly Railway container, which has the
# credentials because it cannot work without them — and publish a verdict to
# `guard_verdicts`. The site serves those verdicts, without the `detail` column,
# at /api/guards. This reads that over plain HTTPS.
#
#   ETL/events/extract/railway_cron.py    runs the guards, publishes
#   data/guard_registry.json              the one list both sides read
#   scripts/check_verdicts.ts             asserts, credential-free
#
# ── Why --full here and not in CI ──────────────────────────────────────────
# `--full` adds the two failures that are about TIME: SILENT (no verdict inside
# the cadence the verdicts themselves establish — the weekly run has stopped)
# and STALE (a census was published without this guard's verdict — the run
# happened with a step missing). Neither belongs on a pull request, where they
# would red a branch for the passage of a Sunday. Both belong here, because
# here is the only thing that runs when nobody pushes.
#
# ── The one thing it must never do ─────────────────────────────────────────
# Pass because something was missing. An unreachable feed, an absent verdict and
# a verdict bound to different code are all hard failures in check_verdicts.ts,
# for the same reason the DATABASE_URL guard clause used to exist here: a guard
# that reports success having checked nothing is the defect it exists to catch.
name: Corpus currency

on:
  schedule:
    # 08:00 UTC Sunday — five hours after the ETL cron (0 3 * * 0), which is
    # comfortably longer than any run has taken, and still Sunday morning so a
    # failure has the week in front of it rather than behind it.
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  currency:
    name: did the guards run, and is the site serving what they saw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # For the one implementation of the code fingerprint a verdict is bound
      # to (ETL/lib/guard_verdicts.py). Not for database access; there is none.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: web

      # Every registered guard: has it published, is it green, was it judged on
      # this code, and — the part only a scheduled run can ask — did it publish
      # THIS week.
      - name: Every guard has a fresh, green verdict
        working-directory: web
        run: npx tsx scripts/check_verdicts.ts --full

      # The site's committed headline figures against the census the ETL
      # published. Reads the same feed; no credential.
      - name: Site vs the ETL's census
        if: always()
        working-directory: web
        run: npx tsx scripts/check_corpus_census.ts

      # A failed scheduled run emails whoever owns the repo and is then never
      # seen again. An issue persists, accumulates the evidence, and closes
      # itself when the next run passes — so "still broken" and "fixed" are
      # both visible without anybody checking a workflow list.
      - name: Open or update the drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Corpus currency: a guard is silent, stale or red';
            const body = [
              `The scheduled currency check failed on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'Read the failure word first — the four mean four different things and',
              'three of them are NOT fixed by republishing:',
              '',
              '- **SILENT** — nothing published inside the expected cadence. The weekly',
              '  run has stopped, or it is no longer publishing. `make verify-cron`.',
              '- **STALE** — a census was published without this guard\'s verdict, so the',
              '  run happened with a step missing. `ETL/events/extract/railway_cron.py`.',
              '- **DEGRADED** — the guard ran and found something wrong. Look at what it',
              '  guards, not at the guard.',
              '- **DRIFTED** — the verdict was produced against different code. For a',
              '  weekly guard the container is behind main (`python3 ETL/lib/verify_cron.py',
              '  --deploy`); for an on_change guard, re-run it where the credentials are.',
              '',
              'Only a STALE headline figure from check_corpus_census is fixed by:',
              '',
              '```',
              'make republish',
              '```',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'corpus-currency',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['corpus-currency'],
              });
            }

      - name: Close the drift issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'corpus-currency',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'Resolved: every guard has a fresh, green verdict taken on this code.',
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
            }
