# The shared platform code (mandate/): grounding store and embedding module.
# Tests run on the production image (pgvector 0.8, so halfvec is the real type,
# not the stand-in pgserver's pgvector 0.6 forces locally).
name: mandate-ci
on:
  pull_request:
    paths: ['mandate/**', 'capital/ETL/lib/grounded_inputs.py', 'web/lib/embedding.ts', 'web/lib/mandate/**',
            'capital/data/vocabularies.json', '**/*.py', '**/*.ts', '.github/workflows/mandate-ci.yml']
  push:
    branches: [main]
    paths: ['mandate/**', 'capital/ETL/lib/grounded_inputs.py', 'web/lib/embedding.ts', 'web/lib/mandate/**',
            'capital/data/vocabularies.json', '**/*.py', '**/*.ts', '.github/workflows/mandate-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MANDATE_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]>=3.2' 'httpx>=0.27' pytest python-dotenv
      # no model named, no embeddings API called, outside mandate/embedding;
      # web/lib/embedding.ts's generated block equals spaces.json
      - run: python3 mandate/embedding/check_boundary.py
      # ONE company vocabulary: projections current, and no brain's own copy
      # (capital TAXONOMY/vocabularies.json/country picker, policy seeds and
      # question options) has drifted from mandate/vocabulary/vocabulary.json
      - run: python3 mandate/vocabulary/check.py
      - run: python3 mandate/profile/fixtures.py --check
      - run: PYTHONPATH=. python3 -m pytest mandate/tests -q
