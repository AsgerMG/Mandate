# Keeps the 8 high-severity findings from the July 2026 audit from recurring
# silently. Weekly, grouped, so review is one PR rather than a stream.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    # Major versions are migrations, not maintenance: each is its own change,
    # made on purpose. Dependabot opened ten of them the morning the repos
    # merged, nearly all red, while the foundation underneath was moving.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: uv
    directory: /policy
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Major versions are migrations, not maintenance: each is its own change,
    # made on purpose. Dependabot opened ten of them the morning the repos
    # merged, nearly all red, while the foundation underneath was moving.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
