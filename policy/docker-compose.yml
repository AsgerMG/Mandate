# Optional local Postgres + pgvector for when Docker is available.
# Not required if you point DATABASE_URL at a managed Postgres (e.g. Neon).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ept
      POSTGRES_PASSWORD: ept
      POSTGRES_DB: europoltracker
    ports:
      - "5432:5432"
    volumes:
      - ept_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ept -d europoltracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ept_pgdata:
