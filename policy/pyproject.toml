[project]
name = "regina"
version = "0.1.0"
description = "Regina — regulatory intelligence analyst. Automated ETL + structured corpus for EU/FR/DE tech-policy documents, grounded for citation-based RAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.4",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "typer>=0.12",
    "structlog>=24.2",
    "python-dateutil>=2.9",
    # Embedded Postgres + pgvector powers the default 'local' DB mode (zero
    # setup). Production can ignore it by setting DATABASE_URL to a managed
    # Postgres (e.g. Neon).
    "pgserver>=0.1.4",
    "fastembed>=0.8.0",
    "anthropic>=0.112.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fpdf2>=2.7",
    "python-dotenv>=1.2.2",
    # Real-browser rendering for the one source behind a JS bot-challenge
    # with no machine-readable fallback (EP plenary verbatim reports —
    # ep_verbatim.py). Needs `uv run playwright install chromium` once after
    # install; every other adapter stays plain-HTTP via httpx.
    "playwright>=1.61",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
# The single automated-collection trigger.
regina = "etl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Folders mirror the architecture: data + ETL + intelligence are the packages.
# All Python lives in two packages: the data layer and the ETL/backend layer
# (ingestion, enrichment, intelligence/RAG, and the API the website calls).
packages = ["data", "etl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer requires calls like typer.Option(...) as parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
pythonpath = ["."]
